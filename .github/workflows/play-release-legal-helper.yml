name: Play release legal helper

on:
  push:
    branches:
      - mobile/08-play-release-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[play-legal-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/08-play-release-pipeline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Patch Play legal surfaces
        run: bun scripts/patch-play-release-legal.ts
      - name: Format legal surfaces
        run: bunx prettier --write public/privacy.html public/terms.html
      - name: Commit legal finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update legal surfaces for Google Play [play-legal-finalized]"
          git push
