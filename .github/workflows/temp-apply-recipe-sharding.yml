name: Temporary apply recipe certification sharding

on:
    push:
        branches:
            - fix/production-cert-recipe-sharding

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/production-cert-recipe-sharding
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: python3 scripts/certification/apply-recipe-sharding-patch.py
            - run: bunx prettier --write scripts/certification/production-mcp-corpus.ts scripts/certification/recipe-corpus-sharding.ts scripts/certification/recipe-corpus-sharding.test.ts
            - run: bun test scripts/certification/recipe-corpus-sharding.test.ts
            - name: Commit patch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/certification/production-mcp-corpus.ts scripts/certification/recipe-corpus-sharding.ts scripts/certification/recipe-corpus-sharding.test.ts
                  git diff --cached --quiet || git commit -m "fix: shard production recipe certification users"
                  git push origin HEAD:fix/production-cert-recipe-sharding
