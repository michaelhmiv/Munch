name: Generate Recipe Fallback Lock

on:
    push:
        branches:
            - feature/recipe-import-resilience
        paths:
            - package.json

permissions:
    contents: write

jobs:
    lock:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: feature/recipe-import-resilience
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Generate lockfile
              run: bun install
            - name: Commit lockfile
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json bun.lock
                  if git diff --cached --quiet; then
                    exit 0
                  fi
                  git commit -m "chore: lock recipe fallback transport"
                  git push origin HEAD:feature/recipe-import-resilience
