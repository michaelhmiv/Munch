name: Submission policy codemod

on:
  push:
    branches:
      - feat/openai-submission-readiness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[submission-policy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openai-submission-readiness
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Finalize public policies and support details
        shell: python
        run: |
          from pathlib import Path

          terms = Path("public/terms.html")
          text = terms.read_text()
          text = text.replace(
              "Last updated: August 4, 2026",
              "Last updated: August 5, 2026",
          )
          old_plans = '''                        <h2>
                            2. Free access, Premium, trial, and cancellation
                        </h2>
                        <p>
                            Munch Free provides permanent core access without a
                            payment method, subject to the limits shown on the
                            Munch website. Connecting Munch to ChatGPT does not
                            require Premium.
                        </p>
                        <p>
                            Munch Premium is purchased independently on the
                            Munch website. The current offer is a 30-day trial
                            followed by $4.99 per month, plus applicable taxes.
                            Payment information is collected by Stripe when the
                            Premium trial begins. Trial availability may be
                            limited to eligible accounts.
                        </p>
                        <p>
                            Unless canceled before the trial ends, Premium
                            automatically converts to a paid monthly
                            subscription and renews each month until canceled.
                            You authorize Stripe to charge the saved payment
                            method for recurring fees and applicable taxes.
                        </p>
                        <p>
                            Payment methods, invoices, and cancellation are
                            managed through the Stripe-hosted customer portal
                            linked from the Munch account portal. Cancellation
                            normally takes effect at the end of the current paid
                            period unless Stripe or applicable law provides
                            otherwise. Canceling Premium does not delete the
                            Munch account or personal data; the account returns
                            to applicable Free capabilities.
                        </p>
                        <p>
                            Promotions, refunds, credits, and trial eligibility
                            may be limited. Except where required by law or
                            expressly stated, fees already charged are
                            non-refundable.
                        </p>'''
          new_plans = '''                        <h2>2. Free access, Premium, and cancellation</h2>
                        <p>
                            Munch Free provides permanent core access without a
                            payment method, subject to the limits shown on the
                            Munch website. Connecting Munch to ChatGPT does not
                            require Premium.
                        </p>
                        <p>
                            Munch Premium is an optional subscription purchased
                            independently on the Munch website for $4.99 per
                            month, plus applicable taxes. The paid subscription
                            begins when Stripe confirms checkout and renews each
                            month until canceled. You authorize Stripe to charge
                            the saved payment method for recurring fees and
                            applicable taxes.
                        </p>
                        <p>
                            Payment methods, invoices, and cancellation are
                            managed through the Stripe-hosted customer portal
                            linked from the Munch account portal. Cancellation
                            normally takes effect at the end of the current paid
                            period unless Stripe or applicable law provides
                            otherwise. Canceling Premium does not delete the
                            Munch account or personal data; the account returns
                            to applicable Free capabilities.
                        </p>
                        <p>
                            Promotions, refunds, and credits may be limited.
                            Except where required by law or expressly stated,
                            fees already charged are non-refundable.
                        </p>'''
          assert text.count(old_plans) == 1
          text = text.replace(old_plans, new_plans)

          old_law = '''                        <p>
                            Formal governing-law and legal-contact provisions
                            may be supplemented before broader commercial
                            availability. Consumer rights that cannot lawfully
                            be waived remain unaffected.
                        </p>
                        <p>
                            Do not place sensitive nutrition, household, or
                            account information in public GitHub issues.
                            Official support and legal contact information will
                            be provided through Munch account communications and
                            website notices.
                        </p>'''
          new_law = '''                        <p>
                            These terms are governed by the laws of the State of
                            South Carolina, without regard to conflict-of-law
                            principles. Any dispute that must be resolved in
                            court will be brought in a state or federal court
                            with jurisdiction in South Carolina, except where
                            applicable consumer law requires another forum.
                            Consumer rights that cannot lawfully be waived remain
                            unaffected.
                        </p>
                        <p>
                            Do not place sensitive nutrition, household, or
                            account information in public GitHub issues. Send
                            support and legal notices to
                            <a href="mailto:support@munch.business"
                                >support@munch.business</a
                            >. Munch may send service and legal notices to the
                            email address associated with the account.
                        </p>'''
          assert text.count(old_law) == 1
          text = text.replace(old_law, new_law)
          assert "trial" not in text.lower()
          terms.write_text(text)

          privacy = Path("public/privacy.html")
          text = privacy.read_text()
          text = text.replace(
              "Last updated: August 4, 2026",
              "Last updated: August 5, 2026",
          )
          text = text.replace(
              "subscription, entitlement,\n                                trial, renewal, cancellation, and payment-status",
              "subscription, entitlement,\n                                renewal, cancellation, and payment-status",
          )
          old_retention = '''                        <p>
                            Active account and workspace data is retained while
                            needed to provide the service. Expired login
                            challenges, sessions, OAuth artifacts, invitation
                            tokens, export files, and operational records are
                            subject to bounded cleanup. Exports expire after one
                            hour. Backups and legally required billing records
                            can persist after deletion for a limited period.
                        </p>'''
          new_retention = '''                        <p>
                            Active account and workspace data is retained while
                            the account or workspace remains active. Passwordless
                            login challenges normally expire after 10 minutes;
                            website sessions expire after 30 days and may be
                            refreshed during active use. OAuth authorization
                            codes expire after 5 minutes, access tokens after 15
                            minutes, and refresh tokens after 90 days. Expired or
                            revoked authentication artifacts remain only until
                            the next applicable cleanup cycle.
                        </p>
                        <p>
                            Downloadable account exports expire after one hour.
                            Operational and security records are retained only
                            for the period reasonably needed to investigate
                            failures, prevent abuse, respond to incidents, and
                            meet legal obligations; Munch does not intentionally
                            place nutrition-record contents in ordinary access
                            logs. Database backups may retain deleted data until
                            the hosting provider's configured backup rotation
                            overwrites them. Stripe may retain billing,
                            accounting, fraud, dispute, and tax records for the
                            periods required by law and its own policies.
                        </p>'''
          assert text.count(old_retention) == 1
          text = text.replace(old_retention, new_retention)
          old_contact = '''                        <p>
                            Do not place sensitive nutrition or account data in
                            public GitHub issues. Privacy and support contact
                            information will be provided through official Munch
                            account communications and website notices.
                        </p>'''
          new_contact = '''                        <p>
                            Do not place sensitive nutrition or account data in
                            public GitHub issues. Send privacy and support
                            requests to
                            <a href="mailto:support@munch.business"
                                >support@munch.business</a
                            >. Report security vulnerabilities privately to
                            <a href="mailto:security@munch.business"
                                >security@munch.business</a
                            >.
                        </p>'''
          assert text.count(old_contact) == 1
          text = text.replace(old_contact, new_contact)
          assert "trial" not in text.lower()
          privacy.write_text(text)

          help_page = Path("public/help.html")
          text = help_page.read_text()
          old_problem = '''                        <p>
                            Use private security reporting for vulnerabilities
                            and avoid placing sensitive account or nutrition
                            data in public issues.
                        </p>
                        <a class="text-link" href="/security"
                            >Security guidance →</a
                        >'''
          new_problem = '''                        <p>
                            Email
                            <a href="mailto:support@munch.business"
                                >support@munch.business</a
                            > for account or product help. Use private security
                            reporting for vulnerabilities and avoid placing
                            sensitive account or nutrition data in public issues.
                        </p>
                        <a class="text-link" href="/security"
                            >Security guidance →</a
                        >'''
          assert text.count(old_problem) == 1
          text = text.replace(old_problem, new_problem)
          help_page.write_text(text)

      - name: Format and validate public surfaces
        run: |
          bun install --frozen-lockfile
          bunx prettier --write public/terms.html public/privacy.html public/help.html
          bun scripts/ui-surface-smoke.ts
          bun run commerce:check

      - name: Commit policy updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/terms.html public/privacy.html public/help.html
          git commit -m "docs(legal): finalize no-trial policies and support contacts [submission-policy]"
          git push origin HEAD:feat/openai-submission-readiness
