name: Certification Finalize

on:
  push:
    branches:
      - feat/better-auth-certification

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ !contains(github.event.head_commit.message, 'chore: finalize certification assets') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/better-auth-certification
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Remove one-use workflow
        run: rm .github/workflows/certification-finalize.yml
      - name: Format certification assets
        run: >-
          bunx prettier --write
          docs/deployment/better-auth-certification.md
          docs/deployment/better-auth-cutover.md
          scripts/certification/public.ts
          .prettierignore
      - name: Verify repository
        run: |
          bun run format:check
          bun run typecheck
          bun test
      - name: Commit finalized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize certification assets"
          git push origin HEAD:feat/better-auth-certification
