name: Temporary wire production food matcher

on:
    pull_request:
        branches:
            - main

permissions:
    contents: write

jobs:
    apply:
        if: github.head_ref == 'fix/production-food-corpus-name-match'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/production-food-corpus-name-match
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Wire shared matcher
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  import re

                  path = Path('scripts/certification/production-mcp-corpus.ts')
                  text = path.read_text()
                  import_line = 'import { RECIPE_IMPORT_CORPUS } from "../../src/recipe-import/fixtures/recipe-corpus.js";\n'
                  new_import = import_line + 'import { foodNameMatches } from "./food-name-match.js";\n'
                  if text.count(import_line) != 1:
                      raise SystemExit('recipe corpus import anchor changed')
                  text = text.replace(import_line, new_import, 1)

                  pattern = re.compile(r'\nfunction nameMatches\(name: string, expected: readonly string\[\]\): boolean \{.*?\n\}\n', re.S)
                  text, count = pattern.subn('\n', text, count=1)
                  if count != 1:
                      raise SystemExit('nameMatches helper anchor changed')
                  if text.count('nameMatches(name, expected)') != 1:
                      raise SystemExit('nameMatches call anchor changed')
                  text = text.replace('nameMatches(name, expected)', 'foodNameMatches(name, expected)', 1)
                  path.write_text(text)
                  PY
                  bunx prettier --write scripts/certification/production-mcp-corpus.ts scripts/certification/food-name-match.ts scripts/certification/food-name-match.test.ts
            - name: Commit matcher wiring
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/certification/production-mcp-corpus.ts scripts/certification/food-name-match.ts scripts/certification/food-name-match.test.ts
                  git diff --cached --quiet || git commit -m "fix: use plural-aware production food matcher"
                  git push origin HEAD:fix/production-food-corpus-name-match
