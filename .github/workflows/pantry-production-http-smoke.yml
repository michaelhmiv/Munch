name: Pantry production HTTP smoke

on:
    push:
        branches:
            - feat/pantry-intelligence-planning

permissions:
    contents: read

jobs:
    smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Verify production readiness and Pantry boundaries
              shell: bash
              run: |
                  set -euo pipefail
                  base="https://munch.business"

                  ready_code="$(curl --fail-with-body --silent --show-error --output /tmp/ready --write-out '%{http_code}' "$base/health/ready")"
                  test "$ready_code" = "200"
                  grep -Eq 'ready|ok|healthy' /tmp/ready

                  pantry_code="$(curl --fail-with-body --silent --show-error --output /tmp/pantry --write-out '%{http_code}' "$base/app/pantry")"
                  test "$pantry_code" = "200"
                  grep -q 'What can I make?' /tmp/pantry
                  grep -q 'pantry-enabled' /tmp/pantry

                  settings_code="$(curl --silent --show-error --output /tmp/settings --write-out '%{http_code}' "$base/api/app/pantry/settings")"
                  case "$settings_code" in
                    401|403) ;;
                    *) echo "Expected Pantry settings auth rejection, got HTTP $settings_code" >&2; cat /tmp/settings >&2; exit 1 ;;
                  esac

                  ideas_code="$(curl --silent --show-error --output /tmp/ideas --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"scope":"personal","goal":"high_protein"}' "$base/api/app/pantry/meal-ideas")"
                  case "$ideas_code" in
                    401|403) ;;
                    *) echo "Expected Pantry meal-ideas auth rejection, got HTTP $ideas_code" >&2; cat /tmp/ideas >&2; exit 1 ;;
                  esac

                  echo "Production Pantry HTTP smoke passed: ready=$ready_code pantry=$pantry_code settings=$settings_code ideas=$ideas_code"
