name: Temporary performance branch formatter

on:
  push:
    branches:
      - perf/nutrition-ingestion-latency

permissions:
  contents: write

concurrency:
  group: format-performance-temp
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/nutrition-ingestion-latency
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format performance work
        run: >-
          bunx prettier --write
          src/analytics.ts
          src/meal-detail-tools.ts
          src/mcp-latency.ts
          src/mcp-latency.test.ts
          src/mcp-runtime.ts
          src/recipe-planning-tools.ts
          src/recipe-planning-tools.test.ts
          src/food-providers/catalog-repository.ts
          src/food-providers/service.ts
          src/food-providers/service.test.ts
          src/food-providers/registry.ts
          scripts/food-catalog-ingestion-smoke.ts
          scripts/food-provider-live-smoke.ts
          .github/workflows/usda-food-catalog-corpus.yml
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/usda-food-catalog-corpus.yml
          git commit -m "Format performance optimization changes"
          git push origin HEAD:perf/nutrition-ingestion-latency
