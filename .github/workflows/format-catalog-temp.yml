name: Temporary performance branch patcher

on:
  push:
    branches:
      - perf/nutrition-ingestion-latency

permissions:
  contents: write

concurrency:
  group: performance-branch-patcher
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/nutrition-ingestion-latency
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply deterministic source patches
        run: python3 scripts/apply-perf-branch-patches.py
      - name: Format touched source files
        run: >-
          bunx prettier --write
          src/analytics.ts
          src/meal-detail-tools.ts
          src/mcp-latency.ts
          src/mcp-runtime.ts
          src/recipe-planning-tools.ts
          src/recipe-planning-tools.test.ts
          src/food-providers/catalog-repository.ts
          scripts/apply-perf-branch-patches.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/apply-perf-branch-patches.py
          git commit -m "Complete performance instrumentation and retry fixes"
          git push origin HEAD:perf/nutrition-ingestion-latency
