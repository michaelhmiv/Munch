name: Android

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Keep each main-branch run independent so every merge gets a distribution attempt.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify installed-app architecture
        run: bun scripts/mobile-shell-smoke.ts
      - name: Build local mobile web bundle
        run: bun run mobile:web
      - name: Synchronize Capacitor Android project
        run: |
          npx cap sync android
          bun scripts/configure-mobile-android.ts
      - name: Prepare Firebase config for trusted main build
        if: github.event_name == 'push'
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            echo "::error::Missing FIREBASE_ANDROID_CONFIG_JSON repository secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
          jq -e --arg project "munch-android-bf1cd" --arg package "business.munch.app" \
            '.project_info.project_id == $project and any(.client[]; .client_info.android_client_info.package_name == $package)' \
            android/app/google-services.json > /dev/null
          echo "Using the Firebase app config from the Actions secret."
      - name: Prepare Firebase fixture for pull requests
        if: github.event_name == 'pull_request'
        run: cp android/app/src/test/fixtures/google-services.json android/app/google-services.json
      - name: Verify native project is reproducible
        run: git diff --exit-code -- android package.json bun.lock
      - name: Lint, unit test, and assemble Android debug app
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: munch-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Distribute Android APK to Firebase App Distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON repository secret. Configure a Firebase App Distribution service account before merging this workflow."
            exit 1
          fi

          service_account_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$service_account_file"
          chmod 600 "$service_account_file"
          trap 'rm -f "$service_account_file"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"

          firebase_app_id="$(jq -er '.client[] | select(.client_info.android_client_info.package_name == "business.munch.app") | .client_info.mobilesdk_app_id' android/app/google-services.json)"
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          npm install --global firebase-tools
          firebase appdistribution:distribute "$apk_path" \
            --app "$firebase_app_id" \
            --testers "michaelhmiv@gmail.com" \
            --release-notes "Automated Android build from commit ${GITHUB_SHA::7}"
