name: Android

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify installed-app and release architecture
        run: |
          bun scripts/mobile-shell-smoke.ts
          bun scripts/mobile-release-check.ts
      - name: Build local mobile web bundle
        run: bun run mobile:web
      - name: Synchronize Capacitor Android project
        run: |
          npx cap sync android
          bun scripts/configure-mobile-android.ts
      - name: Verify native project is reproducible
        run: git diff --exit-code -- android package.json bun.lock
      - name: Generate disposable CI release key
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/ci-release-test.jks \
            -storepass ci-release-password \
            -alias ci-release \
            -keypass ci-release-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Munch CI,O=Munch,C=US"
      - name: Lint, unit test, assemble debug, and build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ../ci-release-test.jks
          ANDROID_KEYSTORE_PASSWORD: ci-release-password
          ANDROID_KEY_ALIAS: ci-release
          ANDROID_KEY_PASSWORD: ci-release-password
        run: ./gradlew lintDebug lintRelease testDebugUnitTest assembleDebug bundleRelease
      - name: Verify CI release bundle signature
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > /tmp/munch-ci-aab-signature.txt
          sha256sum "$AAB" > /tmp/munch-ci-aab-sha256.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: munch-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed CI release bundle
        uses: actions/upload-artifact@v4
        with:
          name: munch-android-release-ci
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            /tmp/munch-ci-aab-sha256.txt
          if-no-files-found: error
          retention-days: 7
