name: Android

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify installed-app architecture
        run: bun scripts/mobile-shell-smoke.ts
      - name: Build local mobile web bundle
        run: bun run mobile:web
      - name: Synchronize Capacitor Android project
        run: |
          npx cap sync android
          bun scripts/configure-mobile-android.ts
      - name: Prepare Firebase config for trusted main build
        if: github.event_name == 'push'
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
            jq -e --arg project "munch-android-bf1cd" --arg package "business.munch.app" \
              '.project_info.project_id == $project and any(.client[]; .client_info.android_client_info.package_name == $package)' \
              android/app/google-services.json > /dev/null
            echo "Using the Firebase app config from the Actions secret."
          else
            cp android/app/src/test/fixtures/google-services.json android/app/google-services.json
            echo "Firebase secret is unset; using the non-production test fixture."
          fi
      - name: Prepare Firebase fixture for pull requests
        if: github.event_name == 'pull_request'
        run: cp android/app/src/test/fixtures/google-services.json android/app/google-services.json
      - name: Verify native project is reproducible
        run: git diff --exit-code -- android package.json bun.lock
      - name: Lint, unit test, and assemble Android debug app
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: munch-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
