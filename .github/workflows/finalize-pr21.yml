name: Finalize PR 21

on:
  pull_request:
    types:
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finalize-pr21
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/munch-frontend-overhaul
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset generator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply final product and brand changes
        run: python scripts/finalize-pr21.py

      - name: Add missing runtime and type dependencies
        run: |
          bun add zod
          bun add --dev @types/node

      - name: Format repository
        run: bunx prettier --write .

      - name: Verify public brand gate
        run: bun run brand:check

      - name: Commit finalized branch
        run: |
          git checkout -- .github/workflows/ci.yml .github/workflows/finalize-pr21.yml
          rm scripts/finalize-pr21.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete ChatGPT-first Munch launch surface"
          git push origin HEAD:feat/munch-frontend-overhaul
