name: Format MCP auth fix

on:
    pull_request:

permissions:
    contents: write

jobs:
    format:
        if: github.head_ref == 'fix/better-auth-mcp-bearer-discovery' && github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/better-auth-mcp-bearer-discovery
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: bunx prettier --write src/middleware.ts scripts/better-auth-browser-oauth-smoke.ts
            - name: Commit formatting
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add src/middleware.ts scripts/better-auth-browser-oauth-smoke.ts
                  git diff --cached --quiet || git commit -m "style: format MCP auth discovery fix"
                  git push origin HEAD:fix/better-auth-mcp-bearer-discovery
