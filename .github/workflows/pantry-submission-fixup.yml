name: Pantry submission fixup

on:
  push:
    branches:
      - feat/pantry-inventory-reconciliation

permissions:
  contents: write

concurrency:
  group: pantry-submission-fixup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-inventory-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply Pantry submission contract changes
        run: python3 scripts/pantry-submission-fixup.py
      - name: Format changed source
        run: bunx prettier --write src/inventory/tools.ts scripts/generate-openai-submission.ts
      - name: Regenerate OpenAI submission package
        run: bun scripts/generate-openai-submission.ts
      - name: Verify OpenAI submission package
        run: bun run submission:check
      - name: Verify capability contracts
        run: bun scripts/capability-manifest-check.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Run inventory unit tests
        run: bun test src/inventory
      - name: Commit verified submission changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inventory/tools.ts scripts/generate-openai-submission.ts chatgpt-app-submission.json docs/openai-submission/tool-inventory.md
          git commit -m "fix: confirm destructive Pantry changes and refresh submission"
          git push origin HEAD:feat/pantry-inventory-reconciliation
