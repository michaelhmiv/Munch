name: Supabase runtime audit

on:
  push:
    branches:
      - fix/remove-supabase-runtime

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Runtime references
        shell: bash
        run: |
          set -u
          echo '=== SUPABASE identifiers ==='
          grep -RInE --exclude-dir=.git --exclude-dir=supabase --exclude-dir=docs --exclude=CLAUDE.md 'SUPABASE_|getSupabase|@supabase/supabase-js|inherited-supabase|/supabase\.js' . || true
          echo '=== Source imports from supabase facade ==='
          grep -RInE 'from .\./supabase\.js.' src || true
          echo '=== Package references ==='
          grep -nEi 'supabase' package.json bun.lock .env.example README.md railway.json || true
          echo '=== Legacy directory ==='
          find supabase -maxdepth 2 -type f -print 2>/dev/null || true
