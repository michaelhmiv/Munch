name: Mobile format helper

on:
  push:
    branches:
      - mobile/02-bearer-auth-clean

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/02-bearer-auth-clean
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format and print changed files
        run: |
          bunx prettier --write scripts/better-auth-mobile-bearer-smoke.ts .github/workflows/mobile-auth.yml
          echo '---SMOKE---'
          cat scripts/better-auth-mobile-bearer-smoke.ts
          echo '---WORKFLOW---'
          cat .github/workflows/mobile-auth.yml
