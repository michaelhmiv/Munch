name: Mobile format helper

on:
  push:
    branches:
      - mobile/01-capability-contracts

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/01-capability-contracts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/mobile/capabilities.ts src/mobile/capabilities.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mobile/capabilities.ts src/mobile/capabilities.test.ts
          git commit -m "Format mobile capability contract [mobile-format]"
          git push
