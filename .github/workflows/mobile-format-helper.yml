name: Mobile format helper

on:
  push:
    branches:
      - mobile/02-bearer-auth-clean

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/02-bearer-auth-clean
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: >-
          bunx prettier --write
          src/auth/auth.ts
          src/accounts/session.ts
          src/accounts/csrf.ts
          scripts/better-auth-mobile-bearer-smoke.ts
          .github/workflows/mobile-auth.yml
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth/auth.ts src/accounts/session.ts src/accounts/csrf.ts scripts/better-auth-mobile-bearer-smoke.ts .github/workflows/mobile-auth.yml
          git commit -m "Format mobile bearer authentication [mobile-format]"
          git push
