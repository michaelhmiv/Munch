name: Mobile format helper

on:
  push:
    branches:
      - mobile/04-android-shell

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-format-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/04-android-shell
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply repository formatting
        run: |
          bunx prettier --write \
            mobile/mobile-entry.js \
            mobile/mobile-login.html \
            mobile/runtime.js \
            scripts/build-mobile-web.ts \
            scripts/configure-mobile-android.ts \
            scripts/mobile-shell-smoke.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile scripts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Android foundation [mobile-format-generated]"
          git push
