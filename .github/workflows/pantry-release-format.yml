name: Pantry release format

on:
  push:
    branches:
      - feat/pantry-intelligence-planning

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-intelligence-planning
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format live smoke and refresh submission package
        run: |
          bunx prettier --write scripts/openrouter-pantry-planning-live-smoke.ts
          bun run submission:generate
          bun run submission:check
      - name: Commit release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/openrouter-pantry-planning-live-smoke.ts chatgpt-app-submission.json docs/openai-submission/tool-inventory.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize Pantry release artifacts"
            git push origin HEAD:feat/pantry-intelligence-planning
          fi
