name: Format food catalog branch

on:
  push:
    branches:
      - feat/persistent-food-catalog

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-food-catalog
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/food-providers/catalog-repository.ts src/food-providers/service.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/food-providers/catalog-repository.ts src/food-providers/service.ts
          git commit -m 'style(food-catalog): apply prettier'
          git push origin HEAD:feat/persistent-food-catalog
