name: Widget v2 formatter

on:
  push:
    branches:
      - fix/chatgpt-widget-contract-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-widget-contract-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format changed widget files
        run: |
          bunx prettier --write \
            public/widgets/src/shared/bridge.js \
            public/widgets/src/templates/meal-review.html \
            scripts/widget-contract-smoke.ts \
            src/widget-resource-versioning.test.ts \
            src/widget-resource-versioning.ts
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/widgets/src/shared/bridge.js \
            public/widgets/src/templates/meal-review.html \
            scripts/widget-contract-smoke.ts \
            src/widget-resource-versioning.test.ts \
            src/widget-resource-versioning.ts
          git commit -m "Format ChatGPT widget v2 changes"
          git push origin HEAD:fix/chatgpt-widget-contract-v2
