name: Pantry branch formatter

on:
  push:
    branches:
      - feat/pantry-inventory-reconciliation

permissions:
  contents: write

concurrency:
  group: pantry-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-inventory-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format Pantry implementation
        run: |
          bunx prettier --write \
            .github/workflows/ci.yml \
            public/pantry.css \
            public/pantry.html \
            public/pantry.js \
            scripts/account-export-smoke.ts \
            scripts/capability-manifest-check.ts \
            scripts/pantry-platform-smoke.ts \
            scripts/pantry-ui-smoke.ts \
            src/account-export.ts \
            src/inventory/capabilities.ts \
            src/inventory/matching.test.ts \
            src/inventory/matching.ts \
            src/inventory/repository.ts \
            src/inventory/routes.ts \
            src/inventory/tools.test.ts \
            src/inventory/tools.ts \
            src/inventory/vision.test.ts \
            src/inventory/vision.ts \
            src/mcp-runtime.ts \
            src/nutrition-platform/index.ts \
            src/nutrition-platform/profiles.ts \
            src/nutrition-platform/types.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Pantry implementation"
          git push origin HEAD:feat/pantry-inventory-reconciliation
