name: Apply AI-first recipe patch

on:
    pull_request:
        branches:
            - main

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: feat/ai-first-recipe-resolution
            - name: Apply exact source transformations
              run: python3 scripts/apply-ai-first-recipe-patch.py
            - name: Format touched TypeScript
              run: npx prettier --write src/recipe-import/service.ts src/recipe-import/semantic-resolver.ts src/recipe-import.test.ts src/recipe-import/semantic-resolver.test.ts
            - name: Commit patched source
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/recipe-import/service.ts src/recipe-import/semantic-resolver.ts src/recipe-import.test.ts src/recipe-import/semantic-resolver.test.ts
                  git commit -m "fix: preserve source recipe quantities"
                  git push origin HEAD:feat/ai-first-recipe-resolution
