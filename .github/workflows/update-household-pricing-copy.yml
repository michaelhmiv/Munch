name: Update household pricing copy

on:
  push:
    branches:
      - feat/paid-household-seats

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paid-household-seats
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Update website pricing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          text = p.read_text()
          text = text.replace(
              'Use the nutrition core free. Add the planning\n                            workspace when needed.',
              'Use the nutrition core free. Premium starts at\n                            $4.99, with household members at $2 each.'
          )
          text = text.replace(
              '<li>Up to six connected household accounts</li>',
              '<li>Up to five additional household members at $2/month each</li>'
          )
          text = text.replace(
              'Purchased and managed on the Munch website.',
              'The Premium owner pays $4.99/month plus $2/month for each active additional household member. Invitations are free until accepted.'
          )
          text = text.replace(
              'Only household recipes, planned meals,\n                                groceries, names, roles, and related\n                                attribution. Personal meals, water, weight,\n                                goals, and saved foods remain private.',
              'Household recipes, planned meals, groceries, names, roles, and related attribution are shared automatically while a discounted household seat is active. Personal meals, water, weight, goals, and saved foods remain private.'
          )
          p.write_text(text)
          PY
          bunx prettier --write public/index.html
      - name: Commit website copy
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "docs: explain paid household pricing on website"
          git push origin HEAD:feat/paid-household-seats
