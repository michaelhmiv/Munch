name: Submission package finalizer

on:
  push:
    branches:
      - feat/openai-submission-readiness

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[submission-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openai-submission-readiness
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Complete descriptor metadata
        shell: python
        run: |
          import re
          from pathlib import Path

          mcp = Path("src/mcp.ts")
          text = mcp.read_text()
          no_argument_tools = [
              "export_meals",
              "get_alcohol_tracking",
              "get_meals_today",
              "get_nutrition_goals",
              "get_timezone",
              "get_water_today",
              "get_weight_today",
              "get_weight_unit",
              "get_widget_display",
          ]
          for name in no_argument_tools:
              pattern = re.compile(
                  rf'(toolServer\.registerTool\(\s*"{name}",\s*\{{)(.*?)(\n\s*annotations\s*:)',
                  re.S,
              )
              match = pattern.search(text)
              assert match, name
              if "inputSchema:" not in match.group(2):
                  replacement = (
                      match.group(1)
                      + match.group(2).rstrip()
                      + "\n            inputSchema: {},"
                      + match.group(3)
                  )
                  text = text[: match.start()] + replacement + text[match.end() :]

          for name in ["start_meal_import", "bulk_import_meals"]:
              pattern = re.compile(
                  rf'(toolServer\.registerTool\(\s*"{name}",\s*\{{.*?annotations\s*:\s*\{{)(.*?)(\n\s*\}})',
                  re.S,
              )
              match = pattern.search(text)
              assert match, name
              if "openWorldHint:" not in match.group(2):
                  replacement = (
                      match.group(1)
                      + match.group(2).rstrip()
                      + "\n                openWorldHint: false,"
                      + match.group(3)
                  )
                  text = text[: match.start()] + replacement + text[match.end() :]
          mcp.write_text(text)

          annotation_files = [
              Path("src/mcp.ts"),
              Path("src/food-tools.ts"),
              Path("src/saved-food-tools.ts"),
          ]
          changed = 0
          for path in annotation_files:
              source = path.read_text()
              updated, count = re.subn(
                  r"openWorldHint:\s*true,",
                  "openWorldHint: false,",
                  source,
              )
              changed += count
              path.write_text(updated)
          assert changed == 5, changed

      - name: Generate and validate submission package
        run: |
          bun install --frozen-lockfile
          bunx prettier --write \
            src/mcp.ts \
            src/food-tools.ts \
            src/saved-food-tools.ts \
            scripts/openai-tool-inventory.ts \
            scripts/generate-openai-submission.ts \
            scripts/openai-submission-audit.ts \
            scripts/widget-csp-audit.ts \
            scripts/policy-consistency-check.ts
          bun run submission:generate
          bun run commerce:check
          bun run submission:check
          bun run typecheck
          bun test

      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mcp.ts \
            src/food-tools.ts \
            src/saved-food-tools.ts \
            chatgpt-app-submission.json \
            docs/openai-submission \
            scripts/openai-tool-inventory.ts \
            scripts/generate-openai-submission.ts \
            scripts/openai-submission-audit.ts \
            scripts/widget-csp-audit.ts \
            scripts/policy-consistency-check.ts
          git commit -m "fix(submission): align tool annotations with actual side effects [submission-finalize]"
          git push origin HEAD:feat/openai-submission-readiness
