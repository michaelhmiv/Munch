name: Pantry branch fixup

on:
  push:
    branches:
      - feat/pantry-inventory-reconciliation

permissions:
  contents: write

concurrency:
  group: pantry-fixup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-inventory-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply reviewed Pantry fixups
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch marker missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Bun's bound JSON string is valid JSON but not a JSON object. The
          # ledger provenance is already represented by typed columns, so keep
          # metadata an actual empty JSON object until structured metadata is
          # intentionally added.
          replace_once(
              "src/inventory/repository.ts",
              '${JSON.stringify(input.metadata ?? {})}::jsonb',
              'jsonb_build_object()',
          )
          replace_once(
              "src/inventory/repository.ts",
              '    canonicalInventoryUnit,\n    normalizeInventoryName,',
              '    canonicalInventoryUnit,\n    convertInventoryQuantity,\n    normalizeInventoryName,',
          )
          replace_once(
              "src/inventory/repository.ts",
              '        const batchRows = await tx<Array<{ id: string }>>`',
              '''        const purchasedAt = input.purchasedAt ?? new Date().toISOString();
          if (Number.isNaN(new Date(purchasedAt).getTime())) {
              throw new Error("Purchase timestamp is invalid");
          }
          const batchRows = await tx<Array<{ id: string }>>`''',
          )
          replace_once(
              "src/inventory/repository.ts",
              '${input.purchasedAt ?? new Date().toISOString()}, \'applied\', ${input.userId}',
              '${purchasedAt}, \'applied\', ${input.userId}',
          )

          p = Path("src/inventory/repository.ts")
          text = p.read_text()
          start_token = '            } else if (isFood) {\n'
          start = text.index(start_token, text.index('export async function reconcilePurchase')) + len(start_token)
          end_token = '\n            }\n\n            await tx`\n                insert into munch.purchase_reconciliation_lines'
          end = text.index(end_token, start)
          replacement = r'''                let grocery: Record<string, unknown> | undefined;
                  if (groceryListId) {
                      const providerId = line.providerFoodId ?? null;
                      const provider = line.foodProvider ?? null;
                      const groceryRows = await tx<
                          Array<Record<string, unknown>>
                      >`
                          select id, version, purchased_at, quantity, unit,
                                 food_provider, provider_food_id, normalized_name
                          from munch.grocery_items
                          where grocery_list_id = ${groceryListId}
                            and deleted_at is null
                            and (
                              purchased_at is null
                              or purchased_at between
                                  ${purchasedAt}::timestamptz - interval '48 hours'
                                  and ${purchasedAt}::timestamptz + interval '12 hours'
                            )
                            and (
                              (${providerId}::text is not null
                                  and provider_food_id = ${providerId}
                                  and food_provider is not distinct from ${provider})
                              or normalized_name = ${normalized}
                              or normalized_name like ${`%${normalized}%`}
                              or ${normalized} like '%' || normalized_name || '%'
                            )
                          order by
                              case when purchased_at is null then 0 else 1 end,
                              case when provider_food_id = ${providerId} then 0 else 1 end,
                              created_at desc
                          limit 1 for update
                      `;
                      grocery = groceryRows[0];
                  }
                  if (grocery) {
                      groceryItemId = String(grocery.id);
                      if (grocery.purchased_at == null) {
                          const purchased = await tx<Array<{ id: string }>>`
                              update munch.grocery_items
                              set quantity = coalesce(${line.quantity ?? null}, quantity),
                                  unit = coalesce(${canonicalInventoryUnit(line.unit)}, unit),
                                  food_provider = coalesce(${line.foodProvider ?? null}, food_provider),
                                  provider_food_id = coalesce(${line.providerFoodId ?? null}, provider_food_id),
                                  purchased_at = ${purchasedAt},
                                  purchased_by_user_id = ${input.userId},
                                  updated_by_user_id = ${input.userId},
                                  updated_at = now(),
                                  version = version + 1
                              where id = ${groceryItemId}
                                and version = ${Number(grocery.version)}
                              returning id
                          `;
                          if (!purchased[0]) {
                              throw new Error(
                                  "Grocery item changed during purchase reconciliation",
                              );
                          }
                          const eventRows = await tx<
                              Array<{ inventory_item_id: string }>
                          >`
                              select inventory_item_id
                              from munch.inventory_events
                              where source_type = 'grocery_purchase'
                                and source_entity_id = ${groceryItemId}
                              order by created_at desc
                              limit 1
                          `;
                          inventoryItemId = eventRows[0]
                              ? String(eventRows[0].inventory_item_id)
                              : null;
                          action = "grocery_matched";
                      } else {
                          const priorRows = await tx<
                              Array<Record<string, unknown>>
                          >`
                              select event.inventory_item_id,
                                     event.delta_quantity,
                                     event.unit,
                                     item.quantity as item_quantity,
                                     item.quantity_mode
                              from munch.inventory_events event
                              join munch.inventory_items item
                                on item.id = event.inventory_item_id
                              where event.source_type = 'grocery_purchase'
                                and event.source_entity_id = ${groceryItemId}
                              order by event.created_at desc
                              limit 1
                              for update of item
                          `;
                          const prior = priorRows[0];
                          if (prior) {
                              inventoryItemId = String(prior.inventory_item_id);
                              action = "grocery_matched";
                              if (
                                  line.quantity != null &&
                                  prior.delta_quantity != null
                              ) {
                                  const actualQuantity = convertInventoryQuantity(
                                      line.quantity,
                                      line.unit,
                                      prior.unit == null ? null : String(prior.unit),
                                  );
                                  if (actualQuantity == null) {
                                      action = "needs_review";
                                      needsReview = true;
                                  } else {
                                      const delta =
                                          actualQuantity - Number(prior.delta_quantity);
                                      const currentQuantity =
                                          prior.item_quantity == null
                                              ? null
                                              : Number(prior.item_quantity);
                                      if (
                                          currentQuantity != null &&
                                          Math.abs(delta) > 0.0005
                                      ) {
                                          const nextQuantity = Math.max(
                                              0,
                                              currentQuantity + delta,
                                          );
                                          await tx`
                                              update munch.inventory_items
                                              set quantity = ${nextQuantity},
                                                  quantity_mode = case
                                                      when quantity_mode = 'presence_only'
                                                          then 'approximate'
                                                      else quantity_mode
                                                  end,
                                                  stock_state = case
                                                      when ${nextQuantity} <= 0
                                                          then 'depleted'
                                                      else 'available'
                                                  end,
                                                  updated_by_user_id = ${input.userId},
                                                  updated_at = now(),
                                                  version = version + 1
                                              where id = ${inventoryItemId}
                                          `;
                                          await insertEvent(tx, {
                                              spaceId,
                                              itemId: inventoryItemId,
                                              eventType: "correct",
                                              deltaQuantity: delta,
                                              quantityAfter: nextQuantity,
                                              unit:
                                                  prior.unit == null
                                                      ? null
                                                      : String(prior.unit),
                                              sourceType: "receipt",
                                              sourceEntityId: batchId,
                                              sourceKey: `receipt:${batchId}:${index}:grocery-correction`,
                                              confidence: line.confidence,
                                              userId: input.userId,
                                          });
                                      }
                                  }
                              }
                          } else {
                              const acquired = await acquireInTransaction(tx, {
                                  userId: input.userId,
                                  spaceId,
                                  sourceType: "receipt",
                                  sourceEntityId: batchId,
                                  sourceKey: `receipt:${batchId}:${index}:purchased-grocery`,
                                  name,
                                  quantity: line.quantity,
                                  unit: line.unit,
                                  location: line.location,
                                  foodProvider: line.foodProvider,
                                  providerFoodId: line.providerFoodId,
                                  confidence: line.confidence,
                              });
                              inventoryItemId = acquired.item.id;
                              action = "grocery_matched";
                          }
                      }
                  } else {
                      const acquired = await acquireInTransaction(tx, {
                          userId: input.userId,
                          spaceId,
                          sourceType: "receipt",
                          sourceEntityId: batchId,
                          sourceKey: `receipt:${batchId}:${index}`,
                          name,
                          quantity: line.quantity,
                          unit: line.unit,
                          location: line.location,
                          foodProvider: line.foodProvider,
                          providerFoodId: line.providerFoodId,
                          confidence: line.confidence,
                      });
                      inventoryItemId = acquired.item.id;
                      action = "inventory_added";
                  }'''
          p.write_text(text[:start] + replacement + text[end:])

          # Minimize third-party data handling for website image analysis.
          replace_once(
              "src/inventory/vision.ts",
              '                model: config.model,\n                temperature: 0,',
              '                model: config.model,\n                provider: { data_collection: "deny" },\n                temperature: 0,',
          )

          # Use the dedicated Pantry route as a normal navigation destination;
          # omitting data-route prevents the existing SPA router from consuming it.
          replace_once(
              "public/app.html",
              '''                    <a data-route="groceries" href="/app/groceries"
                          ><span class="nav-icon">✓</span
                          ><span>Groceries</span></a
                      >''',
              '''                    <a data-route="groceries" href="/app/groceries"
                          ><span class="nav-icon">✓</span
                          ><span>Groceries</span></a
                      >
                      <a href="/app/pantry"
                          ><span class="nav-icon">▦</span><span>Pantry</span></a
                      >''',
          )
          replace_once("public/pantry.html", 'href="/app/planning"', 'href="/app/plan"')

          privacy = Path("public/privacy.html")
          text = privacy.read_text()
          text = text.replace(
              "nutrition, recipe, planning, grocery, and household records",
              "nutrition, recipe, planning, grocery, Pantry, and household records",
          )
          text = text.replace(
              "consumer nutrition, recipe, and meal-planning\n                        service",
              "consumer nutrition, recipe, meal-planning, and Pantry\n                        inventory service",
          )
          text = text.replace("Last updated: August 11, 2026", "Last updated: August 24, 2026")
          text = text.replace(
              "planned meals, and\n                                grocery-list items.",
              "planned meals, and\n                                grocery-list items.\n                            </li>\n                            <li>\n                                Optional Premium Pantry inventory, approximate or exact quantities, storage locations, inventory event history, and structured purchase/receipt reconciliation results. Munch does not store raw Pantry or receipt images after the request is processed.",
              1,
          )
          text = text.replace(
              "grocery lists, household display names, roles, and",
              "grocery lists, shared Pantry inventory, household display names, roles, and",
          )
          openai_li = '''                            <li>
                                  <strong>OpenAI/ChatGPT</strong> processes the
                                  conversation and decides what tool arguments to
                                  send to Munch.
                              </li>'''
          if openai_li not in text:
              raise SystemExit("Privacy OpenAI provider marker missing")
          text = text.replace(
              openai_li,
              '''                            <li>
                                  <strong>OpenRouter</strong> receives a Premium user's Pantry or receipt image only when the user uploads that image through the Munch website for AI-assisted extraction. Munch requests provider routing with data collection disabled and retains the resulting structured food data rather than the raw image.
                              </li>
          ''' + openai_li,
              1,
          )
          tool_marker = '''                        <h3>Why it is stored</h3>'''
          if tool_marker not in text:
              raise SystemExit("Privacy tool marker missing")
          text = text.replace(
              tool_marker,
              '''                        <h3>Pantry and receipt images</h3>
                          <p>
                              When an eligible Premium user uploads a Pantry, refrigerator, freezer, or grocery-receipt image through the Munch website, Munch sends that image transiently to its configured AI processor to extract structured food and purchase candidates. The raw image is not written to the Munch PostgreSQL database or account export. The user reviews uncertain detections before they can change Pantry inventory. Images uploaded directly to ChatGPT are handled by ChatGPT under OpenAI's policies; Munch receives only the structured tool arguments ChatGPT sends to the connected Munch app.
                          </p>
          ''' + tool_marker,
              1,
          )
          privacy.write_text(text)
          PY

          bunx prettier --write \
            .github/workflows/ci.yml \
            public/app.html \
            public/pantry.html \
            public/privacy.html \
            scripts/account-export-smoke.ts \
            scripts/capability-manifest-check.ts \
            scripts/pantry-account-deletion-smoke.ts \
            scripts/pantry-platform-smoke.ts \
            scripts/pantry-ui-smoke.ts \
            src/account-export.ts \
            src/inventory/capabilities.ts \
            src/inventory/matching.test.ts \
            src/inventory/matching.ts \
            src/inventory/repository.ts \
            src/inventory/routes.ts \
            src/inventory/tools.test.ts \
            src/inventory/tools.ts \
            src/inventory/vision.test.ts \
            src/inventory/vision.ts \
            src/mcp-runtime.ts \
            src/nutrition-platform/index.ts \
            src/nutrition-platform/profiles.ts \
            src/nutrition-platform/types.ts
      - name: Commit fixups
        run: |
          if git diff --quiet; then
            echo "No fixups required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Pantry purchase reconciliation"
          git push origin HEAD:feat/pantry-inventory-reconciliation
