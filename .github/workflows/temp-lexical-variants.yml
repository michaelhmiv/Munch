name: Temporary lexical food variants

on:
    push:
        branches:
            - fix/food-ranking-gtin-quality

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/food-ranking-gtin-quality
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Add indexed singular/plural query variants
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  import re

                  path = Path('src/food-providers/catalog-repository.ts')
                  text = path.read_text()
                  marker = 'export function hashCatalogIdentity(value: string): string {'
                  helper = '''export function lexicalFoodSearchVariants(value: string): string[] {
                      const normalized = normalizeFoodText(value);
                      if (!normalized) return [];
                      const tokens = normalized.split(" ").filter(Boolean);
                      const last = tokens.at(-1);
                      if (!last) return [normalized];

                      let alternate = last;
                      if (last.length > 4 && last.endsWith("ies")) {
                          alternate = `${last.slice(0, -3)}y`;
                      } else if (last.length > 4 && last.endsWith("oes")) {
                          alternate = last.slice(0, -2);
                      } else if (
                          last.length > 3 &&
                          last.endsWith("s") &&
                          !last.endsWith("ss") &&
                          !last.endsWith("us")
                      ) {
                          alternate = last.slice(0, -1);
                      } else if (/[^aeiou]y$/u.test(last)) {
                          alternate = `${last.slice(0, -1)}ies`;
                      } else if (last.endsWith("o")) {
                          alternate = `${last}es`;
                      } else if (!last.endsWith("s")) {
                          alternate = `${last}s`;
                      }

                      if (alternate === last) return [normalized];
                      const variant = [...tokens.slice(0, -1), alternate].join(" ");
                      return variant === normalized ? [normalized] : [normalized, variant];
                  }

                  '''
                  if 'export function lexicalFoodSearchVariants' not in text:
                      if marker not in text:
                          raise SystemExit('helper insertion anchor changed')
                      text = text.replace(marker, helper + marker, 1)

                  if 'const lexicalVariants = lexicalFoodSearchVariants(normalized);' not in text:
                      pattern = re.compile(
                          r'(\s*const boundedLimit = Math\.max\(1, Math\.min\(25, limit\)\);\n)(\s*const retrievalLimit = Math\.min\(50, Math\.max\(25, boundedLimit \* 5\)\);)'
                      )
                      text, count = pattern.subn(
                          r'\1        const lexicalVariants = lexicalFoodSearchVariants(normalized);\n        const alternate = lexicalVariants[1] ?? normalized;\n\2',
                          text,
                          count=1,
                      )
                      if count != 1:
                          raise SystemExit('search variant anchor changed')

                  if "plainto_tsquery('simple', ${alternate})" not in text:
                      needle = ") @@ plainto_tsquery('simple', ${normalized})"
                      replacement = ") @@ (\n                    plainto_tsquery('simple', ${normalized})\n                    || plainto_tsquery('simple', ${alternate})\n                  )"
                      if needle not in text:
                          raise SystemExit('lexical tsquery anchor changed')
                      text = text.replace(needle, replacement, 1)
                  path.write_text(text)

                  path = Path('src/food-providers/catalog-repository.test.ts')
                  text = path.read_text()
                  if 'lexicalFoodSearchVariants,' not in text:
                      needle = '    hashCatalogIdentity,\n'
                      if needle not in text:
                          raise SystemExit('catalog helper import anchor changed')
                      text = text.replace(
                          needle,
                          needle + '    lexicalFoodSearchVariants,\n',
                          1,
                      )
                  if 'creates conservative final-noun lexical variants' not in text:
                      insert = '''
                      test("creates conservative final-noun lexical variants", () => {
                          expect(lexicalFoodSearchVariants("onion")).toEqual(["onion", "onions"]);
                          expect(lexicalFoodSearchVariants("pistachios")).toEqual([
                              "pistachios",
                              "pistachio",
                          ]);
                          expect(lexicalFoodSearchVariants("sweet potato")).toEqual([
                              "sweet potato",
                              "sweet potatoes",
                          ]);
                      });
                  '''
                      pos = text.rfind('\n});')
                      if pos < 0:
                          raise SystemExit('catalog test suite anchor changed')
                      text = text[:pos] + insert + text[pos:]
                  path.write_text(text)
                  PY
            - run: bunx prettier --write src/food-providers/catalog-repository.ts src/food-providers/catalog-repository.test.ts src/food-providers/ranking.ts src/food-providers/ranking.test.ts
            - run: bun test src/food-providers/catalog-repository.test.ts src/food-providers/ranking.test.ts src/food-providers/service.test.ts
            - name: Commit lexical variants
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/food-providers/catalog-repository.ts src/food-providers/catalog-repository.test.ts src/food-providers/ranking.ts src/food-providers/ranking.test.ts
                  git diff --cached --quiet || git commit -m "fix: include lexical food noun variants"
                  git push origin HEAD:fix/food-ranking-gtin-quality
