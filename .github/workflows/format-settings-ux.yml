name: Format settings UX sources

on:
  push:
    branches:
      - feat/settings-account-ux-rebuild

permissions:
  contents: write

jobs:
  format:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: normalize settings UX') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-account-ux-rebuild
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write public/app-account.js public/account-settings.css src/portal/routes.ts scripts/account-portal-smoke.ts scripts/ui-surface-smoke.ts
      - run: rm .github/workflows/format-settings-ux.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize settings UX"
          git push origin HEAD:feat/settings-account-ux-rebuild
