name: Apply settings unit routing fix

on:
  push:
    branches:
      - fix/settings-unit-routing
    paths:
      - scripts/apply-settings-unit-fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/settings-unit-routing

      - name: Apply targeted source patch
        run: python scripts/apply-settings-unit-fix.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/app.js public/app-patches.js; then
            echo "No source changes were produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/app-patches.js
          git commit -m "fix: route weight preferences through web UI"
          git push origin HEAD:fix/settings-unit-routing
