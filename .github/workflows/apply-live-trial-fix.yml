name: Apply live trial certification fix

on:
  push:
    branches:
      - fix/live-30-day-trial

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-30-day-trial
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Apply focused production trial changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int | None = None) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {actual}: {old!r}")
              file.write_text(text.replace(old, new))

          replace(
              "src/billing/stripe-client.ts",
              'const MUNCH_TRIAL_DAYS = 7;',
              'const MUNCH_TRIAL_DAYS = 30;',
          )
          replace(
              "src/billing/stripe-client.ts",
              '    pendingOAuthSessionId?: string | null;\n}',
              '    pendingOAuthSessionId?: string | null;\n    trialDays?: number | null;\n}',
          )
          replace(
              "src/billing/stripe-client.ts",
              '        "subscription_data[metadata][munch_user_id]": input.userId,\n        "subscription_data[trial_period_days]": String(MUNCH_TRIAL_DAYS),\n        allow_promotion_codes: "true",\n    });',
              '        "subscription_data[metadata][munch_user_id]": input.userId,\n        payment_method_collection: "always",\n        allow_promotion_codes: "true",\n    });\n\n    const trialDays =\n        input.trialDays === undefined ? MUNCH_TRIAL_DAYS : input.trialDays;\n    if (trialDays !== null) {\n        if (!Number.isInteger(trialDays) || trialDays < 1) {\n            throw new Error("Checkout trial days must be a positive integer");\n        }\n        body.set("subscription_data[trial_period_days]", String(trialDays));\n    }',
          )

          replace(
              "src/billing/account-query.ts",
              '    stripeCustomerId: string | null;\n}',
              '    stripeCustomerId: string | null;\n    hasPriorSubscription: boolean;\n}',
          )
          replace(
              "src/billing/account-query.ts",
              '                stripe_customer_id: string | null;\n            }>',
              '                stripe_customer_id: string | null;\n                has_prior_subscription: boolean;\n            }>',
          )
          replace(
              "src/billing/account-query.ts",
              '                users.email,\n                customers.stripe_customer_id\n            from munch.users users',
              '                users.email,\n                customers.stripe_customer_id,\n                exists (\n                    select 1\n                    from munch.subscriptions subscriptions\n                    where subscriptions.user_id = users.id\n                ) as has_prior_subscription\n            from munch.users users',
          )
          replace(
              "src/billing/account-query.ts",
              '                  stripeCustomerId: row.stripe_customer_id,\n              }',
              '                  stripeCustomerId: row.stripe_customer_id,\n                  hasPriorSubscription: row.has_prior_subscription,\n              }',
          )

          replace(
              "src/billing/checkout-service.ts",
              '        pendingOAuthSessionId: input.pendingOAuthSessionId,\n    });',
              '        pendingOAuthSessionId: input.pendingOAuthSessionId,\n        trialDays: account.hasPriorSubscription ? null : undefined,\n    });',
          )

          test_file = Path("src/billing/stripe-client.test.ts")
          test_text = test_file.read_text()
          test_text = test_text.replace(
              'test("creates one recurring subscription with a seven-day trial"',
              'test("creates one recurring subscription with a 30-day trial"',
          )
          test_text = test_text.replace(
              'expect(params.get("subscription_data[trial_period_days]")).toBe("7");',
              'expect(params.get("subscription_data[trial_period_days]")).toBe("30");\n        expect(params.get("payment_method_collection")).toBe("always");',
          )
          marker = '\n});\n'
          if test_text.count(marker) != 1:
              raise SystemExit("stripe-client.test.ts: expected one describe terminator")
          additional_test = r'''

    test("omits a repeat trial for an account that subscribed before", async () => {
        process.env.STRIPE_SECRET_KEY = "sk_test_munch";
        let encoded = "";
        globalThis.fetch = mock(async (_url, init) => {
            encoded = String(init?.body ?? "");
            return new Response(
                JSON.stringify({
                    id: "cs_test_returning",
                    url: "https://checkout.stripe.test/returning",
                    customer: "cus_returning",
                    subscription: null,
                    payment_status: "unpaid",
                    status: "open",
                    client_reference_id: "user-2",
                }),
                {
                    status: 200,
                    headers: { "content-type": "application/json" },
                },
            );
        }) as unknown as typeof fetch;

        await createStripeCheckoutSession({
            userId: "user-2",
            customerId: "cus_returning",
            priceId: "price_munch_monthly",
            successUrl: "https://munch.test/success",
            cancelUrl: "https://munch.test/cancel",
            trialDays: null,
        });
        const params = new URLSearchParams(encoded);
        expect(params.has("subscription_data[trial_period_days]")).toBe(false);
        expect(params.get("payment_method_collection")).toBe("always");
    });
'''
          test_file.write_text(test_text.replace(marker, additional_test + marker))

          entitlement_file = Path("src/billing/entitlements.test.ts")
          entitlement_text = entitlement_file.read_text()
          marker = '\n});\n'
          if entitlement_text.count(marker) != 1:
              raise SystemExit("entitlements.test.ts: expected one describe terminator")
          status_test = r'''

    test("denies protected access for non-entitled Stripe states", () => {
        for (const status of [
            "incomplete",
            "incomplete_expired",
            "paused",
            "canceled",
            "unpaid",
        ] as const) {
            const decision = decideEntitlement({ status }, now);
            expect(decision.allowMcp).toBe(false);
            expect(decision.canUseProtectedTools).toBe(false);
            expect(decision.canWriteNutritionData).toBe(false);
        }
    });
'''
          entitlement_file.write_text(
              entitlement_text.replace(marker, status_test + marker),
          )

          replacements = {
              "public/index.html": [
                  ("Start 7-day free trial", "Start 30-day free trial"),
                  ("<p>7-day free trial</p>", "<p>30-day free trial</p>"),
                  (
                      "https://munch-production-de3a.up.railway.app",
                      "https://munch.business",
                  ),
              ],
              "src/portal/routes.ts": [
                  (
                      "One plan: $4.99/month after the seven-day trial.",
                      "One plan: 30-day free trial, then $4.99/month.",
                  ),
              ],
              ".env.example": [
                  (
                      "includes the configured seven-day trial and Customer Portal manages billing.",
                      "includes a 30-day free trial for first-time subscribers and Customer Portal manages billing.",
                  ),
              ],
          }
          for path, pairs in replacements.items():
              file = Path(path)
              text = file.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"{path}: missing expected text {old!r}")
                  text = text.replace(old, new)
              file.write_text(text)

          stale_patterns = (
              "MUNCH_TRIAL_DAYS = 7",
              "trial_period_days]\\\").toBe(\\\"7",
              "seven-day trial",
              "7-day free trial",
              "<p>7-day free trial</p>",
          )
          stale = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.name in {"bun.lock", "package-lock.json"}:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              for pattern in stale_patterns:
                  if pattern in text:
                      stale.append(f"{path}: {pattern}")
          if stale:
              raise SystemExit("Stale seven-day trial references remain:\n" + "\n".join(stale))
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changes
        run: bun run format

      - name: Run quality checks
        run: |
          set -euo pipefail
          bun run format:check
          bun run typecheck
          bun test
          bun run brand:check

      - name: Commit focused changes and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-live-trial-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce 30-day first-subscription trial"
          git push origin HEAD:fix/live-30-day-trial
