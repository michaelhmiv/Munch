name: Refresh widget tests

on:
  push:
    branches:
      - feat/chatgpt-native-widget-overhaul

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-native-widget-overhaul
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Update, format, and commit tests
        run: |
          python3 .github/scripts/refresh_widget_tests.py
          bun run format
          rm .github/workflows/refresh-widget-tests.yml
          rm .github/scripts/refresh_widget_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align widget coverage with redesigned UI"
          git push origin HEAD:feat/chatgpt-native-widget-overhaul
