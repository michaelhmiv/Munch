name: Temporary candidate-set cert updater

on:
    push:
        branches:
            - test/candidate-set-production-cert

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: test/candidate-set-production-cert
            - name: Update production food certification
              run: |
                  python - <<'PY'
                  from pathlib import Path
                  path = Path('scripts/certification/production-mcp-corpus.ts')
                  text = path.read_text()
                  replacements = {
                      '["Greek yogurt", ["yogurt"]]': '["Greek yogurt", ["greek yogurt"]]',
                      '["cottage cheese", ["cottage"]]': '["cottage cheese", ["cottage cheese"]]',
                      '["ground beef", ["beef"]]': '["ground beef", ["ground beef"]]',
                      '["90% lean ground beef", ["beef"]]': '["90% lean ground beef", ["ground beef 90"]]',
                      '["chicken breast", ["chicken"]]': '["chicken breast", ["chicken breast"]]',
                      '["chicken thigh", ["chicken"]]': '["chicken thigh", ["chicken thigh"]]',
                      '["pork loin", ["pork"]]': '["pork loin", ["pork loin"]]',
                      '["white rice", ["rice"]]': '["white rice", ["white rice"]]',
                      '["brown rice", ["rice"]]': '["brown rice", ["brown rice"]]',
                      '["whole wheat bread", ["bread", "wheat"]]': '["whole wheat bread", ["whole wheat bread"]]',
                      '["sourdough bread", ["sourdough", "bread"]]': '["sourdough bread", ["sourdough"]]',
                      '["russet potato", ["potato", "russet"]]': '["russet potato", ["russet potato"]]',
                      '["bell peppers", ["pepper"]]': '["bell peppers", ["bell pepper"]]',
                      '["olive oil", ["olive"]]': '["olive oil", ["olive oil"]]',
                      '["black beans", ["black bean", "beans"]]': '["black beans", ["black bean"]]',
                      '["kidney beans", ["kidney", "beans"]]': '["kidney beans", ["kidney bean"]]',
                  }
                  for old, new in replacements.items():
                      if old not in text:
                          raise SystemExit(f'missing expected constant: {old}')
                      text = text.replace(old, new)
                  old = '''            const candidates = call.result.structuredContent?.candidates as
                Array<Record<string, unknown>> | undefined;
            const top = candidates?.[0];
            const name = typeof top?.name === "string" ? top.name : "";
            if (!top || !foodNameMatches(name, expected)) {
                throw new Error(
                    `Food query ${query} returned an implausible top result: ${name || "none"}`,
                );
            }
            rows.push({
                query,
                top_name: name,
                provider: top.provider,
                data_kind: top.data_kind,
                candidate_count: candidates?.length ?? 0,
                duration_ms: call.duration_ms,
            });'''
                  new = '''            const candidates = call.result.structuredContent?.candidates as
                Array<Record<string, unknown>> | undefined;
            const top = candidates?.[0];
            const match = candidates?.find((candidate) => {
                const name =
                    typeof candidate.name === "string" ? candidate.name : "";
                return foodNameMatches(name, expected);
            });
            const topName = typeof top?.name === "string" ? top.name : "";
            const matchName =
                typeof match?.name === "string" ? match.name : "";
            if (!match) {
                const names =
                    candidates
                        ?.map((candidate) =>
                            typeof candidate.name === "string"
                                ? candidate.name
                                : "unnamed",
                        )
                        .join(" | ") ?? "none";
                throw new Error(
                    `Food query ${query} candidate set omitted a plausible match: ${names}`,
                );
            }
            rows.push({
                query,
                top_name: topName || null,
                matched_name: matchName,
                provider: match.provider,
                data_kind: match.data_kind,
                candidate_count: candidates?.length ?? 0,
                candidate_names:
                    candidates?.map((candidate) => candidate.name) ?? [],
                duration_ms: call.duration_ms,
            });'''
                  if old not in text:
                      raise SystemExit('food phase block did not match expected source')
                  path.write_text(text.replace(old, new))
                  PY
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: bunx prettier --write scripts/certification/production-mcp-corpus.ts
            - name: Commit update
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/certification/production-mcp-corpus.ts
                  git diff --cached --quiet || git commit -m "test: certify production food candidate recall"
                  git push origin HEAD:test/candidate-set-production-cert
