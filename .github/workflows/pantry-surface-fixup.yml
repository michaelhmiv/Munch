name: Pantry surface fixup

on:
  push:
    branches:
      - feat/pantry-inventory-reconciliation

permissions:
  contents: write

concurrency:
  group: pantry-surface-fixup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-inventory-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply, format, and verify
        id: verify
        shell: bash
        run: |
          set +e
          {
            echo "== surface transform =="
            python3 scripts/pantry-surface-fixup.py
            transform=$?
            echo "transform_exit=$transform"
            if [ "$transform" -eq 0 ]; then
              echo "== prettier write =="
              bunx prettier --write \
                .github/workflows/ci.yml \
                .github/workflows/pantry-surface-fixup.yml \
                public/app.html \
                public/styles.css \
                public/pantry.css \
                public/pantry.html \
                public/pantry.js \
                public/privacy.html \
                scripts/account-export-smoke.ts \
                scripts/capability-manifest-check.ts \
                scripts/pantry-account-deletion-smoke.ts \
                scripts/pantry-platform-smoke.ts \
                scripts/pantry-ui-smoke.ts \
                src/account-export.ts \
                src/index.ts \
                src/inventory/capabilities.ts \
                src/inventory/matching.test.ts \
                src/inventory/matching.ts \
                src/inventory/repository.ts \
                src/inventory/routes.ts \
                src/inventory/tools.test.ts \
                src/inventory/tools.ts \
                src/inventory/vision.test.ts \
                src/inventory/vision.ts \
                src/mcp-runtime.ts \
                src/nutrition-platform/index.ts \
                src/nutrition-platform/profiles.ts \
                src/nutrition-platform/types.ts
              format_write=$?
            else
              format_write=99
            fi
            echo "format_write_exit=$format_write"
            if [ "$transform" -eq 0 ] && [ "$format_write" -eq 0 ]; then
              echo "== format check =="
              bun run format:check
              format_check=$?
            else
              format_check=99
            fi
            echo "format_check_exit=$format_check"
            if [ "$format_check" -eq 0 ]; then
              echo "== pantry ui smoke =="
              bun scripts/pantry-ui-smoke.ts
              ui=$?
            else
              ui=99
            fi
            echo "ui_exit=$ui"
            if [ "$ui" -eq 0 ]; then
              echo "== capability manifest =="
              bun scripts/capability-manifest-check.ts
              capability=$?
            else
              capability=99
            fi
            echo "capability_exit=$capability"
            if [ "$capability" -eq 0 ]; then
              echo "== typecheck =="
              bun run typecheck
              types=$?
            else
              types=99
            fi
            echo "typecheck_exit=$types"
            if [ "$types" -eq 0 ]; then
              echo "== inventory tests =="
              bun test src/inventory
              tests=$?
            else
              tests=99
            fi
            echo "inventory_tests_exit=$tests"
          } > .github/pantry-surface-result.txt 2>&1
          if [ "${transform:-99}" -eq 0 ] && [ "${format_write:-99}" -eq 0 ] && [ "${format_check:-99}" -eq 0 ] && [ "${ui:-99}" -eq 0 ] && [ "${capability:-99}" -eq 0 ] && [ "${types:-99}" -eq 0 ] && [ "${tests:-99}" -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit verified changes or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.verify.outputs.success }}" = "true" ]; then
            git add -A
            git reset scripts/pantry-surface-fixup.py .github/workflows/pantry-surface-fixup.yml .github/pantry-surface-result.txt
            git commit -m "feat: expose Pantry in app navigation and privacy policy"
          else
            git restore public scripts src .github/workflows/ci.yml .github/workflows/pantry-surface-fixup.yml
            git add .github/pantry-surface-result.txt
            git commit -m "ci: capture Pantry surface verification failure"
          fi
          git push origin HEAD:feat/pantry-inventory-reconciliation
