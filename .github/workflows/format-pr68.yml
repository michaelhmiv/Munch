name: Format PR 68

on:
  push:
    branches:
      - fix/premium-checkout-live-stripe

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premium-checkout-live-stripe
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/billing/stripe-client.ts src/billing/stripe-client.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/billing/stripe-client.ts src/billing/stripe-client.test.ts
          git commit -m "style: format premium checkout changes"
          git push
