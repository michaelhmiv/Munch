name: Remove portal smoke repair helper

on:
  push:
    branches:
      - feat/paid-household-seats

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paid-household-seats
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-paid-household-portal-smoke.yml
          git commit -m "chore: remove portal smoke repair helper"
          git push origin HEAD:feat/paid-household-seats
