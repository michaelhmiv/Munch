name: Regenerate PR 124 submission package

on:
    pull_request:
        branches:
            - main

permissions:
    contents: write

jobs:
    regenerate:
        if: github.head_ref == 'fix/meal-review-recipe-production'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/meal-review-recipe-production
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: bun run submission:generate
            - name: Commit generated submission package
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add chatgpt-app-submission.json docs/openai-submission/tool-inventory.md
                  git commit -m "docs: refresh OpenAI submission inventory"
                  git push origin HEAD:fix/meal-review-recipe-production
