name: Recipe Import Grounding Corpus

# Live grounding check for the recipe importer: real recipe pages run
# through previewRecipeUrl with the real food search service, asserting
# parse success per parser strategy and ingredient grounding rates
# above the floors recorded in
# src/recipe-import/fixtures/recipe-grounding-corpus.ts. Manual and
# weekly only so live pages and provider quotas never gate pull
# requests.

on:
    workflow_dispatch:
        inputs:
            limit:
                description: "Maximum corpus entries to run"
                required: false
                default: "7"
    schedule:
        # Weekly, Mondays 06:23 UTC.
        - cron: "23 6 * * 1"

permissions:
    contents: read

concurrency:
    group: recipe-import-grounding-corpus
    cancel-in-progress: false

jobs:
    grounding-corpus:
        name: Recipe import grounding corpus
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
            OFF_USER_AGENT: ${{ vars.OFF_USER_AGENT }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run live grounding corpus
              env:
                  RUN_RECIPE_IMPORT_GROUNDING_CORPUS: "1"
              run: bun scripts/recipe-import-grounding-corpus.ts --limit=${{ inputs.limit || '7' }}
