name: Fix Typecheck Scope

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-typecheck-scope
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/munch-frontend-overhaul
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure native production typecheck
        run: python scripts/fix-typecheck-scope.py

      - name: Format new configuration
        run: bunx prettier --write package.json tsconfig.src.json scripts/typecheck.ts

      - name: Commit configuration for normal CI validation
        run: |
          git checkout -- .github/workflows/fix-typecheck-scope.yml
          rm scripts/fix-typecheck-scope.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use native compiler for production typecheck"
          git push origin HEAD:feat/munch-frontend-overhaul
