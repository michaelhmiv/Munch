name: Temporary apply food quality patch

on:
    push:
        branches:
            - fix/food-ranking-gtin-quality

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/food-ranking-gtin-quality
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Repair temporary patch anchors
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  path = Path('scripts/certification/apply-food-quality-patch.py')
                  text = path.read_text().replace(r'/\\\\D/g', r'/\\D/g')
                  text = text.split('# Tighten production corpus invalid barcode contract.', 1)[0]
                  path.write_text(text)
                  PY
            - run: python3 scripts/certification/apply-food-quality-patch.py
            - name: Tighten production barcode certification
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  path = Path('scripts/certification/production-mcp-corpus.ts')
                  text = path.read_text()
                  needle = (
                      "                const failures = call.result.structuredContent\n"
                      "                    ?.provider_failures as unknown[] | undefined;\n"
                  )
                  replacement = (
                      "                if (\n"
                      "                    barcode === \"000000000000\" &&\n"
                      "                    (candidates?.length ?? 0) !== 0\n"
                      "                ) {\n"
                      "                    throw new Error(\n"
                      "                        \"All-zero GTIN unexpectedly resolved to a food\",\n"
                      "                    );\n"
                      "                }\n"
                      "                const failures = call.result.structuredContent\n"
                      "                    ?.provider_failures as unknown[] | undefined;\n"
                  )
                  if needle not in text:
                      if 'All-zero GTIN unexpectedly resolved to a food' in text:
                          raise SystemExit(0)
                      raise SystemExit('current barcode certification anchor changed')
                  path.write_text(text.replace(needle, replacement, 1))
                  PY
            - run: bunx prettier --write src/food-providers/catalog-repository.ts src/food-providers/service.ts src/food-providers/usda.ts src/food-providers/open-food-facts.ts src/foods.ts scripts/certification/production-mcp-corpus.ts src/food-providers/barcode.ts src/food-providers/barcode.test.ts src/food-providers/ranking.ts src/food-providers/ranking.test.ts
            - run: bun test src/food-providers/barcode.test.ts src/food-providers/ranking.test.ts src/food-providers/service.test.ts src/food-providers/catalog-repository.test.ts src/foods.test.ts
            - name: Commit patch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/food-providers/catalog-repository.ts src/food-providers/service.ts src/food-providers/usda.ts src/food-providers/open-food-facts.ts src/foods.ts scripts/certification/production-mcp-corpus.ts src/food-providers/barcode.ts src/food-providers/barcode.test.ts src/food-providers/ranking.ts src/food-providers/ranking.test.ts
                  git diff --cached --quiet || git commit -m "fix: rank generic foods and validate GTINs"
                  git push origin HEAD:fix/food-ranking-gtin-quality
