name: Recipe nutrition verification formatter

on:
  push:
    branches:
      - ops/recipe-nutrition-production-verify

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/recipe-nutrition-production-verify
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/backfill-recipe-nutrition.ts
      - name: Commit formatter result and remove temporary workflow
        run: |
          rm .github/workflows/format-recipe-nutrition-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/backfill-recipe-nutrition.ts .github/workflows/format-recipe-nutrition-verify.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format recipe nutrition production verification"
          git push origin HEAD:ops/recipe-nutrition-production-verify
