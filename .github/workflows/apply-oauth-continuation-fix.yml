name: Apply OAuth continuation fix

on:
  push:
    branches:
      - fix/oauth-consent-request-continuation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oauth-consent-request-continuation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Patch Better Auth custom OAuth pages
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/auth/connect-routes.ts')
          text = path.read_text()

          anchor = '''function connectionError(c: Context, stage: string, error?: unknown) {
              console.error("Better Auth connection stage failed", {
                  stage,
                  errorName: error instanceof Error ? error.name : "unknown",
              });
              return c.redirect("/connect/error", 303);
          }
          '''
          helper = anchor + '''
          async function betterAuthJsonPost(
              c: Context,
              path: string,
              body: Record<string, unknown>,
          ): Promise<Response> {
              const headers = new Headers(c.req.raw.headers);
              headers.set("content-type", "application/json");
              headers.delete("content-length");

              return getMunchBetterAuth().handler(
                  new Request(new URL(path, c.req.url), {
                      method: "POST",
                      headers,
                      body: JSON.stringify(body),
                  }),
              );
          }
          '''
          if anchor not in text:
              raise SystemExit('connectionError anchor not found')
          text = text.replace(anchor, helper, 1)

          old_magic = '''        try {
              await getMunchBetterAuth().api.signInMagicLink({
                  headers: c.req.raw.headers,
                  body: {
                      email,
                      name: "Munch user",
                      callbackURL: returnTo,
                      newUserCallbackURL: returnTo,
                      errorCallbackURL: "/connect/error",
                      ...(oauthQuery ? { oauth_query: oauthQuery } : {}),
                  },
              });
          } catch (error) {
          '''
          new_magic = '''        try {
              const response = await betterAuthJsonPost(
                  c,
                  "/api/auth/sign-in/magic-link",
                  {
                      email,
                      name: "Munch user",
                      callbackURL: returnTo,
                      newUserCallbackURL: returnTo,
                      errorCallbackURL: "/connect/error",
                      ...(oauthQuery ? { oauth_query: oauthQuery } : {}),
                  },
              );
              if (!response.ok) {
                  throw new Error(`magic_link_request_failed_${response.status}`);
              }
          } catch (error) {
          '''
          if old_magic not in text:
              raise SystemExit('magic-link block not found')
          text = text.replace(old_magic, new_magic, 1)

          old_consent = '''        try {
              return await auth.api.oauth2Consent({
                  headers: c.req.raw.headers,
                  body: {
                      accept,
                      scope,
                      oauth_query: oauthQuery,
                  },
                  asResponse: true,
              });
          } catch (error) {
              return connectionError(c, "oauth2_consent", error);
          }
          '''
          new_consent = '''        try {
              return await betterAuthJsonPost(
                  c,
                  "/api/auth/oauth2/consent",
                  {
                      accept,
                      scope,
                      oauth_query: oauthQuery,
                  },
              );
          } catch (error) {
              return connectionError(c, "oauth2_consent", error);
          }
          '''
          if old_consent not in text:
              raise SystemExit('consent block not found')
          path.write_text(text.replace(old_consent, new_consent, 1))
          PY
      - name: Add browser-equivalent OAuth certification
        run: |
          cat > scripts/better-auth-browser-oauth-smoke.ts <<'TS'
          #!/usr/bin/env bun

          process.env.MUNCH_REVIEWER_SEED_MODE = "true";

          if (!process.env.DATABASE_URL) {
              throw new Error("DATABASE_URL is required for browser OAuth smoke test");
          }

          const { Hono } = await import("hono");
          const { registerBetterAuthRoutes } = await import("../src/auth/routes.js");

          function cookieFrom(response: Response): string {
              const cookie = response.headers.get("set-cookie")?.split(";", 1)[0];
              if (!cookie) throw new Error("Better Auth issued no session cookie");
              return cookie;
          }

          function decodeHtml(value: string): string {
              return value
                  .replaceAll("&amp;", "&")
                  .replaceAll("&quot;", '"')
                  .replaceAll("&#39;", "'")
                  .replaceAll("&lt;", "<")
                  .replaceAll("&gt;", ">");
          }

          function hiddenValue(html: string, name: string): string {
              const match = html.match(
                  new RegExp(`name=["']${name}["'][^>]*value=["']([^"']*)["']`),
              );
              if (!match?.[1]) throw new Error(`Consent page omitted ${name}`);
              return decodeHtml(match[1]);
          }

          async function codeChallenge(verifier: string): Promise<string> {
              const digest = await crypto.subtle.digest(
                  "SHA-256",
                  new TextEncoder().encode(verifier),
              );
              return Buffer.from(digest)
                  .toString("base64")
                  .replaceAll("+", "-")
                  .replaceAll("/", "_")
                  .replaceAll("=", "");
          }

          const app = new Hono();
          registerBetterAuthRoutes(app);

          const suffix = crypto.randomUUID().replaceAll("-", "");
          const email = `browser-oauth-${suffix}@example.test`;
          const password = `Browser-${suffix}-Password!`;
          const signup = await app.request(
              "https://munch.example/api/auth/sign-up/email",
              {
                  method: "POST",
                  headers: {
                      "content-type": "application/json",
                      origin: "https://munch.example",
                  },
                  body: JSON.stringify({
                      name: "Browser OAuth smoke",
                      email,
                      password,
                  }),
              },
          );
          if (!signup.ok) {
              throw new Error(
                  `Reviewer-mode signup failed: ${signup.status} ${await signup.text()}`,
              );
          }
          const cookie = cookieFrom(signup);

          const redirectUri = "https://client.example/callback";
          const registration = await app.request(
              "https://munch.example/api/auth/oauth2/register",
              {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({
                      client_name: "Munch browser OAuth smoke",
                      redirect_uris: [redirectUri],
                      token_endpoint_auth_method: "none",
                      grant_types: ["authorization_code", "refresh_token"],
                      response_types: ["code"],
                  }),
              },
          );
          if (!registration.ok) {
              throw new Error(
                  `Dynamic registration failed: ${registration.status} ${await registration.text()}`,
              );
          }
          const client = (await registration.json()) as { client_id?: string };
          if (!client.client_id) throw new Error("Registration returned no client_id");

          const verifier = `v-${suffix}-${"x".repeat(48)}`;
          const state = `state-${suffix}`;
          const authorize = new URL(
              "https://munch.example/api/auth/oauth2/authorize",
          );
          authorize.searchParams.set("response_type", "code");
          authorize.searchParams.set("client_id", client.client_id);
          authorize.searchParams.set("redirect_uri", redirectUri);
          authorize.searchParams.set(
              "scope",
              "nutrition.read nutrition.write offline_access",
          );
          authorize.searchParams.set("state", state);
          authorize.searchParams.set(
              "code_challenge",
              await codeChallenge(verifier),
          );
          authorize.searchParams.set("code_challenge_method", "S256");

          const authorization = await app.request(authorize, {
              headers: { cookie },
              redirect: "manual",
          });
          if (authorization.status !== 302) {
              throw new Error(
                  `Authorization did not redirect: ${authorization.status} ${await authorization.text()}`,
              );
          }
          const consentLocation = authorization.headers.get("location");
          if (!consentLocation?.includes("/connect/consent")) {
              throw new Error(`Authorization did not reach consent: ${consentLocation}`);
          }

          const consentPage = await app.request(
              new URL(consentLocation, "https://munch.example"),
              { headers: { cookie } },
          );
          const consentHtml = await consentPage.text();
          if (consentPage.status !== 200) {
              throw new Error(`Consent page failed: ${consentPage.status}`);
          }

          const oauthQuery = hiddenValue(consentHtml, "oauth_query");
          const scope = hiddenValue(consentHtml, "scope");
          const clientId = hiddenValue(consentHtml, "client_id");
          const consent = await app.request(
              "https://munch.example/connect/consent",
              {
                  method: "POST",
                  headers: {
                      cookie,
                      origin: "https://munch.example",
                      "content-type": "application/x-www-form-urlencoded",
                  },
                  body: new URLSearchParams({
                      client_id: clientId,
                      scope,
                      oauth_query: oauthQuery,
                      decision: "approve",
                  }),
                  redirect: "manual",
              },
          );
          if (consent.status !== 302 && consent.status !== 303) {
              throw new Error(
                  `Consent failed: ${consent.status} ${await consent.text()}`,
              );
          }
          const callbackLocation = consent.headers.get("location");
          if (!callbackLocation) throw new Error("Consent returned no callback");
          const callback = new URL(callbackLocation, redirectUri);
          if (callback.origin + callback.pathname !== redirectUri) {
              throw new Error(`Consent redirected to unexpected URL: ${callback}`);
          }
          if (callback.searchParams.get("state") !== state) {
              throw new Error("Consent did not preserve OAuth state");
          }
          const code = callback.searchParams.get("code");
          if (!code) throw new Error(`Consent returned no code: ${callback}`);

          const token = await app.request(
              "https://munch.example/api/auth/oauth2/token",
              {
                  method: "POST",
                  headers: { "content-type": "application/x-www-form-urlencoded" },
                  body: new URLSearchParams({
                      grant_type: "authorization_code",
                      client_id: client.client_id,
                      redirect_uri: redirectUri,
                      code,
                      code_verifier: verifier,
                  }),
              },
          );
          const tokenText = await token.text();
          if (!token.ok) {
              throw new Error(`Token exchange failed: ${token.status} ${tokenText}`);
          }
          const tokens = JSON.parse(tokenText) as {
              access_token?: string;
              refresh_token?: string;
          };
          if (!tokens.access_token || !tokens.refresh_token) {
              throw new Error("Token exchange omitted access or refresh token");
          }

          console.log(
              "Better Auth browser authorize, consent, and token exchange passed.",
          );
          process.exit(0);
          TS

          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          anchor = '''      - name: Exercise Better Auth dynamic client registration
                  env:
                    NODE_ENV: test
                    MUNCH_AUTH_BACKEND: better_auth
                    BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    RESEND_API_KEY: re_test_schema
                    MUNCH_EMAIL_FROM: Munch <support@munch.example>
                  run: bun scripts/better-auth-oauth-http-smoke.ts
          '''
          addition = anchor + '''
                - name: Exercise Better Auth browser authorization flow
                  env:
                    NODE_ENV: test
                    MUNCH_AUTH_BACKEND: better_auth
                    BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                    RESEND_API_KEY: re_test_schema
                    MUNCH_EMAIL_FROM: Munch <support@munch.example>
                  run: bun scripts/better-auth-browser-oauth-smoke.ts
          '''
          if anchor not in text:
              raise SystemExit('CI Better Auth registration step not found')
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Format and commit fix
        run: |
          bunx prettier --write src/auth/connect-routes.ts scripts/better-auth-browser-oauth-smoke.ts .github/workflows/ci.yml
          rm .github/workflows/apply-oauth-continuation-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/auth/connect-routes.ts scripts/better-auth-browser-oauth-smoke.ts .github/workflows/ci.yml .github/workflows/apply-oauth-continuation-fix.yml
          git commit -m "fix: preserve Better Auth OAuth continuation"
          git push origin HEAD:fix/oauth-consent-request-continuation
