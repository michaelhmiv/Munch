name: Photo Model Bake-Off

# Vision model bake-off (Michael directive, 2026-11-10): Layer 1 runs
# scripts/photo-model-bakeoff.ts — every slate model through the
# PRODUCTION meal-photo identify path (only the slug varies) against
# all 40 golden fixtures × repeats, scored for cost/task, time/task,
# and accuracy. Layer 2 runs the finalists end-to-end through
# scripts/photo-eval-live.ts (identify + grounding + §3 bars) via its
# existing MUNCH_AI_MODEL override; dispatch this workflow once per
# finalist with layer=layer2 and model=<slug>.
#
# The fixture set is 100% synthetic illustrations: results rank models
# against each other on identical inputs and are NOT real-photo
# accuracy; both layers' reports say so in their own text.
#
# Pre-merge execution: workflow_dispatch requires the workflow to
# exist on the default branch, so on pull requests the live layers are
# LABEL-GATED instead (no label, no spend): label "run-bakeoff-layer1"
# runs Layer 1, label "run-bakeoff-layer2" runs the Layer 2 finalist
# matrix (finalist slugs are committed into the matrix once Layer 1
# results are in). Post-merge, workflow_dispatch is the normal route.
#
# GLM follow-up (Michael directive, 2026-11-10 ~22:05 ET): z-ai/glm-5.3-
# flash failed all 80 first-run calls because its endpoint is
# reasoning-mandatory and rejects the production reasoning:{enabled:
# false}. The harness now carries a bake-off-only accommodation for
# that slug (scripts/photo-model-bakeoff.ts, REQUEST_ACCOMMODATIONS).
# While this follow-up is in flight, the label-gated Layer 1 run is
# scoped to GLM only (BAKEOFF_MODELS below); GLM also joins the Layer 2
# matrix, and the layer2 label is applied only if its Layer 1 recall
# earns it. Dispatch runs keep the caller's model choice.

on:
    pull_request:
        types: [opened, synchronize, reopened, labeled]
        paths:
            - "scripts/photo-model-bakeoff.ts"
            - ".github/workflows/photo-model-bakeoff.yml"
    workflow_dispatch:
        inputs:
            layer:
                description: "layer1 = identify bake-off (all models); layer2 = full pipeline for ONE model"
                type: choice
                options:
                    - layer1
                    - layer2
                default: layer1
            model:
                description: "Layer 2 only: the model slug to run the full pipeline with"
                type: string
                required: false
                default: ""
            models:
                description: "Layer 1 only: comma-separated model slugs (empty = full slate)"
                type: string
                required: false
                default: ""
            repeats:
                description: "Layer 1 only: identify repeats per fixture"
                type: string
                required: false
                default: "2"

permissions:
    contents: read

concurrency:
    group: photo-model-bakeoff-${{ inputs.layer }}-${{ inputs.model }}
    cancel-in-progress: false

jobs:
    layer1:
        if: (github.event_name == 'workflow_dispatch' && inputs.layer == 'layer1') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-bakeoff-layer1'))
        runs-on: ubuntu-latest
        timeout-minutes: 180
        env:
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            BAKEOFF_REPEATS: ${{ inputs.repeats }}
            # Label-gated PR runs are the GLM follow-up: GLM only.
            # Dispatch runs take the caller's models input (empty = the
            # script's full-slate default).
            BAKEOFF_MODELS: ${{ github.event_name == 'pull_request' && 'z-ai/glm-5.3-flash' || inputs.models }}
            BAKEOFF_GLM_REASONING: omit
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run Layer 1 identify bake-off
              run: bun scripts/photo-model-bakeoff.ts
            - name: Publish report to the run summary
              if: always()
              run: |
                  if [ -f bakeoff-report/report.md ]; then
                    cat bakeoff-report/report.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "Bake-off produced no report (see job log)." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Upload bake-off report artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bakeoff-report
                  path: bakeoff-report/
                  if-no-files-found: warn
                  retention-days: 30

    layer2:
        if: github.event_name == 'workflow_dispatch' && inputs.layer == 'layer2'
        runs-on: ubuntu-latest
        timeout-minutes: 40
        env:
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
            OFF_USER_AGENT: "Munch Photo Eval (photo-eval@munch.business)"
            MUNCH_AI_MODEL: ${{ inputs.model }}
            PHOTO_EVAL_OUT: photo-eval-report
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Compute artifact suffix from the model slug
              id: suffix
              run: echo "value=$(echo '${{ inputs.model }}' | tr '/.' '__')" >> "$GITHUB_OUTPUT"
            - name: Run full photo pipeline for the finalist model
              id: pipeline
              # photo-eval-live exits 1 when the §3 bars are breached;
              # for a finalist comparison that is evidence, not a
              # harness failure — keep the job green and the report.
              continue-on-error: true
              run: |
                  test -n "${{ inputs.model }}" || { echo "layer2 requires the model input"; exit 1; }
                  bun scripts/photo-eval-live.ts
            - name: Publish report to the run summary
              if: always()
              run: |
                  echo "photo-eval-live outcome: ${{ steps.pipeline.outcome }} (bar breach exits 1 by design)" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f photo-eval-report/report.md ]; then
                    cat photo-eval-report/report.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "Layer 2 produced no report (see job log)." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Upload layer 2 report artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: photo-eval-layer2-${{ steps.suffix.outputs.value }}
                  path: photo-eval-report/
                  if-no-files-found: warn
                  retention-days: 30

    layer2-finalists:
        # Pre-merge Layer 2 (label-gated; see header). Finalist slugs
        # from the Layer 1 results, run 42948534624: meta/muse-ember
        # (control — always a finalist), qwen/qwen3.7-flash and
        # openai/gpt-5.6-luna (top two challengers: tied at 50.8%
        # headline recall, qwen ahead on the precision tiebreak;
        # nova-lite and deepseek-v4.1-flash ranked below both).
        # z-ai/glm-5.3-flash joins for its follow-up measurement (see
        # header); note photo-eval-live.ts runs the PRODUCTION call
        # shape, so a GLM leg measures whether the raw pipeline can
        # drive it at all.
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-bakeoff-layer2')
        runs-on: ubuntu-latest
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                model:
                    - meta/muse-ember
                    - qwen/qwen3.7-flash
                    - openai/gpt-5.6-luna
                    - z-ai/glm-5.3-flash
        env:
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
            OFF_USER_AGENT: "Munch Photo Eval (photo-eval@munch.business)"
            MUNCH_AI_MODEL: ${{ matrix.model }}
            PHOTO_EVAL_OUT: photo-eval-report
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Compute artifact suffix from the model slug
              id: suffix
              run: echo "value=$(echo '${{ matrix.model }}' | tr '/.' '__')" >> "$GITHUB_OUTPUT"
            - name: Run full photo pipeline for the finalist model
              id: pipeline
              # Same bar-breach semantics as the layer2 dispatch job:
              # exit 1 on §3 bar breach is evidence, not a job failure.
              continue-on-error: true
              run: bun scripts/photo-eval-live.ts
            - name: Publish report to the run summary
              if: always()
              run: |
                  echo "Model: ${{ matrix.model }} · photo-eval-live outcome: ${{ steps.pipeline.outcome }}" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f photo-eval-report/report.md ]; then
                    cat photo-eval-report/report.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "Layer 2 produced no report for ${{ matrix.model }} (see job log)." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Upload layer 2 report artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: photo-eval-layer2-${{ steps.suffix.outputs.value }}
                  path: photo-eval-report/
                  if-no-files-found: warn
                  retention-days: 30
