name: Temporary format Luna food agent

on:
    push:
        branches:
            - fix/food-ranking-gtin-quality

permissions:
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/food-ranking-gtin-quality
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: bunx prettier --write scripts/openrouter-food-adjudication-smoke.ts src/food-tools.ts
            - name: Commit exact formatting
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/openrouter-food-adjudication-smoke.ts src/food-tools.ts
                  git diff --cached --quiet || git commit -m "style: format food agent changes"
                  git push origin HEAD:fix/food-ranking-gtin-quality
