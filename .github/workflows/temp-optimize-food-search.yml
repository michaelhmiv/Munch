name: Temporary optimize food search

on:
    push:
        branches:
            - fix/food-ranking-gtin-quality

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/food-ranking-gtin-quality
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Prefer simple lexical candidates without broadening scans
              run: |
                  python3 - <<'PY'
                  from pathlib import Path

                  path = Path('src/food-providers/catalog-repository.ts')
                  text = path.read_text()
                  old = 'const retrievalLimit = Math.min(75, Math.max(25, boundedLimit * 5));'
                  new = 'const retrievalLimit = Math.min(50, Math.max(25, boundedLimit * 5));'
                  if old not in text:
                      if new not in text:
                          raise SystemExit('retrieval limit anchor changed')
                  else:
                      text = text.replace(old, new, 1)
                  old_order = '''                                  case when normalized_name = ${normalized} then 0 else 1 end,
                                  ts_rank_cd('''
                  new_order = '''                                  case when normalized_name = ${normalized} then 0 else 1 end,
                                  length(normalized_name) asc,
                                  ts_rank_cd('''
                  if old_order not in text:
                      if new_order not in text:
                          raise SystemExit('lexical order anchor changed')
                  else:
                      text = text.replace(old_order, new_order, 1)
                  path.write_text(text)

                  path = Path('src/food-providers/ranking.ts')
                  text = path.read_text()
                  anchor = '    "tofu",\n]);'
                  replacement = '''    "tofu",
                      "cheese",
                      "bean",
                      "babyfood",
                      "ring",
                      "pudding",
                      "bread",
                      "turkey",
                  ]);'''
                  if anchor not in text:
                      if '    "babyfood",' not in text:
                          raise SystemExit('ranking token anchor changed')
                  else:
                      text = text.replace(anchor, replacement, 1)
                  path.write_text(text)
                  PY
            - run: bunx prettier --write src/food-providers/catalog-repository.ts src/food-providers/ranking.ts
            - run: bun test src/food-providers/ranking.test.ts src/food-providers/service.test.ts src/food-providers/catalog-repository.test.ts
            - name: Commit optimization
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/food-providers/catalog-repository.ts src/food-providers/ranking.ts
                  git diff --cached --quiet || git commit -m "fix: prefer simple food forms in local ranking"
                  git push origin HEAD:fix/food-ranking-gtin-quality
