name: Temporary optimize food search

on:
    push:
        branches:
            - fix/food-ranking-gtin-quality

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/food-ranking-gtin-quality
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Restore indexed lexical retrieval and strengthen derived-form ranking
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  import re

                  path = Path('src/food-providers/catalog-repository.ts')
                  text = path.read_text()
                  pattern = re.compile(r'    async searchLocal\(query: string, limit: number\): Promise<CatalogHit\[]> \{.*?\n    \}\n\n    async findCachedSearch', re.S)
                  replacement = '''    async searchLocal(query: string, limit: number): Promise<CatalogHit[]> {
                      if (!this.config.readsEnabled) return [];
                      const normalized = normalizeFoodText(query);
                      if (!normalized) return [];
                      const boundedLimit = Math.max(1, Math.min(25, limit));
                      const retrievalLimit = Math.min(75, Math.max(25, boundedLimit * 5));
                      const lexicalRows = await withServiceDatabase(
                          async (tx) =>
                              tx<CatalogRow[]>`
                              select id, provider, provider_food_id, source_snapshot, refresh_after
                              from munch.food_catalog_entries
                              where deprecated_at is null
                                and to_tsvector(
                                      'simple',
                                      normalized_name || ' ' || coalesce(normalized_brand, '')
                                    ) @@ plainto_tsquery('simple', ${normalized})
                              order by
                                  case when normalized_name = ${normalized} then 0 else 1 end,
                                  ts_rank_cd(
                                      to_tsvector(
                                          'simple',
                                          normalized_name || ' ' || coalesce(normalized_brand, '')
                                      ),
                                      plainto_tsquery('simple', ${normalized})
                                  ) desc,
                                  greatest(
                                      similarity(normalized_name, ${normalized}),
                                      similarity(coalesce(normalized_brand, ''), ${normalized})
                                  ) desc,
                                  confidence desc,
                                  length(normalized_name) asc
                              limit ${retrievalLimit}
                          `,
                      );
                      const rows = lexicalRows.length
                          ? lexicalRows
                          : await withServiceDatabase(
                                async (tx) =>
                                    tx<CatalogRow[]>`
                                    select id, provider, provider_food_id, source_snapshot, refresh_after
                                    from munch.food_catalog_entries
                                    where deprecated_at is null
                                      and (
                                        normalized_name % ${normalized}
                                        or normalized_name like ${`%${normalized}%`}
                                        or coalesce(normalized_brand, '') % ${normalized}
                                      )
                                    order by
                                        case when normalized_name = ${normalized} then 0 else 1 end,
                                        greatest(
                                            similarity(normalized_name, ${normalized}),
                                            similarity(coalesce(normalized_brand, ''), ${normalized})
                                        ) desc,
                                        confidence desc,
                                        length(normalized_name) asc
                                    limit ${retrievalLimit}
                                `,
                            );
                      const now = Date.now();
                      const hits = rows.flatMap((row) => {
                          const hit = hitFromRow(row, now);
                          return hit ? [hit] : [];
                      });
                      const ranked = rankCandidates(
                          { query: normalized },
                          hits.map((hit) => hit.candidate),
                      );
                      const order = new Map(
                          ranked.map((candidate, index) => [
                              `${candidate.provider}:${candidate.providerFoodId}`,
                              index,
                          ]),
                      );
                      const rowIds = new Map(
                          rows.map((row) => [
                              `${row.provider}:${row.provider_food_id}`,
                              row.id,
                          ]),
                      );
                      const selected = hits
                          .sort(
                              (left, right) =>
                                  (order.get(`${left.candidate.provider}:${left.candidate.providerFoodId}`) ?? Number.MAX_SAFE_INTEGER) -
                                  (order.get(`${right.candidate.provider}:${right.candidate.providerFoodId}`) ?? Number.MAX_SAFE_INTEGER),
                          )
                          .slice(0, boundedLimit);
                      this.scheduleTouch(
                          selected
                              .map((hit) =>
                                  rowIds.get(`${hit.candidate.provider}:${hit.candidate.providerFoodId}`) ?? '',
                              )
                              .filter(Boolean),
                      );
                      return selected;
                  }

                  async findCachedSearch'''
                  text, count = pattern.subn(replacement, text, count=1)
                  if count != 1:
                      raise SystemExit('searchLocal anchor changed')
                  path.write_text(text)

                  path = Path('src/food-providers/ranking.ts')
                  text = path.read_text()
                  anchor = '    "dressing",\n]);'
                  replacement = '''    "dressing",
                      "powder",
                      "flour",
                      "cracker",
                      "yogurt",
                      "custard",
                      "pancake",
                      "bagel",
                      "raisin",
                      "meatless",
                      "tofu",
                  ]);'''
                  if anchor not in text:
                      raise SystemExit('composite token anchor changed')
                  path.write_text(text.replace(anchor, replacement, 1))
                  PY
            - run: bunx prettier --write src/food-providers/catalog-repository.ts src/food-providers/ranking.ts
            - run: bun test src/food-providers/ranking.test.ts src/food-providers/service.test.ts src/food-providers/catalog-repository.test.ts
            - name: Commit optimization
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/food-providers/catalog-repository.ts src/food-providers/ranking.ts
                  git diff --cached --quiet || git commit -m "perf: keep food reranking on indexed retrieval"
                  git push origin HEAD:fix/food-ranking-gtin-quality
