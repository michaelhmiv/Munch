name: Temporary optimize food search

on:
    push:
        branches:
            - fix/food-ranking-gtin-quality

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/food-ranking-gtin-quality
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Prefer simple lexical candidates without broadening scans
              run: |
                  python3 - <<'PY'
                  from pathlib import Path

                  path = Path('src/food-providers/catalog-repository.ts')
                  text = path.read_text()
                  old = 'const retrievalLimit = Math.min(75, Math.max(25, boundedLimit * 5));'
                  new = 'const retrievalLimit = Math.min(50, Math.max(25, boundedLimit * 5));'
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit('retrieval limit anchor changed')

                  lines = text.splitlines()
                  if not any('length(normalized_name) asc,' in line and i > 0 and 'case when normalized_name' in lines[i-1] for i, line in enumerate(lines)):
                      inserted = False
                      for i, line in enumerate(lines):
                          if 'case when normalized_name = ${normalized} then 0 else 1 end,' not in line:
                              continue
                          if i + 1 < len(lines) and lines[i + 1].strip().startswith('ts_rank_cd('):
                              indent = line[:len(line) - len(line.lstrip())]
                              lines.insert(i + 1, indent + 'length(normalized_name) asc,')
                              inserted = True
                              break
                      if not inserted:
                          raise SystemExit('lexical order anchor changed')
                  text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
                  path.write_text(text)

                  path = Path('src/food-providers/ranking.ts')
                  text = path.read_text()
                  if '    "babyfood",' not in text:
                      anchor = '    "tofu",\n'
                      replacement = '''    "tofu",
                      "cheese",
                      "bean",
                      "babyfood",
                      "ring",
                      "pudding",
                      "bread",
                      "turkey",
                  '''
                      if anchor not in text:
                          raise SystemExit('ranking token anchor changed')
                      text = text.replace(anchor, replacement, 1)
                  path.write_text(text)
                  PY
            - run: bunx prettier --write src/food-providers/catalog-repository.ts src/food-providers/ranking.ts
            - run: bun test src/food-providers/ranking.test.ts src/food-providers/service.test.ts src/food-providers/catalog-repository.test.ts
            - name: Commit optimization
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/food-providers/catalog-repository.ts src/food-providers/ranking.ts
                  git diff --cached --quiet || git commit -m "fix: prefer simple food forms in local ranking"
                  git push origin HEAD:fix/food-ranking-gtin-quality
