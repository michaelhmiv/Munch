name: Fix PR 21 CI

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-pr21-ci
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/munch-frontend-overhaul
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply OAuth array binding fix
        run: python scripts/fix-pr21-ci.py

      - name: Format changed source
        run: bunx prettier --write src/oauth-platform/repository.ts

      - name: Commit fix
        run: |
          git checkout -- .github/workflows/fix-pr21-ci.yml
          rm scripts/fix-pr21-ci.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind OAuth redirect URIs as a PostgreSQL array"
          git push origin HEAD:feat/munch-frontend-overhaul
