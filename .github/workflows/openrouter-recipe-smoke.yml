name: Manual OpenRouter Recipe Smoke

on:
    workflow_dispatch:
        inputs:
            model:
                description: "OpenRouter model ID to exercise"
                required: false
                default: "openai/gpt-5.6-luna"
                type: string
            response_format:
                description: "Structured response mode"
                required: false
                default: "json_schema"
                type: choice
                options:
                    - json_schema
                    - json_object
            timeout_ms:
                description: "Per-call timeout in milliseconds"
                required: false
                default: "10000"
                type: string

pull_request:
        paths:
            - ".github/workflows/openrouter-recipe-smoke.yml"
            - "scripts/openrouter-recipe-live-smoke.ts"
            - "src/recipe-import/**"
            - "package.json"
            - "bun.lock"

permissions:
    contents: read

concurrency:
    group: openrouter-recipe-smoke
    cancel-in-progress: true

jobs:
    live:
        name: Live website recipe AI smoke
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            MUNCH_RECIPE_IMPORT_AI_ENABLED: "true"
            MUNCH_RECIPE_IMPORT_AI_MODEL: ${{ inputs.model || 'openai/gpt-5.6-luna' }}
            MUNCH_RECIPE_IMPORT_AI_RESPONSE_FORMAT: ${{ inputs.response_format || 'json_schema' }}
            MUNCH_RECIPE_IMPORT_AI_RESPONSE_HEALING: "true"
            MUNCH_RECIPE_IMPORT_AI_TIMEOUT_MS: ${{ inputs.timeout_ms || '30000' }}
            MUNCH_RECIPE_IMPORT_AI_MAX_CALLS_PER_IMPORT: "2"
            MUNCH_RECIPE_IMPORT_AI_MAX_TOKENS: "4000"
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run live OpenRouter recipe assignment smoke
              run: bun scripts/openrouter-recipe-live-smoke.ts
