name: Inspect Better Auth resource API

on:
  pull_request:
  push:
    branches:
      - fix/better-auth-mcp-bearer-discovery

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Inspect installed resource-server APIs
        run: |
          echo '=== introspection API names ==='
          grep -R -n -i -A30 -B15 "introspect.*verify\|verify.*introspect\|oauth2introspect" \
            node_modules/@better-auth/oauth-provider/dist \
            node_modules/better-auth/dist \
            | head -n 800
          echo '=== oauth provider endpoint definitions ==='
          grep -R -n -i -A30 -B15 'introspect' node_modules/@better-auth/oauth-provider/dist/*.d.mts | head -n 800
