name: Inspect Better Auth resource API

on:
  pull_request:
  push:
    branches:
      - fix/better-auth-mcp-bearer-discovery

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Inspect installed resource-server APIs
        run: |
          echo '=== client-resource.d.mts ==='
          sed -n '1,150p' node_modules/@better-auth/oauth-provider/dist/client-resource.d.mts
          echo '=== client-resource.mjs ==='
          sed -n '1,150p' node_modules/@better-auth/oauth-provider/dist/client-resource.mjs
          echo '=== oauth2 declarations ==='
          grep -R -n -A35 -B10 "declare.*verifyAccessToken\|function verifyAccessToken" node_modules/better-auth/dist node_modules/@better-auth/oauth-provider/dist | head -n 500
