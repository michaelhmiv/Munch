name: Inspect Better Auth resource API

on:
  pull_request:
  push:
    branches:
      - fix/better-auth-mcp-bearer-discovery

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Inspect installed resource-server APIs
        run: |
          echo '=== introspection endpoint implementation ==='
          sed -n '3270,3425p' node_modules/@better-auth/oauth-provider/dist/index.mjs
          echo '=== introspection helpers ==='
          grep -n -E "function .*ntrospect|const .*ntrospect|introspectToken|tokenIntrospection" node_modules/@better-auth/oauth-provider/dist/index.mjs | head -n 100
