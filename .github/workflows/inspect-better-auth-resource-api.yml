name: Inspect Better Auth resource API

on:
  pull_request:
  push:
    branches:
      - fix/better-auth-mcp-bearer-discovery

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Inspect installed resource-server APIs
        run: |
          echo '=== introspection helper ==='
          sed -n '970,1135p' node_modules/@better-auth/oauth-provider/dist/index.mjs
          echo '=== package exports ==='
          cat node_modules/@better-auth/oauth-provider/package.json
