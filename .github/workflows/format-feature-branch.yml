name: Format structured provenance branch

on:
  push:
    branches:
      - feat/structured-provenance-resolution

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/structured-provenance-resolution
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format changed implementation files
        run: |
          bunx prettier --write \
            public/app-patches.js \
            public/widgets/src/templates/meal-logged.html \
            scripts/structured-meal-smoke.ts \
            src/app/routes.ts \
            src/canonical-food-search.ts \
            src/mcp-runtime.ts \
            src/structured-log-meal.test.ts \
            src/structured-log-meal.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/app-patches.js \
            public/widgets/src/templates/meal-logged.html \
            scripts/structured-meal-smoke.ts \
            src/app/routes.ts \
            src/canonical-food-search.ts \
            src/mcp-runtime.ts \
            src/structured-log-meal.test.ts \
            src/structured-log-meal.ts
          git commit -m "style: apply repository formatting"
          git push origin HEAD:feat/structured-provenance-resolution
