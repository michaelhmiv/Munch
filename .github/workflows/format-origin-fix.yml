name: Format origin fix

on:
  push:
    branches:
      - fix/proxy-aware-request-origin

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/proxy-aware-request-origin
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format focused files
        run: bunx prettier --write src/accounts/csrf.ts src/accounts/csrf.test.ts

      - name: Commit formatting and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/format-origin-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format proxy-aware origin fix"
          git push origin HEAD:fix/proxy-aware-request-origin
