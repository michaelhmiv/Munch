name: Pantry intelligence fixup

on:
  push:
    branches:
      - feat/pantry-intelligence-planning

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-intelligence-planning
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply Pantry intelligence wiring
        run: python3 scripts/pantry-intelligence-fixup.py
      - name: Format and verify wired surfaces
        run: |
          bunx prettier --write src/inventory src/recipe-planning-tools.ts db/schema/0025_inventory_planning_profiles.sql db/updates/0027_inventory_planning_profiles.sql
          bun test src/inventory
          bun run typecheck
      - name: Commit verified product wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inventory src/recipe-planning-tools.ts db/schema/0025_inventory_planning_profiles.sql db/updates/0027_inventory_planning_profiles.sql
          if ! git diff --cached --quiet; then
            git commit -m "feat: wire Pantry intelligence planning surfaces"
            git push origin HEAD:feat/pantry-intelligence-planning
          fi
