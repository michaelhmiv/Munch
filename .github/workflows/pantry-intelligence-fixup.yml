name: Pantry intelligence fixup

on:
  push:
    branches:
      - feat/pantry-intelligence-planning

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-intelligence-planning
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Wire Pantry intelligence into existing surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected marker missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # MCP Pantry: keep three-tool catalog, add opt-in planning detail and
          # best-effort enrichment after explicit acquisitions/reconciliation.
          replace(
              "src/inventory/tools.ts",
              'import type { MunchCapabilities } from "../billing/capabilities.js";\n',
              'import type { MunchCapabilities } from "../billing/capabilities.js";\nimport { getPantryPlanningContext } from "./meal-planning.js";\nimport {\n    enrichPantryItemsBestEffort,\n    pantryPlanningEnabled,\n} from "./planning-profile.js";\n',
          )
          replace(
              "src/inventory/tools.ts",
              'const stockStateSchema = z.enum(["available", "low", "depleted"]);\n\nconst pantryItemOutputSchema = z.object({',
              '''const stockStateSchema = z.enum(["available", "low", "depleted"]);

