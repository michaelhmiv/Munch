name: Temporary regenerate submission

on:
  push:
    branches:
      - perf/mcp-tool-gateway

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mcp-tool-gateway
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bun scripts/generate-openai-submission.ts
      - name: Commit generated package when changed
        shell: bash
        run: |
          if git diff --quiet -- chatgpt-app-submission.json docs/openai-submission/tool-inventory.md; then
            echo "Submission package already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-app-submission.json docs/openai-submission/tool-inventory.md
          git commit -m "docs: regenerate OpenAI submission tool inventory"
          git push origin HEAD:perf/mcp-tool-gateway
