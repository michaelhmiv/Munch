name: Format paid household seats

on:
  push:
    branches:
      - feat/paid-household-seats

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paid-household-seats
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format household billing files
        run: >-
          bunx prettier --write
          src/billing/capabilities.ts
          src/billing/household-seats.ts
          src/billing/stripe-client.ts
          src/billing/stripe-household-seat.test.ts
          src/households/repository.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/billing/capabilities.ts src/billing/household-seats.ts src/billing/stripe-client.ts src/billing/stripe-household-seat.test.ts src/households/repository.ts
          git commit -m "chore: format paid household seat changes"
          git push origin HEAD:feat/paid-household-seats
