name: Format progressive density branch

on:
  push:
    branches:
      - feat/progressive-density-ui-main

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted-ui]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/progressive-density-ui-main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - name: Format changed UI files
        run: |
          bunx prettier --write public/app.html public/widgets/src/templates/meal-logged.html src/ui-density.test.ts
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.html public/widgets/src/templates/meal-logged.html src/ui-density.test.ts
          git commit -m "Format progressive density UI [formatted-ui]"
          git push origin HEAD:feat/progressive-density-ui-main
