name: Submission schema codemod

on:
  push:
    branches:
      - feat/openai-submission-readiness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[submission-schema]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openai-submission-readiness
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Add explicit planning output schemas and relative reviewer dates
        shell: python
        run: |
          import re
          from pathlib import Path

          recipe = Path("src/recipe-planning-tools.ts")
          text = recipe.read_text()
          schema_marker = '''const groceryItemSchema = z.object({
              name: z.string().min(1).max(300),
              quantity: z.number().positive().optional(),
              unit: z.string().max(80).optional(),
              note: z.string().max(500).optional(),
              food_provider: z.string().max(80).optional(),
              provider_food_id: z.string().max(300).optional(),
          });

          function toRecipeInput'''
          schema_block = '''const groceryItemSchema = z.object({
              name: z.string().min(1).max(300),
              quantity: z.number().positive().optional(),
              unit: z.string().max(80).optional(),
              note: z.string().max(500).optional(),
              food_provider: z.string().max(80).optional(),
              provider_food_id: z.string().max(300).optional(),
          });

          const nutritionStatusOutputSchema = z.enum([
              "complete",
              "partial",
              "unavailable",
          ]);
          const savedRecipeResultOutputSchema = z.object({
              recipeId: z.string().uuid(),
              revisionId: z.string().uuid(),
              revisionNumber: z.number().int().positive(),
              nutritionStatus: nutritionStatusOutputSchema,
              totals: nutrientSchema,
              perServing: nutrientSchema,
              deduplicated: z.boolean(),
          });
          const recipeSummaryOutputSchema = z.object({
              recipe_id: z.string().uuid(),
              revision_id: z.string().uuid(),
              name: z.string(),
              ownership: z.enum(["personal", "household"]),
              servings: z.number().positive(),
              nutrition_status: nutritionStatusOutputSchema,
              nutrition_per_serving: nutrientSchema,
              preparation_minutes: z.number().int().nonnegative().nullable(),
              cooking_minutes: z.number().int().nonnegative().nullable(),
              times_scheduled: z.number().int().nonnegative(),
              last_scheduled_date: z.string().nullable(),
              times_logged: z.number().int().nonnegative(),
              last_logged_at: z.string().nullable(),
              updated_at: z.string(),
          });
          const recipeIngredientOutputSchema = z.object({
              id: z.string().uuid(),
              position: z.number().int().nonnegative(),
              name: z.string(),
              quantity: z.number().nullable(),
              unit: z.string().nullable(),
              preparation: z.string().nullable(),
              optional: z.boolean(),
              gram_weight: z.number().nullable(),
              nutrients: nutrientSchema,
              provider: z.string().nullable(),
              provider_food_id: z.string().nullable(),
              source_type: z.string(),
              source_url: z.string().nullable(),
              confidence: z.number().nullable(),
          });
          const recipeDetailOutputSchema = z.object({
              id: z.string().uuid(),
              name: z.string(),
              ownership: z.union([
                  z.object({ type: z.literal("personal") }),
                  z.object({
                      type: z.literal("household"),
                      household_id: z.string().uuid(),
                  }),
              ]),
              revision_id: z.string().uuid(),
              revision_number: z.number().int().positive(),
              servings: z.number().positive(),
              description: z.string().nullable(),
              instructions: z.array(z.string()),
              preparation_minutes: z.number().int().nonnegative().nullable(),
              cooking_minutes: z.number().int().nonnegative().nullable(),
              source: z.object({
                  type: z.string(),
                  title: z.string().nullable(),
                  url: z.string().nullable(),
              }),
              nutrition_status: nutritionStatusOutputSchema,
              nutrition_total: nutrientSchema,
              nutrition_per_serving: nutrientSchema,
              ingredients: z.array(recipeIngredientOutputSchema),
              created_at: z.string(),
              updated_at: z.string(),
          });
          const plannedMealOutputSchema = z.object({
              planned_meal_id: z.string().uuid(),
              planned_date: z.string(),
              meal_slot: z
                  .enum(["breakfast", "lunch", "dinner", "snack"])
                  .nullable(),
              recipe_id: z.string().uuid().optional(),
              recipe_revision_id: z.string().uuid().optional(),
              recipe_name: z.string().optional(),
              servings: z.number().positive(),
              note: z.string().nullable().optional(),
              ownership: z.enum(["personal", "household"]).optional(),
              created_by: z.string().nullable().optional(),
              nutrition_per_serving: nutrientSchema.optional(),
              version: z.number().int().positive().optional(),
          });
          const groceryListItemOutputSchema = z.object({
              grocery_item_id: z.string().uuid(),
              name: z.string(),
              quantity: z.number().nullable(),
              unit: z.string().nullable(),
              note: z.string().nullable(),
              purchased_at: z.string().nullable(),
              source_recipe_id: z.string().uuid().nullable(),
              source_planned_meal_id: z.string().uuid().nullable(),
              added_by: z.string().nullable(),
              version: z.number().int().positive(),
          });
          const groceryMutationItemOutputSchema = z.object({
              id: z.string().uuid(),
              name: z.string(),
              quantity: z.union([z.number(), z.string()]).nullable(),
              unit: z.string().nullable(),
              purchased_at: z.string().nullable(),
              version: z.union([z.number(), z.string()]),
              merged: z.boolean(),
          });
          const groceryListOutputSchema = z.object({
              groceryListId: z.string().uuid().nullable(),
              items: z.array(groceryListItemOutputSchema),
          });
          const groceryMutationOutputSchema = z.object({
              groceryListId: z.string().uuid().nullable(),
              items: z.array(groceryMutationItemOutputSchema),
          });
          const groceryPurchasedOutputSchema = z.object({
              grocery_item_id: z.string().uuid(),
              purchased_at: z.string().nullable(),
              version: z.number().int().positive(),
          });

          const planningOutputSchemas = {
              search_recipes: { recipes: z.array(recipeSummaryOutputSchema) },
              get_recipe: { recipe: recipeDetailOutputSchema.nullable() },
              save_recipe: { recipe: savedRecipeResultOutputSchema },
              get_meal_plan: { planned_meals: z.array(plannedMealOutputSchema) },
              get_grocery_list: { grocery: groceryListOutputSchema },
              schedule_recipe: { planned_meal: plannedMealOutputSchema },
              add_grocery_items: { grocery: groceryMutationOutputSchema },
              mark_grocery_item_purchased: {
                  grocery_item: groceryPurchasedOutputSchema,
              },
              save_recipe_and_plan: {
                  recipe: savedRecipeResultOutputSchema,
                  plannedMeal: plannedMealOutputSchema,
                  grocery: groceryMutationOutputSchema,
              },
          } as const;

          function toRecipeInput'''
          assert text.count(schema_marker) == 1
          text = text.replace(schema_marker, schema_block)

          tool_names = [
              "search_recipes",
              "get_recipe",
              "save_recipe",
              "get_meal_plan",
              "get_grocery_list",
              "schedule_recipe",
              "add_grocery_items",
              "mark_grocery_item_purchased",
              "save_recipe_and_plan",
          ]
          for name in tool_names:
              pattern = re.compile(
                  rf'(toolServer\.registerTool\(\s*"{name}",\s*\{{)(.*?)(\n\s*\}},\s*\n\s*async)',
                  re.S,
              )
              match = pattern.search(text)
              assert match, name
              body = match.group(2)
              assert "outputSchema:" not in body, name
              indentation = "            " if name in {
                  "save_recipe", "get_meal_plan", "get_grocery_list"
              } else "        "
              insertion = f'\n{indentation}outputSchema: planningOutputSchemas.{name},'
              replacement = match.group(1) + body.rstrip() + insertion + match.group(3)
              text = text[:match.start()] + replacement + text[match.end():]

          helper_marker = '''function groceryInputs(items: z.infer<typeof groceryItemSchema>[]) {
              return items.map((item) => ({
                  name: item.name,
                  quantity: item.quantity,
                  unit: item.unit,
                  note: item.note,
                  foodProvider: item.food_provider,
                  providerFoodId: item.provider_food_id,
              }));
          }

          export function registerRecipePlanningTools'''
          helper_block = '''function groceryInputs(items: z.infer<typeof groceryItemSchema>[]) {
              return items.map((item) => ({
                  name: item.name,
                  quantity: item.quantity,
                  unit: item.unit,
                  note: item.note,
                  foodProvider: item.food_provider,
                  providerFoodId: item.provider_food_id,
              }));
          }

          function serializeScheduledMeal(planned: Record<string, unknown>) {
              return {
                  planned_meal_id: String(planned.id),
                  planned_date: String(planned.planned_date),
                  meal_slot:
                      planned.meal_slot == null ? null : String(planned.meal_slot),
                  servings: Number(planned.servings),
              };
          }

          export function registerRecipePlanningTools'''
          assert text.count(helper_marker) == 1
          text = text.replace(helper_marker, helper_block)
          old_scheduled = 'structuredContent: { planned_meal: planned },'
          assert text.count(old_scheduled) == 1
          text = text.replace(
              old_scheduled,
              'structuredContent: {\n                            planned_meal: serializeScheduledMeal(planned),\n                        },',
          )
          recipe.write_text(text)

          reviewer = Path("scripts/provision-reviewer.ts")
          text = reviewer.read_text()
          date_marker = '''if (
              !Number.isFinite(expiresAt.getTime()) ||
              expiresAt.getTime() <= Date.now()
          ) {
              throw new Error("MUNCH_REVIEWER_EXPIRES_AT must be a future ISO date");
          }

          const { Pool }'''
          date_block = '''if (
              !Number.isFinite(expiresAt.getTime()) ||
              expiresAt.getTime() <= Date.now()
          ) {
              throw new Error("MUNCH_REVIEWER_EXPIRES_AT must be a future ISO date");
          }

          function dateAfterDays(days: number): string {
              const value = new Date();
              value.setUTCDate(value.getUTCDate() + days);
              return value.toISOString().slice(0, 10);
          }

          const personalPlanDate = dateAfterDays(1);
          const householdPlanDate = dateAfterDays(5);

          const { Pool }'''
          assert text.count(date_marker) == 1
          text = text.replace(date_marker, date_block)
          text = text.replace('plannedDate: "2026-08-06",', 'plannedDate: personalPlanDate,')
          text = text.replace(
              'idempotencyKey: "reviewer-seed-personal-v1",',
              'idempotencyKey: `reviewer-seed-personal-${personalPlanDate}`,',
          )
          text = text.replace('plannedDate: "2026-08-10",', 'plannedDate: householdPlanDate,')
          text = text.replace(
              'idempotencyKey: "reviewer-seed-household-v1",',
              'idempotencyKey: `reviewer-seed-household-${householdPlanDate}`,',
          )
          assert "2026-08-06" not in text and "2026-08-10" not in text
          reviewer.write_text(text)

      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/recipe-planning-tools.ts scripts/provision-reviewer.ts
          bun run typecheck
          bun test

      - name: Commit schema updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recipe-planning-tools.ts scripts/provision-reviewer.ts
          git commit -m "fix(mcp): complete planning schemas and reviewer fixtures [submission-schema]"
          git push origin HEAD:feat/openai-submission-readiness
