name: Play billing shared helper

on:
  push:
    branches:
      - mobile/07-play-billing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[play-shared-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/07-play-billing
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Patch shared billing surfaces
        run: bun scripts/patch-play-billing-shared-ui.ts
      - name: Format patched and new billing source
        run: |
          bunx prettier --write \
            public/app-account.js \
            src/app/routes.ts \
            src/product-config.ts \
            src/billing/capabilities.ts \
            src/billing/store-repository.ts \
            src/billing/subscription-sources.ts \
            src/billing/google-play-config.ts \
            src/billing/google-play-client.ts \
            src/billing/google-play.ts \
            src/billing/routes.ts \
            mobile/runtime.js \
            mobile/billing-native.js \
            mobile/mobile-entry.js \
            scripts/build-mobile-web.ts \
            scripts/configure-mobile-android.ts \
            scripts/patch-play-billing-shared-ui.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-account.js src/app/routes.ts src/product-config.ts src/billing mobile scripts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Patch shared Play billing surfaces [play-shared-patched]"
          git push
