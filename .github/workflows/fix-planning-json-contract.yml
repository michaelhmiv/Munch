name: Fix Pantry Planning JSON Contract

on:
  push:
    branches:
      - refactor/unified-site-ai-model

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-site-ai-model
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Embed the real response schema in the shared planning prompt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/inventory/meal-ideas.ts')
          text = p.read_text()
          old = '''                messages: [\n                    { role: "system", content: systemPrompt() },\n                    {\n                        role: "user",\n                        content: `Plan ${context.request.meal_type} deliberately from this JSON context. Follow the supplied response JSON Schema exactly. Use only source=saved_recipe or generated and readiness=ready_now, likely_ready, or almost_there. estimated_nutrition must contain the five scalar nullable fields in the schema; flavor_system and why_it_fits are arrays.\\n\\n${JSON.stringify(context)}`,\n                    },\n                ],'''
          new = '''                messages: [\n                    {\n                        role: "system",\n                        content: `${systemPrompt()}\\n\\nYour response MUST be one JSON object matching this schema exactly. The only top-level keys are candidates and planning_notes; do not rename, wrap, or replace them.\\n${JSON.stringify(pantryMealIdeasResponseJsonSchema)}`,\n                    },\n                    {\n                        role: "user",\n                        content: `Plan ${context.request.meal_type} deliberately from this JSON context. Use only source=saved_recipe or generated and readiness=ready_now, likely_ready, or almost_there. estimated_nutrition must contain the five scalar nullable fields in the schema; flavor_system and why_it_fits are arrays.\\n\\n${JSON.stringify(context)}`,\n                    },\n                ],'''
          if old not in text:
              raise SystemExit('expected planning prompt marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          bunx prettier --write src/inventory/meal-ideas.ts
          bun test src/inventory/meal-ideas.test.ts
          bun run typecheck
      - name: Commit verified prompt fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inventory/meal-ideas.ts
          git commit -m "fix: enforce shared Pantry planning JSON contract"
          git push origin HEAD:refactor/unified-site-ai-model
