name: Pantry format fix

on:
    push:
        branches:
            - feat/pantry-inventory-reconciliation

permissions:
    contents: write

jobs:
    format:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: feat/pantry-inventory-reconciliation
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Format Pantry vision files
              run: bunx prettier --write scripts/openrouter-pantry-live-smoke.ts src/inventory/vision.ts
            - name: Commit formatting
              run: |
                  if git diff --quiet; then
                    echo "No formatting changes required"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/openrouter-pantry-live-smoke.ts src/inventory/vision.ts
                  git commit -m "style: format Pantry vision validation"
                  git push origin HEAD:feat/pantry-inventory-reconciliation
