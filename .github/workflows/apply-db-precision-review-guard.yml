name: Apply DB precision review guard

on:
    pull_request:
        branches:
            - main

permissions:
    contents: write

jobs:
    apply:
        if: github.head_ref == 'fix/meal-review-recipe-production'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/meal-review-recipe-production
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: python3 scripts/apply-db-precision-review-guard.py
            - run: bunx prettier --write src/meal-drafts/repository.ts
            - name: Commit database precision guard
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/meal-drafts/repository.ts
                  git commit -m "fix: compare review reconciliation at database precision"
                  git push origin HEAD:fix/meal-review-recipe-production
