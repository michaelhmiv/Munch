name: Apply meal review recipe routing

on:
    pull_request:
        branches:
            - main

permissions:
    contents: write

jobs:
    apply:
        if: github.head_ref == 'fix/meal-review-recipe-production'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/meal-review-recipe-production
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: python3 scripts/apply-meal-review-recipe-routing.py
            - run: bunx prettier --write src/mcp-latency.ts src/mcp-latency.test.ts src/mcp-runtime.ts
            - name: Commit current-main-aware routing changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/mcp-latency.ts src/mcp-latency.test.ts src/mcp-runtime.ts
                  git commit -m "fix: expose direct meal-to-recipe and enforce review reconciliation"
                  git push origin HEAD:fix/meal-review-recipe-production
