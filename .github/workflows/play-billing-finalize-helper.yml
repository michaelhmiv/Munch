name: Play billing finalizer

on:
  push:
    branches:
      - mobile/07-play-billing

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[play-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/07-play-billing
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Finalize Play Billing source
        run: bun scripts/finalize-play-billing-branch.ts
      - name: Format final TypeScript and JavaScript
        run: |
          bunx prettier --write \
            public/app-account.js \
            scripts/mobile-shell-smoke.ts \
            src/billing/google-play.test.ts \
            src/billing/subscription-sources.test.ts
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize Play billing source [play-finalized]"
          git push
