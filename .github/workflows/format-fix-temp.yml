name: Temporary format fix

on:
  push:
    branches:
      - fix/production-auth-discovery-meal-visibility

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-auth-discovery-meal-visibility
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format incident patch
        run: |
          bunx prettier --write \
            scripts/account-portal-smoke.ts \
            src/accounts/routes.ts \
            src/auth/auth.ts \
            src/discovery.ts \
            src/discovery.test.ts \
            src/discovery-better-auth.test.ts \
            src/portal/meal-history.ts \
            src/portal/meal-history.test.ts \
            src/no-supabase-runtime.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts src
          git commit -m "Format production incident patch"
          git push origin HEAD:fix/production-auth-discovery-meal-visibility
