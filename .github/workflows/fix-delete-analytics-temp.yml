name: Fix deletion analytics cleanup

on:
  push:
    branches:
      - fix/production-certification-and-account-deletion-smoke

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-certification-and-account-deletion-smoke
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Patch account deletion analytics cleanup
        run: python scripts/patch-delete-analytics-temp.py
      - name: Format patched files
        run: bunx prettier --write src/analytics.ts src/mcp.ts scripts/account-deletion-smoke.ts
      - name: Commit fix and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts .github/workflows/fix-delete-analytics-temp.yml
          git commit -m "Avoid analytics writes after account deletion"
          git push origin HEAD:fix/production-certification-and-account-deletion-smoke
