name: Format email contract

on:
  push:
    branches:
      - fix/better-auth-email-from

permissions:
  contents: write

jobs:
  format:
    if: "${{ !contains(github.event.head_commit.message, 'style: apply exact email contract formatting') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/better-auth-email-from
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply exact formatting
        run: bunx prettier --write src/auth/email.test.ts
      - name: Commit formatted test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth/email.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply exact email contract formatting"
          git push origin HEAD:fix/better-auth-email-from
