name: Patch UI types

on:
    push:
        branches:
            - feat/complete-ui-modernization

permissions:
    contents: write

jobs:
    patch:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: feat/complete-ui-modernization
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1

            - run: bun install --frozen-lockfile

            - name: Apply strict type fixes
              shell: python
              run: |
                  from pathlib import Path

                  repository = Path("src/app/repository.ts")
                  text = repository.read_text()
                  text = text.replace(
                      "const timezone = profile.timezone;",
                      'const timezone = profile?.timezone ?? "UTC";',
                  )
                  text = text.replace(
                      "const profile = await getProfile(userId);\n    const meals = await getMealsInRange(\n        userId,\n        startDate,\n        endDate,\n        profile.timezone,\n    );",
                      'const profile = await getProfile(userId);\n    const timezone = profile?.timezone ?? "UTC";\n    const meals = await getMealsInRange(\n        userId,\n        startDate,\n        endDate,\n        timezone,\n    );',
                  )
                  text = text.replace(
                      "timezone: profile.timezone,",
                      "timezone,",
                  )
                  text = text.replace(
                      "const profile = await getProfile(userId);\n    const meals = await getMealsInRange(\n        userId,\n        startDate,\n        endDate,\n        profile.timezone,\n    );\n    const byDate",
                      'const profile = await getProfile(userId);\n    const timezone = profile?.timezone ?? "UTC";\n    const meals = await getMealsInRange(\n        userId,\n        startDate,\n        endDate,\n        timezone,\n    );\n    const byDate',
                  )
                  text = text.replace(
                      "dateInTz(meal.logged_at, profile.timezone)",
                      "dateInTz(meal.logged_at, timezone)",
                  )
                  repository.write_text(text)

                  routes = Path("src/app/routes.ts")
                  text = routes.read_text()
                  for name in ["id", "tokenFamilyId"]:
                      text = text.replace(
                          f'c.req.param("{name}")',
                          f'c.req.param("{name}")!',
                      )
                  routes.write_text(text)

            - run: bun run format

            - name: Commit fixes
              shell: bash
              run: |
                  set -euo pipefail
                  git restore .github/workflows/patch-ui-types.yml
                  if git diff --quiet; then
                    echo "No type patches required."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/app/repository.ts src/app/routes.ts
                  git commit -m "fix: satisfy strict app route types"
                  git push origin HEAD:feat/complete-ui-modernization
