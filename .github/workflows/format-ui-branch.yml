name: Format UI branch

on:
    push:
        branches:
            - feat/complete-ui-modernization

permissions:
    contents: write

concurrency:
    group: format-ui-modernization
    cancel-in-progress: true

jobs:
    format:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out branch
              uses: actions/checkout@v4
              with:
                  ref: feat/complete-ui-modernization
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format repository
              run: bun run format

            - name: Commit formatting
              shell: bash
              run: |
                  set -euo pipefail
                  git restore .github/workflows/format-ui-branch.yml
                  if git diff --quiet; then
                    echo "No formatting changes required."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "style: format UI modernization"
                  git push origin HEAD:feat/complete-ui-modernization
