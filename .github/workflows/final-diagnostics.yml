name: Final Diagnostics

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  typecheck:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Run bounded typecheck
        run: timeout 240s bun run typecheck

  oauth-smoke:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - name: Run bounded OAuth smoke
        run: timeout 120s bun scripts/oauth-http-smoke.ts
