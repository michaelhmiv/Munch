name: Temporary format candidate certification

on:
    push:
        branches:
            - test/candidate-set-production-cert

permissions:
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: test/candidate-set-production-cert
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: bunx prettier --write scripts/certification/production-mcp-corpus.ts
            - name: Commit format
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/certification/production-mcp-corpus.ts
                  git diff --cached --quiet || git commit -m "style: format candidate-set production certification"
                  git push origin HEAD:test/candidate-set-production-cert
