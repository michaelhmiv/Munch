name: Apply and format widget overhaul

on:
  push:
    branches:
      - feat/chatgpt-native-widget-overhaul

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-native-widget-overhaul
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply, format, and commit widget overhaul
        run: |
          cat .widget-overhaul.part-* > .widget-overhaul.tar.gz
          tar -xzf .widget-overhaul.tar.gz
          rm .widget-overhaul.part-* .widget-overhaul.tar.gz .github/workflows/format-widget-overhaul.yml
          bun run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: overhaul ChatGPT widget experience"
          git push origin HEAD:feat/chatgpt-native-widget-overhaul
