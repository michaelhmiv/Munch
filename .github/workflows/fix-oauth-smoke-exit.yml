# One-use workflow; removed after it commits the source fix.
name: Fix OAuth Smoke Exit

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-oauth-smoke-exit
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/munch-frontend-overhaul
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Make OAuth smoke shutdown deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/oauth-http-smoke.ts')
          text = path.read_text()
          text = text.replace(
              'const heartbeat = setInterval(() => stage("still running"), 30_000);\n\ntry {',
              'const heartbeat = setInterval(() => stage("still running"), 30_000);\nlet succeeded = false;\n\ntry {',
          )
          text = text.replace(
              '    stage("passed");\n} finally {',
              '    stage("passed");\n    succeeded = true;\n} catch (error) {\n    console.error(error);\n} finally {',
          )
          text = text.replace(
              '    await closePlatformDatabase();\n}',
              '    await Promise.race([closePlatformDatabase(), Bun.sleep(1000)]);\n    process.exit(succeeded ? 0 : 1);\n}',
          )
          path.write_text(text)
          PY
          bunx prettier --write scripts/oauth-http-smoke.ts

      - name: Commit fix
        run: |
          git checkout -- .github/workflows/fix-oauth-smoke-exit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/oauth-http-smoke.ts
          git commit -m "fix: terminate OAuth smoke after database cleanup"
          git push origin HEAD:feat/munch-frontend-overhaul
