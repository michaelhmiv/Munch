name: Recipe Fetch Fallback Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Install experiment-only browser dependencies
        run: npm install --no-save crawlee playwright recipe-scrapers cheerio zod
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run native vs Crawlee benchmark
        run: bun scripts/experiments/recipe-fetch-fallback-benchmark.ts native,crawlee | tee recipe-fetch-node.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-fetch-node-${{ github.sha }}
          path: recipe-fetch-node.jsonl

  scrapling-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Scrapling
        run: |
          python -m pip install --upgrade pip
          pip install scrapling
          scrapling install
      - name: Run Scrapling benchmark
        run: python scripts/experiments/recipe_fetch_scrapling.py | tee recipe-fetch-scrapling.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-fetch-scrapling-${{ github.sha }}
          path: recipe-fetch-scrapling.jsonl
