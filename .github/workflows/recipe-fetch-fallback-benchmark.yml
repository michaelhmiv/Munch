name: Recipe Fetch Fallback Benchmark

on:
    push:
        branches:
            - experiment/recipe-fetch-fallbacks
    workflow_dispatch:

permissions:
    contents: read

jobs:
    native-crawlee:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Install experiment-only JS dependencies
              run: npm install --no-save --package-lock=false crawlee playwright recipe-scrapers cheerio zod
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: Run native and Crawlee benchmark
              run: bun scripts/experiments/recipe-fetch-fallback-benchmark.ts native,crawlee | tee recipe-fetch-native-crawlee.jsonl
            - uses: actions/upload-artifact@v4
              with:
                  name: recipe-fetch-native-crawlee-${{ github.sha }}
                  path: recipe-fetch-native-crawlee.jsonl

    scrapling:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install Scrapling with browser fetchers
              run: |
                  python -m pip install --upgrade pip
                  pip install "scrapling[fetchers]"
                  scrapling install
            - name: Run Scrapling benchmark
              run: python scripts/experiments/recipe_fetch_scrapling.py | tee recipe-fetch-scrapling.jsonl
            - uses: actions/upload-artifact@v4
              with:
                  name: recipe-fetch-scrapling-${{ github.sha }}
                  path: recipe-fetch-scrapling.jsonl
