name: Recipe Fetch Fallback Benchmark

on:
    push:
        branches:
            - experiment/recipe-fetch-fallbacks
    workflow_dispatch:

permissions:
    contents: read

jobs:
    recipe-core-regressions:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Run parser, corpus, host-AI, and network regressions
              run: bun test src/recipe-import.test.ts src/recipe-import-corpus.test.ts src/host-ai-boundary.test.ts src/net.test.ts

    bun-native-transport-spike:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Install node-wreq ephemerally
              run: bun add --no-save node-wreq@3.1.0
            - name: Exercise Bun native TLS transport
              shell: bash
              run: |
                  set -o pipefail
                  bun scripts/experiments/recipe-bun-transport-spike.ts | tee recipe-bun-transport-spike.jsonl
            - name: Sweep browser profiles
              shell: bash
              run: |
                  set -o pipefail
                  bun scripts/experiments/recipe-bun-profile-sweep.ts | tee recipe-bun-profile-sweep.jsonl
            - name: Repeat selected fallback sequence
              shell: bash
              run: |
                  set -o pipefail
                  bun scripts/experiments/recipe-bun-fallback-stability.ts | tee recipe-bun-fallback-stability.jsonl
            - uses: actions/upload-artifact@v4
              with:
                  name: recipe-bun-transport-spike-${{ github.sha }}
                  path: |
                      recipe-bun-transport-spike.jsonl
                      recipe-bun-profile-sweep.jsonl
                      recipe-bun-fallback-stability.jsonl

    zod3-parser-patch-spike:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Confirm Zod 3 transitional package exposes v4 API
              run: bun -e 'import { z } from "zod/v4"; if (typeof z.httpUrl !== "function") process.exit(1); console.log("zod/v4 httpUrl available")'
            - name: Install parser fallback without changing root Zod
              run: bun add --no-save recipe-scrapers@1.10.0 cheerio@1.1.2
            - name: Patch parser runtime to use bundled zod/v4 entrypoint
              run: |
                  sed -i 's/from "zod"/from "zod\/v4"/g' node_modules/recipe-scrapers/dist/index.mjs
                  grep -q 'from "zod/v4"' node_modules/recipe-scrapers/dist/index.mjs
            - name: Exercise Love and Lemons parser fallback on root Zod 3
              shell: bash
              run: |
                  set -o pipefail
                  bun scripts/experiments/recipe-zod4-parser-spike.ts | tee recipe-zod3-patched-parser-spike.jsonl
            - uses: actions/upload-artifact@v4
              with:
                  name: recipe-zod3-patched-parser-spike-${{ github.sha }}
                  path: recipe-zod3-patched-parser-spike.jsonl

    curl-cffi-safe-spike:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install validated lightweight transport
              run: pip install "httpx==0.28.1" "httpx-curl-cffi==0.1.5"
            - name: Exercise verified TLS with manual redirects
              shell: bash
              run: |
                  set -o pipefail
                  python scripts/experiments/recipe-curl-cffi-safe-spike.py | tee recipe-curl-cffi-safe-spike.jsonl
            - uses: actions/upload-artifact@v4
              with:
                  name: recipe-curl-cffi-safe-spike-${{ github.sha }}
                  path: recipe-curl-cffi-safe-spike.jsonl

    zod4-parser-spike:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Temporarily test Munch on Zod 4 with parser fallback
              run: bun add --no-save zod@4.4.3 recipe-scrapers@1.10.0 cheerio@1.1.2
            - name: Exercise Love and Lemons parser fallback
              shell: bash
              run: |
                  set -o pipefail
                  bun scripts/experiments/recipe-zod4-parser-spike.ts | tee recipe-zod4-parser-spike.jsonl
            - name: Typecheck Munch against Zod 4
              continue-on-error: true
              run: bun run typecheck
            - name: Run focused Munch tests against Zod 4
              continue-on-error: true
              run: bun test src/recipe-import.test.ts src/host-ai-boundary.test.ts src/net.test.ts
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: recipe-zod4-parser-spike-${{ github.sha }}
                  path: recipe-zod4-parser-spike.jsonl
                  if-no-files-found: ignore

    mealie-comparison:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install Mealie-equivalent parser and HTTP transport
              run: pip install "httpx==0.28.1" "httpx-curl-cffi==0.1.5" "recipe-scrapers==15.12.0"
            - name: Compare Munch with Mealie transport and parser
              shell: bash
              run: |
                  set -o pipefail
                  python scripts/experiments/recipe_mealie_diagnostic.py | tee recipe-mealie-diagnostic.jsonl
            - uses: actions/upload-artifact@v4
              with:
                  name: recipe-mealie-diagnostic-${{ github.sha }}
                  path: recipe-mealie-diagnostic.jsonl

    crawlee-stability:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: experiment/recipe-fetch-fallbacks
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Install experiment-only Crawlee dependencies
              run: npm install --no-save --package-lock=false --legacy-peer-deps crawlee playwright
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - name: Repeat native-blocked publishers five times
              shell: bash
              run: |
                  set -o pipefail
                  bun scripts/experiments/recipe-fetch-crawlee-stability.ts | tee recipe-fetch-crawlee-stability.jsonl
            - uses: actions/upload-artifact@v4
              with:
                  name: recipe-fetch-crawlee-stability-${{ github.sha }}
                  path: recipe-fetch-crawlee-stability.jsonl
