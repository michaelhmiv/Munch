name: Pantry reconciliation fixup

on:
  push:
    branches:
      - feat/pantry-inventory-reconciliation

permissions:
  contents: write

concurrency:
  group: pantry-reconcile-fixup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_test
      MUNCH_APP_BASE_URL: https://munch.example
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESEND_API_KEY: re_test_schema
      MUNCH_EMAIL_FROM: Munch <support@munch.example>
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-inventory-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply reconciliation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path('src/inventory/repository.ts')
          text = repo.read_text()
          old_json = '${JSON.stringify(input.metadata ?? {})}::jsonb'
          if old_json not in text:
              raise SystemExit('event metadata binding marker not found')
          text = text.replace(old_json, "jsonb_build_object()", 1)

          pattern = re.compile(r'''                let grocery: Record<string, unknown> \| undefined;\n.*?                    action = "inventory_added";\n                }\n''', re.S)
          replacement = '''                let grocery: Record<string, unknown> | undefined;
                const purchaseTimestamp =
                    input.purchasedAt ?? new Date().toISOString();
                if (groceryListId) {
                    const providerId = line.providerFoodId ?? null;
                    const provider = line.foodProvider ?? null;
                    const groceryRows = await tx<
                        Array<Record<string, unknown>>
                    >`
                        select id, version, quantity, unit, purchased_at
                        from munch.grocery_items
                        where grocery_list_id = ${groceryListId}
                          and deleted_at is null
                          and (
                            purchased_at is null
                            or purchased_at >= ${purchaseTimestamp}::timestamptz - interval '7 days'
                          )
                          and (
                            (${providerId}::text is not null and provider_food_id = ${providerId} and food_provider is not distinct from ${provider})
                            or normalized_name = ${normalized}
                          )
                        order by
                            case when purchased_at is null then 0 else 1 end,
                            case when provider_food_id = ${providerId} then 0 else 1 end,
                            purchased_at desc nulls first,
                            created_at desc
                        limit 1 for update
                    `;
                    grocery = groceryRows[0];
                }
                if (grocery) {
                    groceryItemId = String(grocery.id);
                    const groceryUnit = canonicalInventoryUnit(
                        grocery.unit == null ? null : String(grocery.unit),
                    );
                    const receiptUnit = canonicalInventoryUnit(
                        line.unit ?? groceryUnit,
                    );
                    const alreadyPurchased = grocery.purchased_at != null;

                    if (
                        alreadyPurchased &&
                        groceryUnit &&
                        receiptUnit &&
                        groceryUnit !== receiptUnit
                    ) {
                        action = "needs_review";
                        needsReview = true;
                    } else if (!alreadyPurchased) {
                        const purchased = await tx<Array<{ id: string }>>`
                            update munch.grocery_items
                            set quantity = case
                                    when ${line.quantity ?? null}::numeric is null then quantity
                                    else ${line.quantity ?? null}
                                end,
                                unit = coalesce(${receiptUnit}, unit),
                                purchased_at = ${purchaseTimestamp},
                                purchased_by_user_id = ${input.userId},
                                updated_by_user_id = ${input.userId}, updated_at = now(),
                                version = version + 1
                            where id = ${String(grocery.id)} and version = ${Number(grocery.version)}
                            returning id
                        `;
                        if (!purchased[0])
                            throw new Error(
                                "Grocery item changed during purchase reconciliation",
                            );
                        const matchedInventory = await findInventoryItem(
                            tx,
                            spaceId,
                            {
                                name,
                                unit: receiptUnit ?? undefined,
                                foodProvider: line.foodProvider,
                                providerFoodId: line.providerFoodId,
                                location: line.location,
                            },
                        );
                        inventoryItemId = matchedInventory
                            ? String(matchedInventory.id)
                            : null;
                        action = "grocery_matched";
                    } else {
                        const acquisitionEvents = await tx<
                            Array<{
                                inventory_item_id: string;
                                delta_quantity: string | number | null;
                            }>
                        >`
                            select inventory_item_id, delta_quantity
                            from munch.inventory_events
                            where inventory_space_id = ${spaceId}
                              and source_type = 'grocery_purchase'
                              and source_entity_id = ${String(grocery.id)}
                            order by created_at desc
                            limit 1
                        `;
                        const acquisition = acquisitionEvents[0];
                        if (!acquisition) {
                            action = "needs_review";
                            needsReview = true;
                        } else {
                            let inventoryRow = await readItemForUpdate(
                                tx,
                                spaceId,
                                acquisition.inventory_item_id,
                            );
                            const actualQuantity = validateQuantity(
                                line.quantity,
                            );
                            if (actualQuantity != null) {
                                const originalQuantity =
                                    grocery.quantity == null
                                        ? acquisition.delta_quantity == null
                                            ? null
                                            : Number(acquisition.delta_quantity)
                                        : Number(grocery.quantity);
                                const currentQuantity =
                                    inventoryRow.quantity == null
                                        ? null
                                        : Number(inventoryRow.quantity);
                                const correctionDelta =
                                    originalQuantity == null
                                        ? actualQuantity
                                        : actualQuantity - originalQuantity;
                                const nextQuantity =
                                    currentQuantity == null
                                        ? actualQuantity
                                        : Math.max(
                                              0,
                                              currentQuantity + correctionDelta,
                                          );
                                if (
                                    originalQuantity == null ||
                                    Math.abs(correctionDelta) > 0.0005
                                ) {
                                    const corrected = await tx<
                                        Array<Record<string, unknown>>
                                    >`
                                        update munch.inventory_items
                                        set quantity = ${nextQuantity},
                                            unit = coalesce(${receiptUnit}, unit),
                                            quantity_mode = case
                                                when quantity is null then 'approximate'
                                                else quantity_mode
                                            end,
                                            stock_state = case
                                                when ${nextQuantity}::numeric <= 0 then 'depleted'
                                                else 'available'
                                            end,
                                            updated_by_user_id = ${input.userId},
                                            updated_at = now(), version = version + 1
                                        where id = ${acquisition.inventory_item_id}
                                        returning *
                                    `;
                                    if (!corrected[0])
                                        throw new Error(
                                            "Purchased Grocery Pantry correction failed",
                                        );
                                    inventoryRow = corrected[0];
                                    const correctedItem = serializeItem(
                                        inventoryRow,
                                    );
                                    await insertEvent(tx, {
                                        spaceId,
                                        itemId: correctedItem.id,
                                        eventType: "correct",
                                        deltaQuantity: correctionDelta,
                                        quantityAfter: correctedItem.quantity,
                                        unit: correctedItem.unit,
                                        sourceType: "receipt",
                                        sourceEntityId: batchId,
                                        sourceKey: `receipt:${batchId}:${index}:grocery-correction`,
                                        confidence: line.confidence,
                                        userId: input.userId,
                                    });
                                }
                                await tx`
                                    update munch.grocery_items
                                    set quantity = ${actualQuantity},
                                        unit = coalesce(${receiptUnit}, unit),
                                        updated_by_user_id = ${input.userId},
                                        updated_at = now(), version = version + 1
                                    where id = ${String(grocery.id)}
                                `;
                            }
                            inventoryItemId = String(inventoryRow.id);
                            action = "grocery_matched";
                        }
                    }
                } else {
                    const acquired = await acquireInTransaction(tx, {
                        userId: input.userId,
                        spaceId,
                        sourceType: "receipt",
                        sourceEntityId: batchId,
                        sourceKey: `receipt:${batchId}:${index}`,
                        name,
                        quantity: line.quantity,
                        unit: line.unit,
                        location: line.location,
                        foodProvider: line.foodProvider,
                        providerFoodId: line.providerFoodId,
                        confidence: line.confidence,
                    });
                    inventoryItemId = acquired.item.id;
                    action = "inventory_added";
                }
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'purchase block replacements: {count}')
          repo.write_text(text)

          smoke = Path('scripts/pantry-platform-smoke.ts')
          st = smoke.read_text()
          marker = '''if (replenishedSugar?.quantity !== 4.5) {
    throw new Error(
        `Grocery checkoff did not replenish Pantry exactly once (got ${replenishedSugar?.quantity})`,
    );
}
'''
          insertion = marker + '''
// A receipt uploaded after Grocery checkoff must reconcile the already-created
// acquisition rather than add a second purchase. The receipt is authoritative
// for the actual amount bought.
const checkedThenReceipted = await reconcilePurchase({
    userId: owner.userId,
    scope: personalScope,
    idempotencyKey: "pantry-smoke-checked-then-receipt",
    sourceLabel: "Synthetic Market receipt after checkoff",
    lines: [
        {
            rawLabel: "SUGAR 5 LB",
            name: "Granulated sugar",
            quantity: 5,
            unit: "lb",
            confidence: 0.99,
            isFood: true,
            location: "pantry",
        },
    ],
});
if (
    checkedThenReceipted.summary.groceryMatched !== 1 ||
    checkedThenReceipted.summary.inventoryAdded !== 0
) {
    throw new Error(
        `Checked Grocery receipt was not reconciled in place: ${JSON.stringify(checkedThenReceipted.summary)}`,
    );
}
pantry = await getPantry({ userId: owner.userId, scope: personalScope });
const correctedSugar = pantry.items.find(
    (item) => item.normalized_name === "granulated sugar",
);
if (correctedSugar?.quantity !== 5.5) {
    throw new Error(
        `Receipt correction double-counted or missed the checked Grocery acquisition (got ${correctedSugar?.quantity})`,
    );
}
'''
          if marker not in st:
              raise SystemExit('sugar smoke marker not found')
          st = st.replace(marker, insertion, 1)
          st = st.replace('''            quantity: 2,
            unit: "count",
            confidence: 0.99,
''', '''            quantity: 3,
            unit: "count",
            confidence: 0.99,
''', 1)
          avocado_marker = '''if (!avocadoGrocery?.purchased_at) {
    throw new Error("Receipt did not mark matching Grocery item purchased");
}
'''
          avocado_insert = avocado_marker + '''if (avocadoGrocery.quantity !== 3) {
    throw new Error(
        `Receipt did not replace requested Grocery quantity with actual quantity (got ${avocadoGrocery.quantity})`,
    );
}
'''
          if avocado_marker not in st:
              raise SystemExit('avocado smoke marker not found')
          st = st.replace(avocado_marker, avocado_insert, 1)
          smoke.write_text(st)
          PY
      - name: Format changed files
        run: bunx prettier --write src/inventory/repository.ts scripts/pantry-platform-smoke.ts .github/workflows/pantry-reconcile-fixup.yml
      - name: Migrate schema
        run: bun run db:migrate
      - name: Exercise Pantry reconciliation
        run: bun scripts/pantry-platform-smoke.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Commit hardened reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inventory/repository.ts scripts/pantry-platform-smoke.ts
          git commit -m "fix: reconcile checked groceries with receipt quantities"
          git push origin HEAD:feat/pantry-inventory-reconciliation
