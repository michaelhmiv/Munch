name: Railway-only cutover

on:
  push:
    branches:
      - fix/remove-supabase-runtime

permissions:
  contents: write

concurrency:
  group: railway-only-cutover
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-supabase-runtime
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Apply cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/railway-only-cutover.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/index.ts")
          text = path.read_text()
          broken = '    app.route("/", createPlatformOAuthRouter());\n}}\n'
          fixed = '    app.route("/", createPlatformOAuthRouter());\n}\n'
          if broken not in text:
              raise SystemExit("generated OAuth block did not match expected form")
          path.write_text(text.replace(broken, fixed, 1))
          PY
          rm -f .github/workflows/fix-cutover-script.yml .fix-cutover-trigger
          bun install
          bun run format
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: make Railway PostgreSQL the sole data backend'
          git push origin HEAD:fix/remove-supabase-runtime
      - name: Verify generated cutover
        shell: bash
        run: |
          set -euo pipefail
          bun run format:check
          bun run typecheck
          bun test
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules 'SUPABASE_|getSupabase|@supabase/supabase-js|inherited-supabase' src scripts package.json bun.lock .env.example; then
            echo 'Residual executable Supabase reference found' >&2
            exit 1
          fi
