name: Format PR 66 smoke

on:
  push:
    branches:
      - feat/nutrition-provenance-qol

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nutrition-provenance-qol
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/structured-meal-smoke.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/structured-meal-smoke.ts
          git commit -m "style: format structured meal smoke"
          git push origin HEAD:feat/nutrition-provenance-qol
