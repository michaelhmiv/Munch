name: Apply live trial fix on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Apply focused changes
        run: python3 .github/scripts/apply-live-trial-fix.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and verify
        run: |
          set -euo pipefail
          bun run format
          bun run format:check
          bun run typecheck
          bun test
          bun run brand:check

      - name: Commit changes and remove one-use assets
        run: |
          set -euo pipefail
          rm .github/workflows/apply-live-trial-fix.yml
          rm .github/workflows/apply-live-trial-fix-pr.yml
          rm .github/scripts/apply-live-trial-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce 30-day first-subscription trial"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
