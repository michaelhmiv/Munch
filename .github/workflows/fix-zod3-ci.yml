name: Fix Zod 3 Compatibility

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-zod3-ci
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/munch-frontend-overhaul
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Apply source compatibility fixes
        run: python scripts/fix-zod3-ci.py

      - name: Pin compatible Zod release
        run: bun add zod@3.25.76

      - name: Format changed files
        run: bunx prettier --write package.json src/billing/stripe-client.test.ts src/oauth-platform/repository.ts src/portal/routes.ts

      - name: Verify public brand gate
        run: bun run brand:check

      - name: Commit compatibility fixes
        run: |
          git checkout -- .github/workflows/fix-zod3-ci.yml
          rm scripts/fix-zod3-ci.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore MCP SDK Zod compatibility"
          git push origin HEAD:feat/munch-frontend-overhaul
