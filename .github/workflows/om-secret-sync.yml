name: om-secret-sync

# One-time, owner-directed transfer of the six iOS signing secrets to the
# OpenMahjong repo. Each value is encrypted on the runner with a one-time
# RSA-4096 key (hybrid: random per-value key, AES-256-CBC/PBKDF2) and leaves
# only as ciphertext in a short-lived artifact that is deleted immediately
# after pickup. No value is ever printed; workflow_dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      V_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      V_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      V_ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      V_IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      V_IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
      V_IOS_DIST_CERT_ID: ${{ secrets.IOS_DIST_CERT_ID }}
    steps:
      - name: Encrypt each secret for one-time pickup
        run: |
          set -euo pipefail
          mkdir -p out
          cat > pub.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEApsNPepaKUk5Il+iD5xCl
          slG94/96pe6cGK9EahtpFNZ3dfcjjpvO7FC050Fbgc01Dh9VxNWaxBoDXfcGWBmt
          a4E5ZguQOwJeKJDXphudszKgrIDKIhLjJF6U9eHYCyErxucAn/6YKAUbqZJdYPiz
          88Zc63vyLIZp9z37T6RnIOQhoV7PKWYewBdOYN650kWNGmy6SRbvr6DxaHnusKQZ
          3AIqv4JJsSDwWUmU6aWZ6o5mx5KvZaC2iWaekR42hdXKnbBy8u0CmUV17TetrD/r
          HxqVBn4PJBFa8hBmYMSuwN9NfckdBofXrduYR2iFAfdzUJQ/Poui/0cQF5/tLqMN
          AacnlDWwnj48EP49padyBBgtD3vLnmociyeFDBP644BVRTeHwSM19nRePrhDyVSI
          dxwQqqazxtVagSjhPxbTAIG4t6kIlz4F3KV8fjGUN9LSbQKQnf64ZelgajDkI9zq
          VJAcELg568UMgKRmpvfX92X7CFXj3gaZ20u7niSPoY3IXT0KHrgkwbGoLnz86nFN
          0ECxIe/Deg/rF6T5OLPKkOcDCa76tHb0JpS8TVoDl+V7yu0OMJha+3FcdNc3pA+/
          VQvncBU8AHdEbhY+SC2XSDEXXsc2MR0E3kjDzzaEFdfqIzixDlAcTnLI2WnSMZ3Y
          SC96GHzdzv4kwrvqw2jwuV8CAwEAAQ==
          -----END PUBLIC KEY-----
          PUBKEY
          encrypt_one() {
            name="$1"; varname="V_$1"
            openssl rand -base64 32 > "k.txt"
            openssl pkeyutl -encrypt -pubin -inkey pub.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
              -in k.txt -out "out/$name.key"
            printf '%s' "${!varname}" | openssl enc -aes-256-cbc -salt \
              -pbkdf2 -iter 200000 -pass file:k.txt -out "out/$name.enc"
            rm -f k.txt
            echo "$name: encrypted ($(stat -c%s "out/$name.enc") bytes ciphertext)"
          }
          encrypt_one ASC_KEY_ID
          encrypt_one ASC_ISSUER_ID
          encrypt_one ASC_PRIVATE_KEY
          encrypt_one IOS_DIST_CERT_P12_BASE64
          encrypt_one IOS_DIST_CERT_P12_PASSWORD
          encrypt_one IOS_DIST_CERT_ID
      - name: Upload ciphertext bundle
        uses: actions/upload-artifact@v4
        with:
          name: om-secret-sync
          path: out/
          retention-days: 1
