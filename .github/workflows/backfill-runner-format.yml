name: Backfill runner formatter

on:
  push:
    branches:
      - ops/recipe-nutrition-backfill

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/recipe-nutrition-backfill
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/backfill-recipe-nutrition.ts
      - name: Commit formatter result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/backfill-recipe-nutrition.ts
          git rm .github/workflows/backfill-runner-format.yml
          git commit -m "Format recipe nutrition backfill runner"
          git push origin HEAD:ops/recipe-nutrition-backfill