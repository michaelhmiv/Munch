name: Format diagnostic

on:
    pull_request:

permissions:
    contents: read

jobs:
    prettier-diff:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - name: Print exact Prettier diff
              run: |
                  bunx prettier --write scripts/certification/production.ts
                  git diff -- scripts/certification/production.ts
