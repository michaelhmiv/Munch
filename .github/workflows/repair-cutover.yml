name: Repair cutover trigger

on:
  push:
    branches:
      - fix/remove-supabase-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-supabase-runtime
          fetch-depth: 0
      - name: Repair and retrigger
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/head_commit.message/d" .github/workflows/railway-only-cutover.yml
          rm .github/workflows/repair-cutover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: repair Railway-only cutover workflow'
          git push origin HEAD:fix/remove-supabase-runtime
