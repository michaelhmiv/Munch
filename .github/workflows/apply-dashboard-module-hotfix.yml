name: Apply dashboard module hotfix

on:
  push:
    branches:
      - hotfix/dashboard-module-route
    paths:
      - scripts/apply-dashboard-module-hotfix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/dashboard-module-route
      - name: Apply hotfix
        run: python scripts/apply-dashboard-module-hotfix.py
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bunx prettier --write src/app/routes.ts scripts/ui-surface-smoke.ts
          git add src/app/routes.ts scripts/ui-surface-smoke.ts
          if git diff --cached --quiet; then
            echo "Hotfix produced no changes" >&2
            exit 1
          fi
          git commit -m "fix: serve dashboard browser modules"
          git push origin HEAD:hotfix/dashboard-module-route
