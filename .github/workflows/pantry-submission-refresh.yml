name: Pantry submission refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Regenerate and verify OpenAI submission package
        run: |
          bun run submission:generate
          bun run submission:check
      - name: Commit generated submission artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-app-submission.json docs/openai-submission/tool-inventory.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Pantry Intelligence submission artifacts"
            git push
          fi
