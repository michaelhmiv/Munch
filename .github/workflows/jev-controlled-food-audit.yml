name: Jev Controlled Food Audit

on:
  push:
    branches:
      - "jev-audit/**"
    paths:
      - "scripts/jev-controlled-food-audit.ts"
      - ".github/workflows/jev-controlled-food-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-controlled-food-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JEV_MODEL: jev-1.13.0
      QWEN_MODEL: qwen/qwen3.7-flash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify benchmark secrets
        shell: bash
        run: |
          test -n "$TYPESAFE_API_KEY" || { echo "TYPESAFE_API_KEY missing" >&2; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "OPENROUTER_API_KEY missing" >&2; exit 1; }
      - name: Typecheck
        run: bun run typecheck
      - name: Full test suite
        run: bun test
      - name: Run controlled Jev vs Qwen benchmark
        run: bun scripts/jev-controlled-food-audit.ts
      - name: Upload controlled benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-controlled-food-audit
          path: artifacts/
          if-no-files-found: warn
