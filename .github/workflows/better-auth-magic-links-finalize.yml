name: Better Auth Magic Links Finalize

on:
  push:
    branches:
      - feat/better-auth-magic-links

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/better-auth-magic-links
          fetch-depth: 0

      - name: Remove one-use workflow before validation
        run: rm .github/workflows/better-auth-magic-links-finalize.yml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Format changed source
        run: >-
          bunx prettier --write
          src/auth/auth.ts
          src/auth/connect-routes.ts
          src/auth/magic-link-url.ts
          src/auth/magic-link-url.test.ts
          src/auth/routes.ts
          src/accounts/routes.ts
          src/accounts/session.ts

      - name: Validate magic-link cutover
        run: |
          bun run format:check
          bun run typecheck
          bun test

      - name: Commit validated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize Better Auth magic links"
          git push origin HEAD:feat/better-auth-magic-links
