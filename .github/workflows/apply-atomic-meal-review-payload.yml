name: Apply atomic meal review payload

on:
  workflow_dispatch:
  push:
    branches:
      - feat/atomic-meal-review-latency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Reconstruct implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/ci.yml /tmp/original-ci.yml
          cat .codegen/part-* | tr -d '\n' | base64 -d > /tmp/munch-payload.tar.gz
          tar -xzf /tmp/munch-payload.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('src/meal-review-tools.ts')
          text = path.read_text()
          text = text.replace(
              'args.answers?.map((answer) => ({',
              'args.answers?.map((answer: { question_id?: string; question_key?: string; answer: string }) => ({',
          )
          path.write_text(text)
          PY
          cp /tmp/original-ci.yml .github/workflows/ci.yml
          rm -rf .codegen

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format generated sources
        run: >-
          bunx prettier --write
          src/meal-drafts/atomic.ts
          src/meal-review-tools.ts
          src/mcp-runtime.ts
          src/widgets.ts
          src/meal-review-policy.test.ts
          scripts/atomic-meal-review-smoke.ts
          scripts/meal-review-benchmark.ts
          public/widgets/src/templates/meal-review.html

      - name: Run generated-source quality checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bun run typecheck
          bun test src/meal-review-policy.test.ts src/widgets.test.ts

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(meals): add atomic review workflow and latency benchmark"
          git push
