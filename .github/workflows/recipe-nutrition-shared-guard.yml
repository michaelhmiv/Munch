name: Recipe nutrition shared guard

on:
  push:
    branches:
      - fix/recipe-save-auto-nutrition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recipe-save-auto-nutrition
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/recipe-nutrition-shared-guard.py
      - run: bunx prettier --write src/recipe-nutrition-resolution.ts src/planning/repository.ts
      - run: bun run typecheck
      - run: bun test src/recipe-nutrition-resolution.test.ts
      - run: bun test
      - name: Commit tested shared guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recipe-nutrition-resolution.ts src/planning/repository.ts
          git rm .github/workflows/recipe-nutrition-shared-guard.yml .github/scripts/recipe-nutrition-shared-guard.py
          git commit -m "Enforce recipe nutrition across write surfaces [recipe-nutrition-shared]"
          git push origin HEAD:fix/recipe-save-auto-nutrition
