name: Recipe nutrition shared guard

on:
  push:
    branches:
      - fix/recipe-save-auto-nutrition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recipe-save-auto-nutrition
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Move nutrition invariant into shared planning writes
        run: |
          python - <<'PY'
          from pathlib import Path

          resolver = Path('src/recipe-nutrition-resolution.ts')
          text = resolver.read_text()
          anchor = '\nfunction enhancedDescription(description: string): string {'
          if anchor not in text:
              raise SystemExit('resolver insertion anchor not found')
          helper = r'''

export interface PlanningRecipeNutritionIngredientPayload {
    name: string;
    quantity?: number;
    unit?: string;
    preparation?: string;
    optional?: boolean;
    gramWeight?: number;
    nutrients?: RecipeNutrientFacts;
    provider?: string;
    providerFoodId?: string;
    sourceType: string;
    sourceUrl?: string;
    confidence?: number;
    sourceSnapshot?: Record<string, unknown>;
}

export interface PlanningRecipeNutritionPayload {
    name: string;
    servings: number;
    ingredients: PlanningRecipeNutritionIngredientPayload[];
}

export async function resolvePlanningRecipeNutrition<
    T extends PlanningRecipeNutritionPayload,
>(
    recipe: T,
    dependencies: RecipeNutritionResolutionDependencies = {},
): Promise<T> {
    const resolution = await resolveRecipeNutrition(
        {
            name: recipe.name,
            servings: recipe.servings,
            ingredients: recipe.ingredients.map((ingredient) => ({
                name: ingredient.name,
                quantity: ingredient.quantity,
                unit: ingredient.unit,
                preparation: ingredient.preparation,
                optional: ingredient.optional,
                gram_weight: ingredient.gramWeight,
                nutrients: ingredient.nutrients,
                provider: ingredient.provider,
                provider_food_id: ingredient.providerFoodId,
                source_type: ingredient.sourceType,
                source_url: ingredient.sourceUrl,
                confidence: ingredient.confidence,
                source_snapshot: ingredient.sourceSnapshot,
            })),
        },
        dependencies,
    );
    return {
        ...recipe,
        ingredients: resolution.recipe.ingredients.map((ingredient, position) => ({
            ...recipe.ingredients[position]!,
            name: ingredient.name,
            quantity: ingredient.quantity,
            unit: ingredient.unit,
            preparation: ingredient.preparation,
            optional: ingredient.optional,
            gramWeight: ingredient.gram_weight,
            nutrients: ingredient.nutrients,
            provider: ingredient.provider,
            providerFoodId: ingredient.provider_food_id,
            sourceType: ingredient.source_type,
            sourceUrl: ingredient.source_url,
            confidence: ingredient.confidence,
            sourceSnapshot: ingredient.source_snapshot,
        })),
    } as T;
}
'''
          text = text.replace(anchor, helper + anchor, 1)
          resolver.write_text(text)

          repository = Path('src/planning/repository.ts')
          repo = repository.read_text()
          import_anchor = 'import type { DatabaseTransaction } from "../platform/database.js";\n'
          if import_anchor not in repo:
              raise SystemExit('repository import anchor not found')
          repo = repo.replace(
              import_anchor,
              import_anchor + 'import { resolvePlanningRecipeNutrition } from "../recipe-nutrition-resolution.js";\n',
              1,
          )

          old_save = '''export async function saveRecipe(input: {
    userId: string;
    scope: PlanningScope;
    recipe: RecipeInput;
    idempotencyKey?: string;
}): Promise<SavedRecipeResult> {
    return withUserDatabase(input.userId, (tx) =>
        saveRecipeInTransaction(tx, input),
    );
}'''
          new_save = '''export async function saveRecipe(input: {
    userId: string;
    scope: PlanningScope;
    recipe: RecipeInput;
    idempotencyKey?: string;
}): Promise<SavedRecipeResult> {
    const resolvedRecipe = await resolvePlanningRecipeNutrition(input.recipe);
    validateRecipe(resolvedRecipe);
    return withUserDatabase(input.userId, (tx) =>
        saveRecipeInTransaction(tx, { ...input, recipe: resolvedRecipe }),
    );
}'''
          if old_save not in repo:
              raise SystemExit('saveRecipe body anchor not found')
          repo = repo.replace(old_save, new_save, 1)

          update_anchor = '''    if (!input.idempotencyKey.trim()) {
        throw new Error("Recipe update idempotency key is required");
    }

    return withUserDatabase(input.userId, async (tx) => {'''
          update_replacement = '''    if (!input.idempotencyKey.trim()) {
        throw new Error("Recipe update idempotency key is required");
    }
    const resolvedRecipe = await resolvePlanningRecipeNutrition(input.recipe);
    validateRecipe(resolvedRecipe);

    return withUserDatabase(input.userId, async (tx) => {'''
          if update_anchor not in repo:
              raise SystemExit('updateRecipe insertion anchor not found')
          repo = repo.replace(update_anchor, update_replacement, 1)

          update_start = repo.index('export async function updateRecipe(input: {')
          update_end = repo.index('\nexport async function archiveRecipe(', update_start)
          update = repo[update_start:update_end]
          if '            recipe: input.recipe,' not in update:
              raise SystemExit('updateRecipe revision recipe anchor not found')
          update = update.replace('            recipe: input.recipe,', '            recipe: resolvedRecipe,', 1)
          if 'set name = ${input.recipe.name.trim()},' not in update:
              raise SystemExit('updateRecipe name anchor not found')
          update = update.replace('set name = ${input.recipe.name.trim()},', 'set name = ${resolvedRecipe.name.trim()},', 1)
          repo = repo[:update_start] + update + repo[update_end:]

          compose_anchor = '''export async function saveRecipeAndPlan(input: {
    userId: string;
    scope: PlanningScope;
    recipe: RecipeInput;
    plannedDate: string;
    mealSlot?: "breakfast" | "lunch" | "dinner" | "snack";
    plannedServings: number;
    note?: string;
    groceryItems: GroceryItemInput[];
    idempotencyKey: string;
}) {
    return withUserDatabase(input.userId, async (tx) => {'''
          compose_replacement = '''export async function saveRecipeAndPlan(input: {
    userId: string;
    scope: PlanningScope;
    recipe: RecipeInput;
    plannedDate: string;
    mealSlot?: "breakfast" | "lunch" | "dinner" | "snack";
    plannedServings: number;
    note?: string;
    groceryItems: GroceryItemInput[];
    idempotencyKey: string;
}) {
    const resolvedRecipe = await resolvePlanningRecipeNutrition(input.recipe);
    validateRecipe(resolvedRecipe);
    return withUserDatabase(input.userId, async (tx) => {'''
          if compose_anchor not in repo:
              raise SystemExit('saveRecipeAndPlan insertion anchor not found')
          repo = repo.replace(compose_anchor, compose_replacement, 1)
          compose_start = repo.index('export async function saveRecipeAndPlan(input: {')
          compose = repo[compose_start:]
          if '            recipe: input.recipe,' not in compose:
              raise SystemExit('saveRecipeAndPlan recipe anchor not found')
          compose = compose.replace('            recipe: input.recipe,', '            recipe: resolvedRecipe,', 1)
          repo = repo[:compose_start] + compose
          repository.write_text(repo)
          PY
      - run: bunx prettier --write src/recipe-nutrition-resolution.ts src/planning/repository.ts
      - run: bun run typecheck
      - run: bun test src/recipe-nutrition-resolution.test.ts
      - run: bun test
      - name: Commit tested shared guard and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recipe-nutrition-resolution.ts src/planning/repository.ts
          git rm .github/workflows/recipe-nutrition-shared-guard.yml
          git commit -m "Enforce recipe nutrition across write surfaces [recipe-nutrition-shared]"
          git push origin HEAD:fix/recipe-save-auto-nutrition
