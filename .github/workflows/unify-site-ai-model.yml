name: Unify website AI model

on:
  push:
    branches:
      - refactor/unified-site-ai-model

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-site-ai-model
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply unified model configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected marker in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("src/website-ai-config.ts").write_text('''export const DEFAULT_WEBSITE_AI_MODEL = "qwen/qwen3.7-flash";\n\nexport function websiteAiModel(\n    env: Record<string, string | undefined> = process.env,\n): string {\n    return env.MUNCH_AI_MODEL?.trim() || DEFAULT_WEBSITE_AI_MODEL;\n}\n''')

          Path("src/website-ai-config.test.ts").write_text('''import { expect, test } from "bun:test";\nimport { DEFAULT_WEBSITE_AI_MODEL, websiteAiModel } from "./website-ai-config.js";\n\ntest("website AI uses one shared model variable", () => {\n    expect(websiteAiModel({})).toBe(DEFAULT_WEBSITE_AI_MODEL);\n    expect(DEFAULT_WEBSITE_AI_MODEL).toBe("qwen/qwen3.7-flash");\n    expect(websiteAiModel({ MUNCH_AI_MODEL: "custom/model" })).toBe("custom/model");\n    expect(\n        websiteAiModel({\n            MUNCH_RECIPE_IMPORT_AI_MODEL: "legacy/recipe",\n            MUNCH_PANTRY_VISION_MODEL: "legacy/vision",\n            MUNCH_PANTRY_PLANNING_MODEL: "legacy/planning",\n        }),\n    ).toBe(DEFAULT_WEBSITE_AI_MODEL);\n});\n''')

          path = "src/recipe-import/semantic-resolver.ts"
          replace(path,
              'import { z } from "zod";\nimport { summarizeFoodCandidate } from "../food-providers/service.js";',
              'import { z } from "zod";\nimport { summarizeFoodCandidate } from "../food-providers/service.js";\nimport { DEFAULT_WEBSITE_AI_MODEL, websiteAiModel } from "../website-ai-config.js";')
          replace(path,
              'export const DEFAULT_RECIPE_IMPORT_AI_MODEL = "openai/gpt-5.6-luna";',
              'export const DEFAULT_RECIPE_IMPORT_AI_MODEL = DEFAULT_WEBSITE_AI_MODEL;')
          replace(path,
              '    return value?.trim().toLowerCase() === "json_object"\n        ? "json_object"\n        : "json_schema";',
              '    return value?.trim().toLowerCase() === "json_schema"\n        ? "json_schema"\n        : "json_object";')
          replace(path,
              '        model:\n            env.MUNCH_RECIPE_IMPORT_AI_MODEL?.trim() ||\n            DEFAULT_RECIPE_IMPORT_AI_MODEL,',
              '        model: websiteAiModel(env),')

          path = "src/inventory/vision.ts"
          replace(path,
              'import { z } from "zod";',
              'import { z } from "zod";\nimport { websiteAiModel } from "../website-ai-config.js";')
          replace(path,
              '        model:\n            env.MUNCH_PANTRY_VISION_MODEL?.trim() ||\n            env.MUNCH_RECIPE_IMPORT_AI_MODEL?.trim() ||\n            "openai/gpt-5.6-luna",',
              '        model: websiteAiModel(env),')

          path = "src/inventory/meal-ideas.ts"
          replace(path,
              'import { z } from "zod";',
              'import { z } from "zod";\nimport { websiteAiModel } from "../website-ai-config.js";')
          replace(path,
              '        model:\n            env.MUNCH_PANTRY_PLANNING_MODEL?.trim() ||\n            env.MUNCH_RECIPE_IMPORT_AI_MODEL?.trim() ||\n            "openai/gpt-5.6-luna",',
              '        model: websiteAiModel(env),')
          replace(path,
              '''                response_format: {\n                    type: "json_schema",\n                    json_schema: {\n                        name: "munch_pantry_meal_ideas",\n                        strict: true,\n                        schema: pantryMealIdeasResponseJsonSchema,\n                    },\n                },\n                provider: {\n                    data_collection: "deny",\n                    require_parameters: true,\n                },''',
              '''                response_format: { type: "json_object" },\n                provider: { data_collection: "deny" },''')

          path = "src/recipe-import/semantic-resolver.test.ts"
          replace(path,
              '                MUNCH_RECIPE_IMPORT_AI_MODEL: "google/gemini-test",',
              '                MUNCH_AI_MODEL: "google/gemini-test",')
          replace(path,
              '            responseFormat: "json_schema",',
              '            responseFormat: "json_object",')

          path = "src/inventory/meal-ideas.test.ts"
          replace(path,
              'test("Pantry planning exposes a strict provider JSON schema", () => {',
              'test("Pantry planning documents a strict runtime response contract", () => {')
          replace(path,
              '    ).toBe("openai/gpt-5.6-luna");',
              '    ).toBe("qwen/qwen3.7-flash");')
          replace(path,
              '    expect(\n        pantryPlanningModelConfig({\n            MUNCH_PANTRY_PLANNING_ENABLED: "false",',
              '    expect(\n        pantryPlanningModelConfig({\n            MUNCH_PANTRY_PLANNING_ENABLED: "true",\n            OPENROUTER_API_KEY: "test-key",\n            MUNCH_AI_MODEL: "custom/model",\n        })?.model,\n    ).toBe("custom/model");\n    expect(\n        pantryPlanningModelConfig({\n            MUNCH_PANTRY_PLANNING_ENABLED: "false",')

          path = ".env.example"
          replace(path,
              '# Website-only recipe URL semantic resolution. The website uses OpenRouter\n# because it has no conversational model already interpreting the URL. MCP /\n# ChatGPT recipe imports intentionally do not call this service; the connected\n# model handles semantic interpretation and uses Munch search_foods instead.\nOPENROUTER_API_KEY=\nMUNCH_RECIPE_IMPORT_AI_ENABLED=true\nMUNCH_RECIPE_IMPORT_AI_BASE_URL=https://openrouter.ai/api/v1\nMUNCH_RECIPE_IMPORT_AI_MODEL=openai/gpt-5.6-luna',
              '# Website-side AI uses one shared OpenRouter model for recipe import, Pantry\n# image understanding, and Pantry meal planning. Change MUNCH_AI_MODEL once to\n# switch every website AI feature. MCP / ChatGPT-side interpretation still uses\n# the connected host model rather than calling OpenRouter.\nOPENROUTER_API_KEY=\nMUNCH_AI_MODEL=qwen/qwen3.7-flash\nMUNCH_RECIPE_IMPORT_AI_ENABLED=true\nMUNCH_RECIPE_IMPORT_AI_BASE_URL=https://openrouter.ai/api/v1')
          replace(path,
              '# Use json_object for models that do not support strict JSON Schema output.\nMUNCH_RECIPE_IMPORT_AI_RESPONSE_FORMAT=json_schema',
              '# Runtime Zod validation enforces the contract after model JSON output.\nMUNCH_RECIPE_IMPORT_AI_RESPONSE_FORMAT=json_object')

          # Guard the runtime against reintroducing per-feature model selectors.
          for runtime in [
              Path("src/recipe-import/semantic-resolver.ts"),
              Path("src/inventory/vision.ts"),
              Path("src/inventory/meal-ideas.ts"),
          ]:
              text = runtime.read_text()
              for legacy in [
                  "MUNCH_RECIPE_IMPORT_AI_MODEL",
                  "MUNCH_PANTRY_VISION_MODEL",
                  "MUNCH_PANTRY_PLANNING_MODEL",
                  "openai/gpt-5.6-luna",
              ]:
                  if legacy in text:
                      raise SystemExit(f"legacy model selector remains in {runtime}: {legacy}")
          PY
      - name: Format and verify focused AI configuration
        run: |
          bunx prettier --write \
            src/website-ai-config.ts \
            src/website-ai-config.test.ts \
            src/recipe-import/semantic-resolver.ts \
            src/recipe-import/semantic-resolver.test.ts \
            src/inventory/vision.ts \
            src/inventory/meal-ideas.ts \
            src/inventory/meal-ideas.test.ts \
            .env.example
          bun test src/website-ai-config.test.ts src/recipe-import/semantic-resolver.test.ts src/inventory/vision.test.ts src/inventory/meal-ideas.test.ts
          bun run typecheck
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/website-ai-config.ts \
            src/website-ai-config.test.ts \
            src/recipe-import/semantic-resolver.ts \
            src/recipe-import/semantic-resolver.test.ts \
            src/inventory/vision.ts \
            src/inventory/meal-ideas.ts \
            src/inventory/meal-ideas.test.ts \
            .env.example
          if ! git diff --cached --quiet; then
            git commit -m "refactor: unify website AI model configuration"
            git push origin HEAD:refactor/unified-site-ai-model
          fi
