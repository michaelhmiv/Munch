name: Temporary fix production cert review id

on:
    push:
        branches:
            - fix/production-cert-review-id

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/production-cert-review-id
            - name: Fix review identifier contract
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  path = Path('scripts/certification/production-mcp-corpus.ts')
                  text = path.read_text()
                  old = 'const draftId = first?.draft_id as string | undefined;'
                  new = 'const draftId = first?.id as string | undefined;'
                  if old not in text:
                      if new in text:
                          raise SystemExit(0)
                      raise SystemExit('review id anchor changed')
                  path.write_text(text.replace(old, new, 1))
                  PY
            - name: Commit fix
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/certification/production-mcp-corpus.ts
                  git diff --cached --quiet || git commit -m "fix: read meal review id in production certification"
                  git push origin HEAD:fix/production-cert-review-id
