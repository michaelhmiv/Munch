name: Pantry intelligence completion

on:
  push:
    branches:
      - feat/pantry-intelligence-planning

permissions:
  contents: write

jobs:
  complete-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: munch
          POSTGRES_USER: munch
          POSTGRES_PASSWORD: munch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munch -d munch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://munch:munch@localhost:5432/munch
      MUNCH_APP_BASE_URL: http://localhost:3000
      MUNCH_PANTRY_PLANNING_ENABLED: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-intelligence-planning
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply completion patches
        run: |
          python3 scripts/pantry-intelligence-completion.py
          python3 scripts/pantry-array-fix.py
      - name: Format product surfaces
        run: |
          bunx prettier --write src/inventory src/account-export.ts src/recipe-planning-tools.ts scripts/pantry-ui-smoke.ts scripts/account-export-smoke.ts scripts/pantry-planning-smoke.ts public/pantry.html public/pantry.js public/pantry.css public/privacy.html .github/workflows/ci.yml
      - name: Verify unit, type, and UI contracts
        run: |
          bun test src/inventory
          bun run typecheck
          bun scripts/pantry-ui-smoke.ts
      - name: Verify Postgres planning and export contracts
        run: |
          bun run db:migrate
          bun scripts/pantry-planning-smoke.ts
          bun scripts/account-export-smoke.ts
      - name: Commit verified completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inventory src/account-export.ts src/recipe-planning-tools.ts scripts/pantry-ui-smoke.ts scripts/account-export-smoke.ts scripts/pantry-planning-smoke.ts public/pantry.html public/pantry.js public/pantry.css public/privacy.html .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat: complete Pantry Intelligence planning workflow"
            git push origin HEAD:feat/pantry-intelligence-planning
          fi
