name: Format PR 56

on:
  push:
    branches:
      - fix/production-certification-and-account-deletion-smoke

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-certification-and-account-deletion-smoke
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format follow-up audit coverage
        run: |
          bunx prettier --write \
            scripts/certification/public.ts \
            scripts/account-deletion-smoke.ts \
            .github/workflows/ci.yml
          rm .github/workflows/format-pr56-temp.yml
      - name: Commit formatting and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts .github/workflows
          git commit -m "Format production certification follow-up"
          git push origin HEAD:fix/production-certification-and-account-deletion-smoke
