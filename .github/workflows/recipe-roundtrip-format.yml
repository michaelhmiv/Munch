name: Recipe roundtrip formatter

on:
  push:
    branches:
      - fix/recipe-save-auto-nutrition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recipe-save-auto-nutrition
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/recipe-import-save-roundtrip-smoke.ts
      - name: Commit formatter result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/recipe-import-save-roundtrip-smoke.ts
          git rm .github/workflows/recipe-roundtrip-format.yml
          git commit -m "Format recipe roundtrip provenance smoke"
          git push origin HEAD:fix/recipe-save-auto-nutrition