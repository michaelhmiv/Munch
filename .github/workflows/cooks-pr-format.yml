name: Temporary Cooks PR formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/cooks-history-reliability-sep19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cooks-history-reliability-sep19
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Format only the Cooks PR changed source files
        run: |
          bunx prettier --write public/app.js public/widgets/src/templates/cook-summary.html src/app/routes.ts src/cook-tools.ts src/cooks/event-contract.ts src/cooks/repository.ts src/cooks/sep19-regression.test.ts scripts/cooks-sep19-regression.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/app.js public/widgets/src/templates/cook-summary.html src/app/routes.ts src/cook-tools.ts src/cooks/event-contract.ts src/cooks/repository.ts src/cooks/sep19-regression.test.ts scripts/cooks-sep19-regression.ts
            git commit -m "Format Cooks reliability PR"
            git push origin HEAD:refs/heads/fix/cooks-history-reliability-sep19
          fi
