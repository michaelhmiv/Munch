name: Format settings unit routing fix

on:
  push:
    branches:
      - fix/settings-unit-routing
    paths:
      - scripts/format-settings-unit-fix.trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-unit-routing
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write public/app.js public/weight-display.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/weight-display.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format settings unit routing fix"
          git push origin HEAD:fix/settings-unit-routing
