name: Apply free premium website contract
on:
  push:
    branches: [feat/free-premium-web-contract]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-premium-web-contract
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply copy changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text()
          text = text.replace(
              '''                            Munch supplies secure nutrition storage, verified
                            food search, saved foods, account controls, and
                            tools ChatGPT can call when you ask.''',
              '''                            Munch supplies structured food and macro data,
                            recent meal memory, verified food search, and tools
                            ChatGPT can call when you ask.''')
          text = text.replace(
              '''                                >Start 30-day free trial</a
                            ><a class="button button-secondary" href="#how"
                                >See how it works</a''',
              '''                                >Connect free</a
                            ><a class="button button-secondary" href="#pricing"
                                >Compare plans</a''')
          text = text.replace(
              '''                            <span class="proof-pill"
                                >$4.99/month after trial</span
                            ><span class="proof-pill">Cancel anytime</span
                            ><span class="proof-pill"
                                >No advertising analytics</span''',
              '''                            <span class="proof-pill">Permanent free tier</span
                            ><span class="proof-pill">No card required</span
                            ><span class="proof-pill"
                                >No advertising analytics</span''')
          old_pricing = '''                    <div class="section-head center">
                        <p class="section-kicker">One simple plan</p>
                        <h2>Everything Munch provides. No tiers.</h2>
                    </div>
                    <article class="pricing-card">
                        <p>30-day free trial</p>
                        <div class="price">
                            $4.99 <small>/ month after trial</small>
                        </div>
                        <ul class="pricing-list">
                            <li>Conversational meal logging</li>
                            <li>Verified food and barcode search</li>
                            <li>Saved foods and recurring meals</li>
                            <li>Macros, hydration, weight, and trends</li>
                            <li>ChatGPT connection controls</li>
                            <li>Export and permanent deletion</li>
                        </ul>
                        <a
                            class="button button-primary"
                            href="/account/login?return_to=/account/portal"
                            >Start free trial</a
                        >
                        <p class="tiny spacer-top">
                            Payment information is collected by Stripe. Cancel
                            anytime through the Stripe-hosted billing portal.
                        </p>
                    </article>'''
          new_pricing = '''                    <div class="section-head center">
                        <p class="section-kicker">Free and Premium</p>
                        <h2>Start with permanent food and macro tools.</h2>
                        <p class="section-copy">
                            Free covers individual food search, logging, recent
                            history, and data controls. Premium adds persistent
                            recipe, planning, grocery, and household workflows.
                        </p>
                    </div>
                    <div class="pricing-grid">
                        <article class="pricing-card">
                            <p>Free</p>
                            <div class="price">$0 <small>/ month</small></div>
                            <ul class="pricing-list">
                                <li>Food and barcode search with provenance</li>
                                <li>Meal logging, editing, and deletion</li>
                                <li>Daily calories and macro summaries</li>
                                <li>30 days of conversational history</li>
                                <li>Up to 25 saved foods</li>
                                <li>Export, revocation, and account deletion</li>
                            </ul>
                            <a
                                class="button button-secondary"
                                href="/account/login?return_to=/account/portal"
                                >Connect free</a
                            >
                            <p class="tiny spacer-top">
                                Permanent access. No payment information required.
                            </p>
                        </article>
                        <article class="pricing-card">
                            <p>Premium · 30-day trial</p>
                            <div class="price">
                                $4.99 <small>/ month after trial</small>
                            </div>
                            <ul class="pricing-list">
                                <li>Everything in Free</li>
                                <li>Unlimited personal history and saved foods</li>
                                <li>Structured recipe book and nutrition arithmetic</li>
                                <li>Meal calendar and grocery-list workflows</li>
                                <li>Shared household recipes, plans, and groceries</li>
                                <li>Up to six connected household accounts</li>
                            </ul>
                            <a
                                class="button button-primary"
                                href="/account/login?return_to=/account/portal"
                                >Start Premium trial</a
                            >
                            <p class="tiny spacer-top">
                                Purchased and managed on Munch through Stripe.
                                ChatGPT connection does not require Premium.
                            </p>
                        </article>
                    </div>'''
          if old_pricing not in text:
              raise SystemExit('pricing block not found')
          text = text.replace(old_pricing, new_pricing)
          index.write_text(text)

          tools = Path('public/tools.html')
          text = tools.read_text()
          text = text.replace('https://munch-production-de3a.up.railway.app/tools', 'https://munch.business/tools')
          text = text.replace('>Start free trial</a', '>Sign in</a')
          text = text.replace('''                <section class="tool-group">
                    <div>
                        <h2>Developer and MCP details</h2>''', '''                <section class="tool-group">
                    <div>
                        <h2>Recipes, meal plans, and groceries</h2>
                        <p>
                            Premium accounts can turn recipes discussed with
                            ChatGPT into persistent personal or household data.
                        </p>
                    </div>
                    <div class="tool-list">
                        <div class="tool-item">
                            <code>“Save this recipe to our recipe book.”</code
                            ><span>Store ingredients, servings, instructions, nutrition, and provenance.</span>
                        </div>
                        <div class="tool-item">
                            <code>“Plan it for Monday dinner.”</code
                            ><span>Schedule the immutable recipe revision on the shared calendar.</span>
                        </div>
                        <div class="tool-item">
                            <code>“We have everything except onions.”</code
                            ><span>Add only onions to the shared grocery list; no pantry inventory is inferred.</span>
                        </div>
                        <div class="tool-item">
                            <code>“What did Mom plan for Monday?”</code
                            ><span>Read the household plan and factual nutrition in another connected account.</span>
                        </div>
                    </div>
                </section>
                <section class="tool-group">
                    <div>
                        <h2>Developer and MCP details</h2>''')
          text = text.replace('''                            <code>Stripe Checkout</code
                            ><span
                                >Seven-day trial and recurring
                                subscription.</span
                            >''', '''                            <code>Stripe Checkout</code
                            ><span
                                >Website-only Premium purchase and subscription management.</span
                            >''')
          tools.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              '- Munch performs authentication, subscription entitlement checks, deterministic validation, food-source retrieval, storage, summaries, exports, and deletion.',
              '- Munch performs authentication, capability resolution, deterministic validation, food-source retrieval, storage, summaries, exports, and deletion.')
          text = text.replace(
              '- Stripe manages checkout, subscriptions, invoices, and customer billing state.',
              '- Stripe manages website-only Premium checkout, subscriptions, invoices, and customer billing state; OAuth and MCP remain billing-neutral.')
          text = text.replace(
              '8. Saved foods, saved meals, and “log my usual” behavior.',
              '8. Saved foods, structured recipes, meal calendars, grocery lists, household sharing, and “log my usual” behavior.')
          readme.write_text(text)
          PY
      - run: bun run format
      - run: rm .github/workflows/apply-free-premium-web-contract.yml
      - name: Commit contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: publish Free and Premium website contract"
          git push origin HEAD:feat/free-premium-web-contract
