name: Pantry branch worker

on:
  push:
    branches:
      - feat/pantry-inventory-reconciliation

permissions:
  contents: write

concurrency:
  group: pantry-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_test
      MUNCH_APP_BASE_URL: https://munch.example
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESEND_API_KEY: re_test_schema
      MUNCH_EMAIL_FROM: Munch <support@munch.example>
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pantry-inventory-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Apply Pantry SQL fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/inventory/repository.ts')
          text = path.read_text()

          old_json = '${JSON.stringify(input.metadata ?? {})}::jsonb'
          if old_json in text:
              text = text.replace(old_json, 'jsonb_build_object()', 1)
          elif 'jsonb_build_object()' not in text:
              raise SystemExit('Pantry JSONB marker not found')

          old_query = '''        const rows = await tx<Array<Record<string, unknown>>>`
            select * from munch.inventory_items
            where inventory_space_id = ${spaceId}
              and deleted_at is null
              and (${input.includeDepleted ?? false} or stock_state <> 'depleted')
              and (${input.location ?? null}::text is null or location = ${input.location ?? null})
              and (${query} = '' or normalized_name like ${`%${query}%`})
              and (
                ${candidates.length === 0}
                or normalized_name = any(${candidates}::text[])
                or exists (
                    select 1 from unnest(${candidates}::text[]) c(name)
                    where normalized_name like '%' || c.name || '%'
                       or c.name like '%' || normalized_name || '%'
                )
              )
            order by case stock_state when 'low' then 0 else 1 end, updated_at desc
            limit ${max}
        `;'''
          new_query = '''        const rows =
            candidates.length === 0
                ? await tx<Array<Record<string, unknown>>>`
                      select * from munch.inventory_items
                      where inventory_space_id = ${spaceId}
                        and deleted_at is null
                        and (${input.includeDepleted ?? false} or stock_state <> 'depleted')
                        and (${input.location ?? null}::text is null or location = ${input.location ?? null})
                        and (${query} = '' or normalized_name like ${`%${query}%`})
                      order by case stock_state when 'low' then 0 else 1 end, updated_at desc
                      limit ${max}
                  `
                : await tx<Array<Record<string, unknown>>>`
                      select * from munch.inventory_items
                      where inventory_space_id = ${spaceId}
                        and deleted_at is null
                        and (${input.includeDepleted ?? false} or stock_state <> 'depleted')
                        and (${input.location ?? null}::text is null or location = ${input.location ?? null})
                        and (${query} = '' or normalized_name like ${`%${query}%`})
                        and (
                            normalized_name = any(${candidates}::text[])
                            or exists (
                                select 1 from unnest(${candidates}::text[]) c(name)
                                where normalized_name like '%' || c.name || '%'
                                   or c.name like '%' || normalized_name || '%'
                            )
                        )
                      order by case stock_state when 'low' then 0 else 1 end, updated_at desc
                      limit ${max}
                  `;'''
          if old_query in text:
              text = text.replace(old_query, new_query, 1)
          elif 'candidates.length === 0\n                ? await tx' not in text:
              raise SystemExit('Pantry candidate query marker not found')

          path.write_text(text)
          PY
          bunx prettier --write src/inventory/repository.ts
      - name: Verify fixes and write result
        id: verify
        shell: bash
        run: |
          set +e
          {
            echo "== migrate =="
            bun run db:migrate
            migrate=$?
            echo "migrate_exit=$migrate"
            if [ "$migrate" -eq 0 ]; then
              echo "== pantry smoke =="
              bun scripts/pantry-platform-smoke.ts
              smoke=$?
            else
              smoke=99
            fi
            echo "pantry_smoke_exit=$smoke"
            if [ "$migrate" -eq 0 ] && [ "$smoke" -eq 0 ]; then
              echo "== typecheck =="
              bun run typecheck
              types=$?
            else
              types=99
            fi
            echo "typecheck_exit=$types"
          } > .github/pantry-worker-result.txt 2>&1
          if [ "${migrate:-99}" -eq 0 ] && [ "${smoke:-99}" -eq 0 ] && [ "${types:-99}" -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            git restore src/inventory/repository.ts
          fi
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pantry-worker-result.txt
          if [ "${{ steps.verify.outputs.success }}" = "true" ]; then
            git add src/inventory/repository.ts
            git commit -m "fix: harden Pantry event and candidate SQL bindings"
          else
            git commit -m "ci: capture Pantry SQL hardening failure"
          fi
          git push origin HEAD:feat/pantry-inventory-reconciliation
