name: Rebaseline format

on:
    push:
        branches:
            - rebaseline/better-auth-clean-slate

permissions:
    contents: write

jobs:
    format:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: rebaseline/better-auth-clean-slate
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: bunx prettier --write .
            - name: Commit formatting
              run: |
                  if git diff --quiet; then
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "Format Better Auth rebaseline"
                  git push origin HEAD:rebaseline/better-auth-clean-slate
