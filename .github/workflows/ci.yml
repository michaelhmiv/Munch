name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Enforce cross-surface capability contracts
        run: bun scripts/capability-manifest-check.ts
      - name: Enforce connection commerce boundary
        run: bun run commerce:check
      - name: Verify OpenAI submission package
        run: bun run submission:check
      - name: Verify responsive UI surfaces
        run: bun scripts/ui-surface-smoke.ts
      - name: Verify premium Pantry web surface
        run: bun scripts/pantry-ui-smoke.ts
      - name: Verify ChatGPT widget contracts
        run: bun scripts/widget-contract-smoke.ts
      - name: Typecheck server
        run: bun run typecheck
      - name: Run tests and architecture invariants
        run: bun test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_test
      MUNCH_APP_BASE_URL: https://munch.example
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESEND_API_KEY: re_test_schema
      MUNCH_EMAIL_FROM: Munch <support@munch.example>
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install fresh canonical schema
        run: bun run db:migrate
      - name: Verify canonical schema is idempotent
        run: bun run db:migrate
      - name: Verify Better Auth schema is current
        env:
          NODE_ENV: test
        run: bun scripts/better-auth-schema-smoke.ts
      - name: Exercise Better Auth dynamic client registration
        env:
          NODE_ENV: test
        run: bun scripts/better-auth-oauth-http-smoke.ts
      - name: Exercise Better Auth connection listing and revocation
        run: bun scripts/better-auth-connections-smoke.ts
      - name: Provision and exercise marketplace reviewer account
        env:
          NODE_ENV: test
        run: |
          REVIEWER_PASSWORD="$(openssl rand -hex 24)"
          REVIEWER_EMAIL="reviewer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          MUNCH_REVIEWER_EMAIL="$REVIEWER_EMAIL" MUNCH_REVIEWER_PASSWORD="$REVIEWER_PASSWORD" bun scripts/provision-reviewer.ts
          MUNCH_REVIEWER_EMAIL="$REVIEWER_EMAIL" MUNCH_REVIEWER_PASSWORD="$REVIEWER_PASSWORD" bun scripts/reviewer-readiness-smoke.ts
      - name: Exercise nutrition persistence, idempotency, and RLS
        run: bun scripts/nutrition-platform-smoke.ts
      - name: Exercise Railway service facilities
        run: bun scripts/service-platform-smoke.ts
      - name: Exercise structured meal items, totals, idempotency, and RLS
        run: bun scripts/structured-meal-smoke.ts
      - name: Exercise saved foods, personal history, and RLS
        run: bun scripts/saved-foods-smoke.ts
      - name: Exercise household membership, invitations, and RLS
        run: bun scripts/household-rls-smoke.ts
      - name: Exercise household transfer, leave, and dissolution
        run: bun scripts/household-lifecycle-smoke.ts
      - name: Exercise recipes, planning, groceries, idempotency, and RLS
        run: bun scripts/recipe-planning-smoke.ts
      - name: Exercise Pantry inventory, receipt reconciliation, and RLS
        run: bun scripts/pantry-platform-smoke.ts
      - name: Exercise complete account export and household privacy
        run: bun scripts/account-export-smoke.ts
      - name: Exercise meal draft state, confirmation, idempotency, and RLS
        run: bun scripts/meal-drafts-smoke.ts
      - name: Exercise atomic meal review, edits, confirmation, and RLS
        run: bun scripts/atomic-meal-review-smoke.ts
      - name: Benchmark meal review database paths
        env:
          MUNCH_BENCHMARK_ITERATIONS: 3
        run: bun scripts/meal-review-benchmark.ts
      - name: Exercise Better Auth account deletion and cascade cleanup
        run: bun scripts/account-deletion-smoke.ts
      - name: Exercise readiness endpoints and maintenance
        run: bun scripts/operations-smoke.ts

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag munch-ci:${{ github.sha }} .
