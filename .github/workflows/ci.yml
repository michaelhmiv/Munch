name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-reviewer:
    if: github.head_ref == 'feat/reviewer-readiness-final' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewer branch
        uses: actions/checkout@v4
        with:
          ref: feat/reviewer-readiness-final
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply pinned formatting
        run: bunx prettier --write scripts/provision-reviewer.ts scripts/reviewer-readiness-smoke.ts src/auth/auth.ts src/billing/capabilities.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provision-reviewer.ts scripts/reviewer-readiness-smoke.ts src/auth/auth.ts src/billing/capabilities.ts
          git diff --cached --quiet || git commit -m "style: format reviewer implementation"
          git push origin HEAD:feat/reviewer-readiness-final
