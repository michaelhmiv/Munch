name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-reviewer-seed:
    if: github.head_ref == 'feat/reviewer-readiness-final' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reviewer-readiness-final
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/provision-reviewer.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/provision-reviewer.ts
          git diff --cached --quiet || git commit -m "style: format corrected reviewer seed"
          git push origin HEAD:feat/reviewer-readiness-final
