name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-portal:
    if: github.head_ref == 'feat/household-portal-controls'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/household-portal-controls
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Link scoped portal stylesheet
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/portal/routes.ts')
          text = path.read_text()
          old = '<link rel="stylesheet" href="/styles.css"></head>'
          new = '<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/portal-controls.css"></head>'
          if old not in text and new not in text:
              raise SystemExit('portal stylesheet insertion point not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format portal files
        run: bunx prettier --write src/portal/routes.ts scripts/account-portal-smoke.ts public/portal-controls.css
      - name: Commit final portal files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/portal/routes.ts scripts/account-portal-smoke.ts public/portal-controls.css
          git diff --cached --quiet || git commit -m "style: finalize household portal controls"
          git push origin HEAD:feat/household-portal-controls
