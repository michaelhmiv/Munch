name: CI

on:
  push:
    branches:
      - feat/reviewer-readiness-final

permissions:
  contents: write

jobs:
  finalize-reviewer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reviewer-readiness-final
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - name: Correct personal recipe source
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/provision-reviewer.ts')
          text = path.read_text()
          old = '''        description: "Reviewer sample personal recipe",
        servings: 1,
        sourceType: "user_supplied",'''
          new = '''        description: "Reviewer sample personal recipe",
        servings: 1,
        sourceType: "user_entered",'''
          if old not in text:
              raise SystemExit('reviewer personal recipe source block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply pinned formatting
        run: bunx prettier --write db/migrations/0022_provisioned_credentials.sql docs/review/marketplace-review.md scripts/provision-reviewer.ts scripts/reviewer-readiness-smoke.ts src/auth/auth.ts src/auth/reviewer-routes.ts src/auth/routes.ts src/billing/capabilities.ts src/billing/override.ts
      - name: Commit final reviewer implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add db/migrations/0022_provisioned_credentials.sql docs/review/marketplace-review.md scripts/provision-reviewer.ts scripts/reviewer-readiness-smoke.ts src/auth/auth.ts src/auth/reviewer-routes.ts src/auth/routes.ts src/billing/capabilities.ts src/billing/override.ts
          git diff --cached --quiet || git commit -m "fix: finalize reviewer credentials and sample data"
          git push origin HEAD:feat/reviewer-readiness-final
