name: CI

on:
  push:
    branches:
      - fix/legal-household-disclosures

permissions:
  contents: write

jobs:
  format-legal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/legal-household-disclosures
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format legal pages
        run: bunx prettier --write public/privacy.html public/terms.html docs/architecture/household-data-boundary.md
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/privacy.html public/terms.html docs/architecture/household-data-boundary.md
          git diff --cached --quiet || git commit -m "style: apply pinned Prettier to legal disclosures"
          git push origin HEAD:fix/legal-household-disclosures
