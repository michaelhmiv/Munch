name: Finalize portal smoke process

on:
  push:
    branches:
      - fix/production-auth-discovery-meal-visibility

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-auth-discovery-meal-visibility
          fetch-depth: 0
      - name: Terminate the completed smoke process
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/account-portal-smoke.ts')
          text = path.read_text()
          marker = 'process.exit(0);'
          if marker not in text:
              text = text.rstrip() + '\nprocess.exit(0);\n'
              path.write_text(text)
          Path('.github/workflows/portal-smoke-exit-temp.yml').unlink()
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/account-portal-smoke.ts
      - name: Commit the smoke-runner fix and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/account-portal-smoke.ts .github/workflows/portal-smoke-exit-temp.yml
          git commit -m "Terminate completed account portal smoke runner"
          git push origin HEAD:fix/production-auth-discovery-meal-visibility
