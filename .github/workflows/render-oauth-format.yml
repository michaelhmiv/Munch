name: Apply OAuth script formatting

on:
    pull_request:

permissions:
    contents: write

jobs:
    format:
        if: github.head_ref == 'fix/oauth-consent-request-continuation' && github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: fix/oauth-consent-request-continuation
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - run: bun install --frozen-lockfile
            - run: bunx prettier --write scripts/better-auth-browser-oauth-smoke.ts
            - name: Commit formatting
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add scripts/better-auth-browser-oauth-smoke.ts
                  git diff --cached --quiet || git commit -m "style: format OAuth browser smoke"
                  git push origin HEAD:fix/oauth-consent-request-continuation
