name: Format nutrition optimization branch

on:
  push:
    branches:
      - perf/nutrition-ingestion-latency

permissions:
  contents: write

concurrency:
  group: format-nutrition-optimization
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/nutrition-ingestion-latency
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply canonical formatting
        run: >-
          bunx prettier --write
          scripts/food-catalog-benchmark.ts
          scripts/food-catalog-common-corpus.ts
          scripts/food-catalog-ingestion-smoke.ts
          scripts/import-usda-food-catalog.ts
          src/food-providers/catalog-repository.ts
          src/food-providers/fixtures/usda-foundation-mini.json
          src/food-providers/locality.test.ts
          src/food-providers/query-normalization.ts
          src/food-providers/registry.ts
          src/food-providers/service.ts
          src/food-providers/usda-bulk.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- scripts src/food-providers; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/food-catalog-benchmark.ts scripts/food-catalog-common-corpus.ts scripts/food-catalog-ingestion-smoke.ts scripts/import-usda-food-catalog.ts src/food-providers/catalog-repository.ts src/food-providers/fixtures/usda-foundation-mini.json src/food-providers/locality.test.ts src/food-providers/query-normalization.ts src/food-providers/registry.ts src/food-providers/service.ts src/food-providers/usda-bulk.ts
          git commit -m "Format nutrition optimization changes"
          git push origin HEAD:perf/nutrition-ingestion-latency
