name: Production certification audit

on:
  push:
    branches:
      - audit/production-certification-20260806

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audited release
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Confirm audited parent release
        run: git merge-base --is-ancestor 228258fe5fb411fbef29788dc95a4e1c4701f0ba HEAD

      - name: Certify live production
        run: bun scripts/certification/public.ts https://munch.business
