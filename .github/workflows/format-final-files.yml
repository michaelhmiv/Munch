name: Format Final Files

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: format-final-files
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/munch-frontend-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/munch-frontend-overhaul
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format final source files
        run: bunx prettier --write scripts/oauth-http-smoke.ts scripts/typecheck.ts

      - name: Commit formatting
        run: |
          git checkout -- .github/workflows/format-final-files.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/oauth-http-smoke.ts scripts/typecheck.ts
          git commit -m "style: format final validation scripts"
          git push origin HEAD:feat/munch-frontend-overhaul
