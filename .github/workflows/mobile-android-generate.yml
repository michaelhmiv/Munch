name: Mobile Android shell generator

on:
  push:
    branches:
      - mobile/04-android-shell

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[android-shell-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/04-android-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install updated dependency graph
        run: bun install
      - name: Build local mobile web bundle
        run: bun run mobile:web
      - name: Generate Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            npx cap sync android
          fi
          bun scripts/configure-mobile-android.ts
      - name: Validate Android project
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - name: Commit generated Android shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock android
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate Capacitor Android shell [android-shell-generated]"
          git push
