<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <meta name="robots" content="noindex,nofollow" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#f6f1e7" />
        <title>Munch</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/styles.css" />
        <link rel="stylesheet" href="/app-overrides.css" />
        <link rel="stylesheet" href="/account-settings.css" />
    </head>
    <body class="app-page">
        <a class="skip-link" href="#app-content">Skip to content</a>
        <div class="app-shell">
            <aside class="app-sidebar">
                <a class="brand" href="/app"
                    ><img
                        class="brand-logo"
                        src="/brand/munch-mark.svg"
                        alt=""
                    /><span>Munch</span></a
                >
                <nav class="app-nav" aria-label="Application navigation">
                    <a data-route="today" href="/app"
                        ><span class="nav-icon">◉</span><span>Today</span></a
                    >
                    <a data-route="log" href="/app/log"
                        ><span class="nav-icon">▤</span><span>History</span></a
                    >
                    <a data-route="trends" href="/app/trends"
                        ><span class="nav-icon">↗</span><span>Trends</span></a
                    >
                    <!-- Chat v2 placement (Contextual only): there is
                         deliberately NO global Chat nav entry — the
                         agent is reached from the Today, Meal Plan,
                         Pantry, and Trends entry rows only. -->
                    <a data-route="recipes" href="/app/recipes"
                        ><span class="nav-icon">◇</span><span>Recipes</span></a
                    >
                    <a data-route="cooks" href="/app/cooks"
                        ><span class="nav-icon">♨</span><span>Cooks</span></a
                    >
                    <a data-route="plan" href="/app/plan"
                        ><span class="nav-icon">□</span
                        ><span>Meal Plan</span></a
                    >
                    <a data-route="groceries" href="/app/groceries"
                        ><span class="nav-icon">✓</span
                        ><span>Groceries</span></a
                    >
                    <a data-route="pantry" href="/app/pantry"
                        ><span class="nav-icon">▦</span><span>Pantry</span></a
                    >
                    <a data-route="household" href="/app/household"
                        ><span class="nav-icon">⌂</span
                        ><span>Household</span></a
                    >
                </nav>
                <div class="sidebar-bottom">
                    <nav class="app-nav" aria-label="Account navigation">
                        <a data-route="settings" href="/app/settings"
                            ><span class="nav-icon">⚙</span
                            ><span>Settings</span></a
                        >
                        <a href="/help"
                            ><span class="nav-icon">?</span><span>Help</span></a
                        >
                    </nav>
                </div>
            </aside>
            <main class="app-main">
                <div class="app-content" id="app-content" tabindex="-1">
                    <!-- Boot surface (design-authority-addendum-motion
                         rule 2): the Munch mark on the paper ground is
                         the startup state — no skeleton, no loading
                         text. The first rendered view replaces it and
                         fades in on the shared motion tokens. -->
                    <div class="boot-state" role="status">
                        <img
                            class="boot-mark"
                            src="/brand/munch-mark.svg"
                            alt=""
                            width="76"
                            height="76"
                        />
                        <span class="sr-only">Loading Munch</span>
                    </div>
                </div>
            </main>
        </div>
        <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
            <a data-route="today" href="/app"
                ><span class="tab-icon" aria-hidden="true"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                        /></svg></span
                ><span>Today</span></a
            >
            <a data-route="plan" href="/app/plan"
                ><span class="tab-icon" aria-hidden="true"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <rect x="3" y="5" width="18" height="16" rx="2" />
                        <path d="M3 10h18M8 3v4M16 3v4" /></svg></span
                ><span>Plan</span></a
            >
            <a data-route="recipes" href="/app/recipes"
                ><span class="tab-icon" aria-hidden="true"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path
                            d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"
                        />
                        <path
                            d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"
                        /></svg></span
                ><span>Recipes</span></a
            >
            <a data-route="groceries" href="/app/groceries"
                ><span class="tab-icon" aria-hidden="true"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path
                            d="M5 8h14l-1.3 11a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8L5 8z"
                        />
                        <path
                            d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10"
                        /></svg></span
                ><span>Groceries</span></a
            >
            <a data-route="pantry" href="/app/pantry"
                ><span class="tab-icon" aria-hidden="true"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M6 3h12M7 3v3M17 3v3" />
                        <path
                            d="M6.5 6h11V20a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 20V6z"
                        />
                        <path d="M6.5 11h11" /></svg></span
                ><span>Pantry</span></a
            >
            <a data-route="more" href="/app/more"
                ><span class="tab-icon" aria-hidden="true"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="5" cy="12" r="1.6" />
                        <circle cx="12" cy="12" r="1.6" />
                        <circle cx="19" cy="12" r="1.6" /></svg></span
                ><span>More</span></a
            >
        </nav>
        <div
            class="toast-region"
            id="toast-region"
            aria-live="polite"
            aria-atomic="true"
        ></div>
        <dialog id="app-dialog"></dialog>
        <script type="module" src="/app-integrity.js"></script>
        <script type="module" src="/app.js"></script>
        <script type="module" src="/app-patches.js"></script>
        <script>
            // S4 startup honesty: if the app bundle or the first data
            // load never resolves, the boot surface must not sit forever.
            // After 12s with a loading state still on screen, swap in
            // an honest failure state with a reload action. A stored
            // session is untouched by this — it stays on the device.
            window.setTimeout(() => {
                const content = document.getElementById("app-content");
                if (
                    !content ||
                    !content.querySelector(".boot-state, .loading-state")
                ) {
                    return;
                }
                content.innerHTML =
                    '<div class="error-state" data-testid="startup-failure-state"><div><h2>Munch is taking too long to load</h2><p>The app did not finish loading — the bundle or the Munch service did not respond. Check your connection, then reload. Your session stays saved on this device.</p><button class="button button-primary spacer-top" type="button" id="startup-reload">Reload Munch</button></div></div>';
                document
                    .getElementById("startup-reload")
                    ?.addEventListener("click", () => location.reload());
            }, 12000);
        </script>
    </body>
</html>
