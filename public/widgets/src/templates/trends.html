<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nutrition Trends</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .trends {
                padding: 15px;
            }
            .range-controls {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 14px;
            }
            .range-controls .btn[aria-pressed="true"] {
                background: var(--accent);
                color: var(--accent-contrast);
                border-color: var(--accent);
            }
            .trend-detail {
                display: grid;
                grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
                gap: 20px;
                margin-top: 18px;
            }
            .day-table {
                max-height: min(48vh, 520px);
                overflow: auto;
            }
            @media (max-width: 720px) {
                .trend-detail {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            function buildSample() {
                const days = [];
                const end = new Date("2026-08-05T12:00:00Z");
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(end);
                    d.setUTCDate(d.getUTCDate() - i);
                    const wave = Math.sin(i / 3);
                    days.push({
                        date: d.toISOString().slice(0, 10),
                        calories: Math.round(2050 + wave * 230),
                        protein_g: Math.round(148 + wave * 16),
                        carbs_g: Math.round(210 + wave * 24),
                        fat_g: Math.round(68 + wave * 8),
                        water_ml: Math.round(2100 + wave * 300),
                    });
                }
                return {
                    end_date: "2026-08-05",
                    default_range: 14,
                    goals: {
                        calories: 2200,
                        protein_g: 160,
                        carbs_g: 220,
                        fat_g: 70,
                        water_ml: 2500,
                    },
                    days,
                };
            }
            const SAMPLE = buildSample();
            let DATA = null,
                API = null,
                RANGE = 14;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                return payload.structuredContent || null;
            }
            function average(days, key) {
                if (!days.length) return 0;
                return (
                    days.reduce((sum, day) => sum + Number(day[key] || 0), 0) /
                    days.length
                );
            }
            function hasData(day) {
                return [
                    "calories",
                    "protein_g",
                    "carbs_g",
                    "fat_g",
                    "water_ml",
                ].some((key) => Number(day[key] || 0) > 0);
            }
            function sliceForRange(data, range) {
                const sorted = data.days
                    .slice()
                    .sort((a, b) => a.date.localeCompare(b.date));
                return sorted.slice(-range);
            }
            function changeText(slice) {
                if (slice.length < 4)
                    return "Not enough data to compare periods.";
                const midpoint = Math.floor(slice.length / 2);
                const first = average(slice.slice(0, midpoint), "calories");
                const second = average(slice.slice(midpoint), "calories");
                const delta = Math.round(second - first);
                if (Math.abs(delta) < 50)
                    return "Average calories were stable across this window.";
                return `Average calories moved ${fmt(Math.abs(delta))} kcal ${delta > 0 ? "higher" : "lower"} in the newer half of the window.`;
            }
            function paint() {
                const slice = sliceForRange(DATA, RANGE);
                const logged = slice.filter(hasData);
                if (!logged.length) {
                    document.getElementById("root").innerHTML =
                        '<article class="card empty"><strong>No trend data yet</strong>Log meals on several days to build a trend.</article>';
                    return;
                }
                const avg = {
                    calories: average(slice, "calories"),
                    protein_g: average(slice, "protein_g"),
                    carbs_g: average(slice, "carbs_g"),
                    fat_g: average(slice, "fat_g"),
                    water_ml: average(slice, "water_ml"),
                };
                const points = slice.map((day) => ({
                    value: day.calories || 0,
                }));
                const start = slice[0]?.date,
                    end = slice[slice.length - 1]?.date;
                const rows = slice
                    .map(
                        (day) =>
                            `<tr><td>${esc(humanDate(day.date))}</td><td class="num">${fmt(day.calories)}</td><td class="num">${fmt(day.protein_g, 1)}</td><td class="num">${fmt(day.carbs_g, 1)}</td><td class="num">${fmt(day.fat_g, 1)}</td></tr>`,
                    )
                    .join("");
                const controls = [7, 14, 30]
                    .map(
                        (range) =>
                            `<button class="btn btn-sm" data-range="${range}" aria-pressed="${RANGE === range}">${range} days</button>`,
                    )
                    .join("");
                document.getElementById("root").innerHTML =
                    `<article class="card trends"><div class="head"><div class="head-main"><div class="eyebrow">Nutrition</div><h1>${RANGE}-day trend</h1><div class="meta">${esc(humanRange(start, end))} · ${logged.length}/${slice.length} days logged</div></div><button class="btn btn-sm inline-only" id="explore">Explore trends</button></div>
 <div class="fullscreen-only range-controls" role="group" aria-label="Trend range">${controls}</div>
 <div>${sparkline(points, { goal: DATA.goals?.calories, label: `Calories over ${RANGE} days` })}<div class="row-between caption"><span>${esc(humanDate(start))}</span><span>avg ${fmt(avg.calories)} kcal</span><span>${esc(humanDate(end))}</span></div></div>
 <div class="metrics" style="margin-top:12px">${nutrientMetrics(avg)}</div><div class="notice" style="margin-top:12px">${esc(changeText(slice))}</div>
 <div class="fullscreen-only"><div class="trend-detail"><div><h2>Daily values</h2><div class="table-wrap day-table" style="margin-top:10px"><table><thead><tr><th>Date</th><th>kcal</th><th>Protein</th><th>Carbs</th><th>Fat</th></tr></thead><tbody>${rows}</tbody></table></div></div><div><h2>Average versus target</h2><div class="stack" style="margin-top:12px">${progress("Calories", avg.calories, DATA.goals?.calories, "kcal", "var(--calories)")}${progress("Protein", avg.protein_g, DATA.goals?.protein_g, "g", "var(--protein)")}${progress("Carbs", avg.carbs_g, DATA.goals?.carbs_g, "g", "var(--carbs)")}${progress("Fat", avg.fat_g, DATA.goals?.fat_g, "g", "var(--fat)")}${progress("Water", avg.water_ml, DATA.goals?.water_ml, "ml", "var(--water)")}</div></div></div><div class="actions"><button class="btn" id="close">Return to chat</button></div></div></article>`;
                document
                    .getElementById("explore")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("fullscreen"),
                    );
                document
                    .getElementById("close")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("inline"),
                    );
                document.querySelectorAll("[data-range]").forEach((button) =>
                    button.addEventListener("click", () => {
                        RANGE = Number(button.dataset.range);
                        paint();
                    }),
                );
            }
            function render(data) {
                DATA = data;
                RANGE = [7, 14, 30].includes(Number(data.default_range))
                    ? Number(data.default_range)
                    : 14;
                paint();
            }
            initWidget({
                name: "trends-widget",
                displayModes: ["inline", "fullscreen"],
                loading:
                    '<div class="card empty">Loading nutrition trends…</div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
                onHostContext() {
                    if (DATA) paint();
                },
            });
        </script>
    </body>
</html>
