<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Goal Progress</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .snapshot {
                padding: 15px;
            }
            .focus {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 14px;
                align-items: center;
                padding: 13px;
                border-radius: var(--radius-sm);
                background: var(--panel-muted);
            }
            .focus-value {
                font-size: 25px;
                font-weight: 760;
                letter-spacing: -0.025em;
                font-variant-numeric: tabular-nums;
            }
            .macro-list {
                display: grid;
                gap: 13px;
                margin-top: 14px;
            }
            .weight-note {
                margin-top: 13px;
                padding-top: 12px;
                border-top: 1px solid var(--panel-border);
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            const SAMPLE = {
                date: "2026-08-05",
                meal_count: 4,
                water_entries: 6,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    water_ml: 2500,
                },
                totals: {
                    calories: 1980,
                    protein_g: 148,
                    carbs_g: 231,
                    fat_g: 74,
                    water_ml: 2100,
                },
                weight: {
                    current: 78.4,
                    target: 75,
                    unit: "kg",
                    logged_on: "2026-08-04",
                },
            };
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.totals || payload.date) return payload;
                return payload.structuredContent || null;
            }
            function render(data) {
                const meals = Number(data.meal_count || 0);
                const waters = Number(data.water_entries || 0);
                const totals = data.totals || {};
                const goals = data.goals || {};
                const caloriePct = pct(totals.calories, goals.calories);
                const headline =
                    caloriePct == null
                        ? `${fmt(totals.calories)} kcal logged`
                        : `${caloriePct}% of calorie target`;
                const insightCandidates = [];
                for (const entry of [
                    ["Protein", totals.protein_g, goals.protein_g, "g"],
                    ["Carbs", totals.carbs_g, goals.carbs_g, "g"],
                    ["Fat", totals.fat_g, goals.fat_g, "g"],
                    ["Water", totals.water_ml, goals.water_ml, "ml"],
                ]) {
                    const percentage = pct(entry[1], entry[2]);
                    if (percentage != null)
                        insightCandidates.push({
                            label: entry[0],
                            percentage,
                            value: entry[1],
                            goal: entry[2],
                            unit: entry[3],
                        });
                }
                insightCandidates.sort(
                    (a, b) =>
                        Math.abs(100 - b.percentage) -
                        Math.abs(100 - a.percentage),
                );
                const notable = insightCandidates[0];
                const insight = notable
                    ? notable.percentage > 110
                        ? `${notable.label} is ${notable.percentage - 100}% above today’s target.`
                        : notable.percentage < 75
                          ? `${notable.label} is at ${notable.percentage}% of today’s target.`
                          : "Today’s logged intake is close to the targets shown below."
                    : "Set nutrition goals to compare today’s intake with your targets.";
                const weight = data.weight;
                const weightHtml =
                    weight?.current != null
                        ? `<div class="weight-note row-between"><div><strong>Latest weight</strong><div class="caption">${weight.logged_on ? humanDate(weight.logged_on) : "Most recent entry"}</div></div><div class="num"><strong>${fmt(weight.current, 1)} ${esc(weight.unit || "kg")}</strong>${weight.target != null ? `<div class="caption">target ${fmt(weight.target, 1)}</div>` : ""}</div></div>`
                        : "";
                const nothing =
                    meals === 0 &&
                    waters === 0 &&
                    !Object.values(totals).some((value) => Number(value) > 0);
                if (nothing) {
                    document.getElementById("root").innerHTML =
                        `<article class="card"><div class="head card-pad"><div><div class="eyebrow">Today</div><h1>Goal progress</h1><div class="meta">${esc(humanDate(data.date))}</div></div></div><div class="empty"><strong>Nothing logged yet</strong>Your first meal or water entry will appear here.</div></article>`;
                    return;
                }
                document.getElementById("root").innerHTML =
                    `<article class="card snapshot">
        <div class="head"><div class="head-main"><div class="eyebrow">Today</div><h1>Goal progress</h1><div class="meta">${esc(humanDate(data.date))} · ${meals} meal${meals === 1 ? "" : "s"} · ${waters} water entr${waters === 1 ? "y" : "ies"}</div></div></div>
        <div class="focus"><div><div class="caption">Calories</div><div class="focus-value">${fmt(totals.calories)} <span class="caption">kcal</span></div><div class="caption">${goals.calories ? `of ${fmt(goals.calories)} target` : "No calorie target set"}</div></div><span class="chip${caloriePct != null && caloriePct > 110 ? " warn" : " good"}">${caloriePct == null ? "Logged" : `${caloriePct}%`}</span></div>
        <div class="notice" style="margin-top:12px">${esc(insight)}</div>
        <div class="macro-list">${progress("Protein", totals.protein_g || 0, goals.protein_g, "g", "var(--protein)")}${progress("Carbs", totals.carbs_g || 0, goals.carbs_g, "g", "var(--carbs)")}${progress("Fat", totals.fat_g || 0, goals.fat_g, "g", "var(--fat)")}${totals.water_ml || goals.water_ml ? progress("Water", totals.water_ml || 0, goals.water_ml, "ml", "var(--water)") : ""}</div>
        ${weightHtml}
    </article>`;
            }
            initWidget({
                name: "goal-progress-widget",
                loading:
                    '<div class="card empty">Loading today’s progress…</div>',
                coerce,
                render,
                sample: SAMPLE,
            });
        </script>
    </body>
</html>
