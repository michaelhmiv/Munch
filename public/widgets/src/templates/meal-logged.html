<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Meal Logged</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .receipt {
                padding: 15px;
            }
            .receipt-main {
                min-width: 0;
            }
            .receipt-title {
                font-size: 16px;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .today-strip {
                margin-top: 12px;
                padding: 10px 12px;
                border-radius: var(--radius-sm);
                background: var(--panel-muted);
            }
            .today-strip strong {
                font-variant-numeric: tabular-nums;
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            const SAMPLE = {
                action: "logged",
                date: "2026-08-05",
                logged_meal: {
                    description: "Grilled chicken salad",
                    meal_type: "lunch",
                    calories: 520,
                    protein_g: 42,
                    carbs_g: 28,
                    fat_g: 22,
                },
                has_goals: true,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                },
                totals: {
                    calories: 1480,
                    protein_g: 118,
                    carbs_g: 165,
                    fat_g: 52,
                },
            };
            let DATA = null;
            let API = null;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.logged_meal || "has_goals" in payload)
                    return payload;
                return payload.structuredContent || null;
            }
            function render(data) {
                DATA = data;
                const meal = data.logged_meal || {};
                const action = data.action === "updated" ? "updated" : "logged";
                const title = meal.description || "Meal";
                const macros = [
                    meal.calories != null ? `${fmt(meal.calories)} kcal` : null,
                    meal.protein_g != null
                        ? `${fmt(meal.protein_g, 1)} g protein`
                        : null,
                    meal.carbs_g != null
                        ? `${fmt(meal.carbs_g, 1)} g carbs`
                        : null,
                    meal.fat_g != null ? `${fmt(meal.fat_g, 1)} g fat` : null,
                ]
                    .filter(Boolean)
                    .join(" · ");
                let today = "";
                if (data.has_goals && data.goals && data.totals) {
                    const proteinPct = pct(
                        data.totals.protein_g,
                        data.goals.protein_g,
                    );
                    const caloriePct = pct(
                        data.totals.calories,
                        data.goals.calories,
                    );
                    const focus =
                        proteinPct != null
                            ? `<strong>${fmt(data.totals.protein_g, 1)} / ${fmt(data.goals.protein_g, 1)} g protein</strong> today${proteinPct > 100 ? " · above target" : ` · ${proteinPct}%`}`
                            : caloriePct != null
                              ? `<strong>${fmt(data.totals.calories)} / ${fmt(data.goals.calories)} kcal</strong> today · ${caloriePct}%`
                              : "";
                    if (focus)
                        today = `<div class="today-strip"><div class="caption">Today after this meal</div><div>${focus}</div></div>`;
                }
                document.getElementById("root").innerHTML =
                    `<article class="card receipt" aria-label="Meal ${action}">
        <div class="row">
            <div class="icon-badge success" aria-hidden="true">✓</div>
            <div class="receipt-main">
                <div class="eyebrow">${meal.meal_type ? `${esc(meal.meal_type)} ${action}` : `Meal ${action}`}</div>
                <div class="receipt-title">${esc(title)}</div>
                ${macros ? `<div class="meta num">${esc(macros)}</div>` : '<div class="meta">Saved to your Munch log.</div>'}
            </div>
        </div>
        ${today}
        <div class="actions single"><button class="btn btn-quiet" id="adjust">Adjust meal</button></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
    </article>`;
                document
                    .getElementById("adjust")
                    ?.addEventListener("click", async () => {
                        const status = document.getElementById("status");
                        status.textContent = "Opening adjustment in chat…";
                        const prompt = `Adjust the ${meal.meal_type || "meal"} I just ${action}: ${title}. Ask me what needs to change, then update the existing meal rather than creating a duplicate.`;
                        try {
                            if (API?.canSendMessages)
                                await API.sendMessage(prompt);
                            else await API?.updateModelContext(prompt);
                            status.textContent = API?.canSendMessages
                                ? "Continue in chat to make the change."
                                : "Tell ChatGPT what should change.";
                        } catch (error) {
                            status.textContent =
                                "Tell ChatGPT what should change.";
                        }
                    });
            }
            initWidget({
                name: "meal-logged-widget",
                loading: '<div class="card empty">Saving meal…</div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
