<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Meal Logged</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .receipt {
                padding: 12px;
            }
            .receipt-main {
                min-width: 0;
                flex: 1;
            }
            .receipt-top {
                align-items: flex-start;
            }
            .receipt-title {
                margin-top: 1px;
                font-size: 15px;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .receipt-kcal {
                margin-left: auto;
                flex: 0 0 auto;
                font-size: 17px;
                font-weight: 760;
                font-variant-numeric: tabular-nums;
            }
            .macro-line {
                margin-top: 3px;
                color: var(--text-dim);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            .today-line {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 11.5px;
            }
            .today-line strong {
                color: var(--text);
                font-variant-numeric: tabular-nums;
            }
            .foods,
            .log-details {
                margin-top: 7px;
                border-top: 1px solid var(--border);
            }
            .foods > summary,
            .log-details > summary {
                min-height: 38px;
                display: flex;
                align-items: center;
                cursor: pointer;
                color: var(--text-dim);
                font-weight: 650;
                font-size: 12px;
            }
            .food-row {
                padding: 7px 0;
                border-top: 1px solid var(--border);
            }
            .food-row:first-of-type {
                border-top: 0;
            }
            .food-head {
                display: flex;
                gap: 10px;
                justify-content: space-between;
                align-items: baseline;
            }
            .food-name {
                min-width: 0;
                font-weight: 650;
                overfow-wrap: anywhere;
            }
            .food-kcal {
                flex: 0 0 auto;
                font-variant-numeric: tabular-nums;
            }
            .food-meta,
            .food-source,
            .log-detail-body {
                margin-top: 2px;
                color: var(--text-muted);
                font-size: 11.5px;
                line-height: 1.35;
            }
            .food-audit {
                margin-top: 3px;
            }
            .food-audit > summary {
                min-height: 30px;
                display: flex;
                align-items: center;
                width: fit-content;
                cursor: pointer;
                color: var(--text-muted);
                font-size: 11px;
                font-weight: 620;
            }
            .log-detail-body {
                padding: 0 0 8px;
            }
            .receipt .actions {
                margin-top: 5px;
            }
            .receipt .status:empty {
                min-height: 0;
                margin-top: 0;
            }
            @media (max-width: 420px) {
                .receipt {
                    padding: 10px;
                }
                .icon-badge {
                    width: 30px;
                    height: 30px;
                }
                .receipt-kcal {
                    font-size: 16px;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            const SAMPLE = {
                action: "logged",
                date: "2026-08-05",
                logged_meal: {
                    description:
                        "Grilled chicken breast (5 oz), mixed greens, tomato, cucumber, and vinaigrette",
                    meal_type: "lunch",
                    calories: 520,
                    protein_g: 42,
                    carbs_g: 28,
                    fat_g: 22,
                },
                meal_items: [
                    {
                        id: "sample-1",
                        position: 0,
                        name: "Grilled chicken breast",
                        quantity: 1,
                        portion_label: "5 oz",
                        nutrients: {
                            calories: 235,
                            protein_g: 44,
                            carbs_g: 0,
                            fat_g: 5,
                        },
                        source_type: "usda",
                        provider: "usda",
                        provider_food_id: "sample",
                        provider_revision: null,
                        source_url: null,
                        source_updated_at: null,
                        confidence: 0.96,
                        assumptions: [],
                        source_snapshot: {},
                    },
                ],
                has_goals: true,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                },
                totals: {
                    calories: 1480,
                    protein_g: 118,
                    carbs_g: 165,
                    fat_g: 52,
                },
            };
            let DATA = null;
            let API = null;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.logged_meal || "has_goals" in payload)
                    return payload;
                return payload.structuredContent || null;
            }
            function sourceLabel(item) {
                if (item.source_type === "usda") return "USDA";
                if (item.source_type === "open_food_facts")
                    return "Open Food Facts";
                if (item.source_type === "published_restaurant")
                    return "Restaurant nutrition";
                if (item.source_type === "saved_food") return "Saved food";
                if (item.source_type === "past_meal") return "Past meal";
                if (item.source_type === "model_estimate")
                    return "Estimated";
                if (
                    item.source_type === "user_supplied" &&
                    item.source_snapshot?.resolution_layer === "external_web"
                )
                    return item.provider
                        ? `External · ${item.provider.replaceAll("_", " ")}`
                        : "External source";
                if (item.source_type === "user_supplied")
                    return "Provided data";
                return item.provider || "Recorded source";
            }
            function itemRows(items) {
                if (!items.length) return "";
                return `<details class="foods"><summary>View ${items.length} food${items.length === 1 ? "" : "s"}</summary>${items
                    .map((item) => {
                        const n = item.nutrients || {};
                        const macro = [
                            n.protein_g != null
                                ? `${fmt(n.protein_g, 1)}P`
                                : null,
                            n.carbs_g != null ? `${fmt(n.carbs_g, 1)}C` : null,
                            n.fat_g != null ? `${fmt(n.fat_g, 1)}F` : null,
                        ]
                            .filter(Boolean)
                            .join(" · ");
                        const confidence =
                            item.confidence == null
                                ? ""
                                : `${Math.round(item.confidence * 100)}% confidence`;
                        const assumptions = Array.isArray(item.assumptions)
                            ? item.assumptions
                            : [];
                        const audit = [sourceLabel(item), confidence]
                            .filter(Boolean)
                            .join(" · ");
                        return `<div class="food-row">
                            <div class="food-head"><div class="food-name">${esc(item.name || "Food")}</div>${n.calories != null ? `<div class="food-kcal">${fmt(n.calories)} kcal</div>` : ""}</div>
                            <div class="food-meta">${esc(item.portion_label || (item.quantity != null ? `Qty ${fmt(item.quantity, 1)}` : "Portion recorded"))}${macro ? ` · ${esc(macro)}` : ""}</div>
                            <details class="food-audit"><summary>Source & estimate</summary><div class="food-source">${esc(audit)}${assumptions.length ? `<br />${assumptions.map((value) => esc(value)).join(" · ")}` : ""}</div></details>
                        </div>`;
                    })
                    .join("")}</details>`;
            }
            function render(data) {
                DATA = data;
                const meal = data.logged_meal || {};
                const items = Array.isArray(data.meal_items)
                    ? data.meal_items
                    : [];
                const structured = items.length > 0;
                const action = data.action === "updated" ? "updated" : "logged";
                const originalTitle = meal.description || "Meal";
                const title = structured
                    ? `${items.length} food${items.length === 1 ? "" : "s"}`
                    : originalTitle;
                const macroLine = [
                    meal.protein_g != null
                        ? `P ${fmt(meal.protein_g, 1)}g`
                        : null,
                    meal.carbs_g != null ? `C ${fmt(meal.carbs_g, 1)}g` : null,
                    meal.fat_g != null ? `F ${fmt(meal.fat_g, 1)}g` : null,
                ]
                    .filter(Boolean)
                    .join(" · ");
                let today = "";
                if (data.has_goals && data.goals && data.totals) {
                    const proteinPct = pct(
                        data.totals.protein_g,
                        data.goals.protein_g,
                    );
                    const caloriePct = pct(
                        data.totals.calories,
                        data.goals.calories,
                    );
                    if (proteinPct != null) {
                        today = `<div class="today-line"><span>Today · protein</span><strong>${fmt(data.totals.protein_g, 1)} / ${fmt(data.goals.protein_g, 1)} g</strong></div>`;
                    } else if (caloriePct != null) {
                        today = `<div class="today-line"><span>Today · calories</span><strong>${fmt(data.totals.calories)} / ${fmt(data.goals.calories)} kcal</strong></div>`;
                    }
                }
                const logDetails = structured
                    ? `<details class="log-details"><summary>Log details</summary><div class="log-detail-body">${esc(originalTitle)}</div></details>`
                    : "";
                document.getElementById("root").innerHTML =
                    `<article class="card receipt" aria-label="Meal ${action}">
        <div class="row receipt-top">
            <div class="icon-badge success" aria-hidden="true">✓</div>
            <div class="receipt-main">
                <div class="eyebrow">${meal.meal_type ? `${esc(meal.meal_type)} ${action}` : `Meal ${action}`}</div>
                <div class="receipt-title">${esc(title)}</div>
                ${macroLine ? `<div class="macro-line">${esc(macroLine)}</div>` : ""}
            </div>
            ${meal.calories != null ? `<div class="receipt-kcal">${fmt(meal.calories)} kcal</div>` : ""}
        </div>
        ${itemRows(items)}
        ${logDetails}
        ${today}
        <div class="actions single"><button class="btn btn-quiet" id="adjust">Adjust meal</button></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
    </article>`;
                document
                    .getElementById("adjust")
                    ?.addEventListener("click", async () => {
                        const status = document.getElementById("status");
                        status.textContent = "Opening adjustment in chat…";
                        const prompt = `Adjust the ${meal.meal_type || "meal"} I just ${action}: ${originalTitle}. Ask me what needs to change, then update the existing meal rather than creating a duplicate.`;
                        try {
                            if (API?.canSendMessages)
                                await API.sendMessage(prompt);
                            else await API?.updateModelContext(prompt);
                            status.textContent = API?.canSendMessages
                                ? "Continue in chat to make the change."
                                : "Tell ChatGPT what should change.";
                        } catch (error) {
                            status.textContent =
                                "Tell ChatGPT what should change.";
                        }
                    });
            }
            initWidget({
                name: "meal-logged-widget",
                loading: '<div class="card empty">Saving meal… </div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
