<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Weight Trends</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .weight-card {
                padding: 15px;
            }
            .hero {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 8px;
            }
            .hero-value {
                font-size: 29px;
                line-height: 1;
                font-weight: 760;
                letter-spacing: -0.03em;
                font-variant-numeric: tabular-nums;
            }
            .range-controls {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 14px;
            }
            .range-controls .btn[aria-pressed="true"] {
                background: var(--accent);
                color: var(--accent-contrast);
                border-color: var(--accent);
            }
            .history {
                display: grid;
                grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
                gap: 20px;
                margin-top: 18px;
            }
            @media (max-width: 700px) {
                .history {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            function sample() {
                const days = [];
                for (let i = 30; i >= 0; i -= 2) {
                    const d = new Date("2026-08-05T12:00:00Z");
                    d.setUTCDate(d.getUTCDate() - i);
                    days.push({
                        date: d.toISOString().slice(0, 10),
                        weight: 82.4 - (30 - i) * 0.11 + Math.sin(i) * 0.15,
                    });
                }
                return {
                    end_date: "2026-08-05",
                    unit: "kg",
                    target: 78,
                    default_range: 30,
                    days,
                };
            }
            const SAMPLE = sample();
            let DATA = null,
                API = null,
                RANGE = 30;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                return payload.structuredContent || null;
            }
            function shift(date, days) {
                const d = new Date(`${date}T12:00:00`);
                d.setDate(d.getDate() + days);
                return d.toISOString().slice(0, 10);
            }
            function currentSlice() {
                const all = DATA.days
                    .slice()
                    .sort((a, b) => a.date.localeCompare(b.date));
                const end = DATA.end_date || all[all.length - 1]?.date;
                const cutoff = shift(end, -(RANGE - 1));
                return all.filter((day) => day.date >= cutoff);
            }
            function paint() {
                const slice = currentSlice();
                if (!slice.length) {
                    document.getElementById("root").innerHTML =
                        '<article class="card empty"><strong>No weigh-ins in this range</strong>Try a wider range or log a new weight.</article>';
                    return;
                }
                const first = Number(slice[0].weight),
                    latest = Number(slice[slice.length - 1].weight),
                    change = latest - first,
                    target = DATA.target ?? null,
                    unit = DATA.unit || "kg";
                const toward =
                    target == null
                        ? null
                        : Math.abs(latest - target) < Math.abs(first - target);
                const distance = target == null ? null : latest - target;
                const points = slice.map((day) => ({
                    value: Number(day.weight),
                }));
                const rows = slice
                    .slice()
                    .reverse()
                    .map(
                        (day) =>
                            `<tr><td>${esc(humanDate(day.date))}</td><td class="num"><strong>${fmt(day.weight, 1)} ${esc(unit)}</strong></td></tr>`,
                    )
                    .join("");
                const controls = [7, 14, 30]
                    .map(
                        (range) =>
                            `<button class="btn btn-sm" data-range="${range}" aria-pressed="${RANGE === range}">${range} days</button>`,
                    )
                    .join("");
                document.getElementById("root").innerHTML =
                    `<article class="card weight-card"><div class="head"><div class="head-main"><div class="eyebrow">Weight</div><h1>${RANGE}-day trend</h1><div class="meta">${slice.length} weigh-in${slice.length === 1 ? "" : "s"} · ${esc(humanRange(slice[0].date, slice[slice.length - 1].date))}</div></div><button class="btn btn-sm inline-only" id="explore">Explore history</button></div><div class="fullscreen-only range-controls">${controls}</div>
 <div class="hero"><div><div class="caption">Latest</div><div class="hero-value">${fmt(latest, 1)} <span class="caption">${esc(unit)}</span></div></div><span class="chip${toward === true ? " good" : toward === false ? " warn" : ""}">${change === 0 ? "No change" : `${change > 0 ? "+" : "−"}${fmt(Math.abs(change), 1)} ${esc(unit)}`}</span></div>
 ${sparkline(points, { goal: target, label: `Weight over ${RANGE} days` })}<div class="row-between caption"><span>${esc(humanDate(slice[0].date))}</span><span>${target != null ? `target ${fmt(target, 1)} ${esc(unit)}` : "No target set"}</span><span>${esc(humanDate(slice[slice.length - 1].date))}</span></div>
 <div class="metrics" style="margin-top:12px">${metric("Latest", fmt(latest, 1), unit)}${metric("Change", `${change > 0 ? "+" : change < 0 ? "−" : ""}${fmt(Math.abs(change), 1)}`, unit)}${metric("Target", target == null ? "—" : fmt(target, 1), target == null ? "" : unit)}${metric("To target", distance == null ? "—" : fmt(Math.abs(distance), 1), distance == null ? "" : unit)}</div>
 <div class="notice" style="margin-top:12px">${target == null ? "Set a target to measure direction without labeling weight gain or loss as inherently good or bad." : Math.abs(distance) < 0.05 ? "Latest weight is at the saved target." : `${fmt(Math.abs(distance), 1)} ${esc(unit)} ${distance > 0 ? "above" : "below"} target${toward == null ? "" : toward ? " and moving toward it." : " and moving away from it in this window."}`}</div>
 <div class="fullscreen-only"><div class="history"><div><h2>Weight history</h2><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Weight</th></tr></thead><tbody>${rows}</tbody></table></div></div><div><h2>Interpretation</h2><div class="stack" style="margin-top:12px"><div class="notice">Daily weight fluctuates. Use the multi-day direction rather than a single reading.</div>${target != null ? progress("Distance closed", Math.max(0, Math.abs(first - target) - Math.abs(latest - target)), Math.abs(first - target) || 1, unit, "var(--accent)") : ""}</div></div></div><div class="actions"><button class="btn" id="close">Return to chat</button></div></div></article>`;
                document
                    .getElementById("explore")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("fullscreen"),
                    );
                document
                    .getElementById("close")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("inline"),
                    );
                document.querySelectorAll("[data-range]").forEach((button) =>
                    button.addEventListener("click", () => {
                        RANGE = Number(button.dataset.range);
                        paint();
                    }),
                );
            }
            function render(data) {
                DATA = data;
                RANGE = [7, 14, 30].includes(Number(data.default_range))
                    ? Number(data.default_range)
                    : 30;
                paint();
            }
            initWidget({
                name: "weight-trends-widget",
                displayModes: ["inline", "fullscreen"],
                loading: '<div class="card empty">Loading weight trends…</div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
                onHostContext() {
                    if (DATA) paint();
                },
            });
        </script>
    </body>
</html>
