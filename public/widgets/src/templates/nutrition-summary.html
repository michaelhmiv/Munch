<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nutrition Summary</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .summary {
                padding: 15px;
            }
            .coverage {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 12px;
            }
            .detail-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(260px, 0.8fr);
                gap: 18px;
                margin-top: 18px;
            }
            .day-list {
                display: grid;
                gap: 7px;
            }
            .day-row {
                display: grid;
                grid-template-columns: 92px 1fr auto;
                gap: 10px;
                align-items: center;
                padding: 9px 0;
                border-bottom: 1px solid var(--panel-border);
            }
            .day-row:last-child {
                border-bottom: 0;
            }
            @media (max-width: 700px) {
                .detail-grid {
                    grid-template-columns: 1fr;
                }
                .day-row {
                    grid-template-columns: 74px 1fr auto;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            const SAMPLE = {
                start_date: "2026-07-30",
                end_date: "2026-08-05",
                logged_days: 6,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                },
                averages: {
                    calories: 2035,
                    protein_g: 148,
                    carbs_g: 205,
                    fat_g: 74,
                },
                days: [
                    {
                        date: "2026-07-30",
                        meal_count: 4,
                        calories: 2180,
                        protein_g: 155,
                    },
                    {
                        date: "2026-07-31",
                        meal_count: 3,
                        calories: 1890,
                        protein_g: 138,
                    },
                    {
                        date: "2026-08-01",
                        meal_count: 4,
                        calories: 2035,
                        protein_g: 151,
                    },
                    {
                        date: "2026-08-02",
                        meal_count: 4,
                        calories: 2260,
                        protein_g: 163,
                    },
                    {
                        date: "2026-08-03",
                        meal_count: 3,
                        calories: 1940,
                        protein_g: 142,
                    },
                    {
                        date: "2026-08-05",
                        meal_count: 4,
                        calories: 1905,
                        protein_g: 139,
                    },
                ],
            };
            let DATA = null;
            let API = null;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.averages || Array.isArray(payload.days))
                    return payload;
                return payload.structuredContent || null;
            }
            function observation(data) {
                const avg = data.averages || {};
                const goals = data.goals || {};
                const proteinDelta =
                    goals.protein_g != null
                        ? avg.protein_g - goals.protein_g
                        : null;
                const caloriesDelta =
                    goals.calories != null
                        ? avg.calories - goals.calories
                        : null;
                if (proteinDelta != null && Math.abs(proteinDelta) >= 5)
                    return `Protein averaged ${fmt(Math.abs(proteinDelta), 1)} g ${proteinDelta < 0 ? "below" : "above"} target.`;
                if (caloriesDelta != null && Math.abs(caloriesDelta) >= 75)
                    return `Calories averaged ${fmt(Math.abs(caloriesDelta))} kcal ${caloriesDelta < 0 ? "below" : "above"} target.`;
                return "Logged-day averages were close to the selected targets.";
            }
            function render(data) {
                DATA = data;
                const days = Array.isArray(data.days)
                    ? data.days
                          .slice()
                          .sort((a, b) => a.date.localeCompare(b.date))
                    : [];
                if (!days.length) {
                    document.getElementById("root").innerHTML =
                        '<article class="card empty"><strong>No nutrition data in this range</strong>Log a meal or choose another date range.</article>';
                    return;
                }
                const avg = data.averages || {};
                const rangeDays = Math.max(
                    1,
                    Math.round(
                        (new Date(`${data.end_date}T12:00:00`) -
                            new Date(`${data.start_date}T12:00:00`)) /
                            86400000,
                    ) + 1,
                );
                const logged =
                    data.logged_days ??
                    days.filter((day) => Number(day.meal_count || 0) > 0)
                        .length;
                const points = days.map((day) => ({
                    value: day.calories || 0,
                }));
                const dayRows = days
                    .map(
                        (day) =>
                            `<div class="day-row"><span class="caption">${esc(humanDate(day.date))}</span><span>${Number(day.meal_count || 0)} meal${Number(day.meal_count || 0) === 1 ? "" : "s"}</span><strong class="num">${fmt(day.calories)} kcal</strong></div>`,
                    )
                    .join("");
                document.getElementById("root").innerHTML =
                    `<article class="card summary">
        <div class="head"><div class="head-main"><div class="eyebrow">Range summary</div><h1>Nutrition summary</h1><div class="meta">${esc(humanRange(data.start_date, data.end_date))}</div></div><button class="btn btn-sm" id="details">Explore summary</button></div>
        <div class="coverage"><span class="caption">Data coverage</span><span class="chip${logged < rangeDays * 0.7 ? " warn" : " good"}">${logged} of ${rangeDays} days logged</span></div>
        <div class="metrics">${nutrientMetrics(avg)}</div>
        <div style="margin-top:12px">${sparkline(points, { goal: data.goals?.calories, label: "Calories by logged day" })}<div class="row-between caption"><span>${esc(humanDate(days[0].date))}</span><span>${esc(humanDate(days[days.length - 1].date))}</span></div></div>
        <div class="notice" style="margin-top:12px">${esc(observation(data))}</div>
        <div class="fullscreen-only"><div class="detail-grid"><div><h2>Daily calories</h2><div class="day-list">${dayRows}</div></div><div><h2>Average versus target</h2><div class="stack" style="margin-top:12px">${progress("Calories", avg.calories || 0, data.goals?.calories, "kcal", "var(--calories)")}${progress("Protein", avg.protein_g || 0, data.goals?.protein_g, "g", "var(--protein)")}${progress("Carbs", avg.carbs_g || 0, data.goals?.carbs_g, "g", "var(--carbs)")}${progress("Fat", avg.fat_g || 0, data.goals?.fat_g, "g", "var(--fat)")}</div></div></div><div class="actions"><button class="btn" id="close">Return to chat</button></div></div>
    </article>`;
                document
                    .getElementById("details")
                    ?.addEventListener("click", async () => {
                        const result = await API?.requestDisplayMode(
                            "fullscreen",
                        ).catch(() => null);
                        if (!result || result.unsupported)
                            document.getElementById("details").textContent =
                                "Details unavailable";
                    });
                document
                    .getElementById("close")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("inline"),
                    );
            }
            initWidget({
                name: "nutrition-summary-widget",
                displayModes: ["inline", "fullscreen"],
                loading:
                    '<div class="card empty">Loading nutrition summary…</div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
