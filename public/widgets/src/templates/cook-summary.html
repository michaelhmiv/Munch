<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cook History</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .cook-card {
                padding: 12px;
            }
            .cook-title {
                min-width: 0;
            }
            .cook-title h1 {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .cook-status {
                flex: 0 0 auto;
            }
            .cook-status.active {
                color: var(--accent);
            }
            .cook-status.finished {
                color: var(--text-dim);
            }
            .cook-meta {
                margin-top: 3px;
            }
            .cook-summary {
                margin-top: 10px;
                color: var(--text-dim);
            }
            .cook-photos {
                display: flex;
                gap: 7px;
                overflow-x: auto;
                margin-top: 10px;
            }
            .cook-photos img {
                width: 72px;
                height: 72px;
                object-fit: cover;
                border-radius: 9px;
                border: 1px solid var(--panel-border);
                flex: 0 0 auto;
            }
            .cook-detail {
                margin-top: 9px;
                border-top: 1px solid var(--border);
            }
            .cook-detail > summary {
                min-height: 42px;
                display: flex;
                align-items: center;
                cursor: pointer;
                color: var(--text-dim);
                font-size: 12px;
                font-weight: 650;
            }
            .cook-section {
                padding: 7px 0;
                border-top: 1px solid var(--border);
            }
            .cook-section:first-child {
                border-top: 0;
            }
            .cook-event {
                display: grid;
                grid-template-columns: 92px 1fr;
                gap: 9px;
                padding: 5px 0;
            }
            .cook-event time {
                color: var(--text-dim);
                font-size: 11px;
            }
            .cook-event p {
                margin: 0;
                overflow-wrap: anywhere;
            }
            .cook-note {
                color: var(--text-dim);
                font-size: 12px;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
            .cook-empty {
                padding: 14px;
            }
            .cook-update {
                display: grid;
                gap: 7px;
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid var(--border);
            }
            .cook-update textarea {
                width: 100%;
                min-height: 54px;
                resize: vertical;
            }
            .cook-update-status {
                color: var(--text-dim);
                font-size: 12px;
                min-height: 16px;
            }
            @media (max-width: 420px) {
                .cook-event {
                    grid-template-columns: 1fr;
                    gap: 1px;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            let API = null;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                return payload.structuredContent || payload;
            }
            function detail(data) {
                if (data?.cook?.cook && data.cook.dishes) return data.cook;
                if (data?.cook?.cook && data.cook.events) return data.cook;
                return data?.cook?.cook ? data.cook : data;
            }
            function render(data) {
                const value = detail(data);
                const cook = value?.cook || value;
                if (!cook || !cook.title) {
                    document.getElementById("root").innerHTML =
                        '<article class="card cook-empty"><strong>No cook selected</strong><div class="caption">Search or record a cook to see its history.</div></article>';
                    return;
                }
                const events = Array.isArray(value.events) ? value.events : [];
                const dishes = Array.isArray(value.dishes) ? value.dishes : [];
                const outcomes = Array.isArray(value.outcomes)
                    ? value.outcomes
                    : [];
                const media = Array.isArray(value.media) ? value.media : [];
                const photos = media
                    .map(
                        (photo) =>
                            `<img src="${esc(photo.url)}" alt="${esc(photo.caption || photo.file_name || "Cook photo")}" loading="lazy" />`,
                    )
                    .join("");
                const timeline = events.length
                    ? events
                          .map(
                              (event) =>
                                  `<div class="cook-event"><time>${esc(event.time_precision === "unknown" || !event.event_at ? event.relative_phrase || "Time unknown" : humanDate(event.event_at))} ${esc(event.time_precision === "approximate" ? "(approx.)" : "")}</time><p><strong>${esc(String(event.event_type).replaceAll("_", " "))}</strong>${event.note ? ` · ${esc(event.note)}` : ""}${event.setpoint_temperature != null ? ` · setpoint ${esc(event.setpoint_temperature)}°${esc(event.setpoint_unit || "")}` : ""}${event.ambient_temperature != null ? ` · environment ${esc(event.ambient_temperature)}°${esc(event.ambient_unit || "")}` : ""}${event.internal_temperature != null ? ` · internal ${esc(event.internal_temperature)}°${esc(event.internal_unit || "")}` : ""}</p></div>`,
                          )
                          .join("")
                    : '<div class="cook-note">No timeline events recorded yet.</div>';
                const outcome =
                    outcomes.find((item) => item.dish_id == null) ||
                    outcomes[0];
                document.getElementById("root").innerHTML =
                    `<article class="card cook-card"><div class="row-between"><div class="cook-title"><div class="eyebrow">${esc(cook.status === "active" ? "Active cook" : "Completed cook")}</div><h1>${esc(cook.title)}</h1><div class="meta cook-meta">${esc(humanDate(cook.cook_date))} · ${dishes.length} dish${dishes.length === 1 ? "" : "es"}</div></div><div class="chip cook-status ${esc(cook.status)}">${esc(cook.status)}</div></div>${cook.notes ? `<div class="cook-summary">${esc(cook.notes)}</div>` : ""}${photos ? `<div class="cook-photos" aria-label="Saved cook photos">${photos}</div>` : ""}<details class="cook-detail"><summary>Timeline · ${events.length} event${events.length === 1 ? "" : "s"}</summary><div class="cook-section">${timeline}</div>${outcome ? `<div class="cook-section"><strong>Result</strong><div class="cook-note">${esc(outcome.written_feedback || outcome.next_time_notes || "Result recorded")}</div></div>` : ""}</details>${cook.id ? `<form class="cook-update" id="cook-widget-update"><label class="field-label" for="cook-widget-message">Add an update</label><textarea id="cook-widget-message" placeholder="What happened? (optional if you add a photo)"></textarea><input id="cook-widget-photo" type="file" accept="image/jpeg,image/png,image/webp" /><div class="actions"><button class="btn btn-primary" type="submit">Save update</button><span class="cook-update-status" id="cook-widget-status" role="status"></span></div></form>` : ""}<div class="actions single"><button class="btn btn-quiet" id="expand">Open full cook</button></div></article>`;
                document
                    .getElementById("expand")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("fullscreen"),
                    );
                document
                    .getElementById("cook-widget-update")
                    ?.addEventListener("submit", async (event) => {
                        event.preventDefault();
                        const status =
                            document.getElementById("cook-widget-status");
                        const message = document
                            .getElementById("cook-widget-message")
                            ?.value.trim();
                        const input =
                            document.getElementById("cook-widget-photo");
                        const file = input?.files?.[0];
                        if (!message && !file) {
                            if (status)
                                status.textContent =
                                    "Add a note or photo first.";
                            return;
                        }
                        if (!API?.canCallTools || !window.openai?.uploadFile) {
                            if (status)
                                status.textContent =
                                    "This host cannot save widget uploads. Continue in chat or Munch.";
                            return;
                        }
                        const button =
                            event.currentTarget.querySelector("button");
                        if (button) button.disabled = true;
                        if (status) status.textContent = "Saving…";
                        try {
                            let files = [];
                            if (file) {
                                const uploaded = await window.openai.uploadFile(
                                    file,
                                    {
                                        library: true,
                                    },
                                );
                                const downloaded =
                                    await window.openai.getFileDownloadUrl({
                                        fileId: uploaded.fileId,
                                    });
                                files = [
                                    {
                                        download_url: downloaded.downloadUrl,
                                        file_id: uploaded.fileId,
                                        mime_type: file.type,
                                        file_name: file.name,
                                    },
                                ];
                            }
                            await API.callTool("update_cook", {
                                cook_id: cook.id,
                                message: message || "Photo update",
                                files,
                                request_id: `widget-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                            });
                            if (status) status.textContent = "Update saved.";
                            const messageInput = document.getElementById(
                                "cook-widget-message",
                            );
                            if (messageInput) messageInput.value = "";
                            if (input) input.value = "";
                        } catch (error) {
                            if (status)
                                status.textContent =
                                    error?.message ||
                                    "The update could not be saved; retry without closing this card.";
                        } finally {
                            if (button) button.disabled = false;
                        }
                    });
            }
            initWidget({
                name: "cook-summary-widget",
                displayModes: ["inline", "fullscreen"],
                loading:
                    '<div class="card cook-empty">Loading cook history…</div>',
                coerce,
                render,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
