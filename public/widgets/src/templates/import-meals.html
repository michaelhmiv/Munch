<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Import Meals</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/

            .launch {
                display: grid;
                gap: 14px;
                padding: 18px;
            }
            .launch-copy {
                display: grid;
                gap: 4px;
            }
            .launch-title {
                font-size: 17px;
                font-weight: 700;
                letter-spacing: -0.015em;
            }
            .source-list {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .source-chip {
                border: 1px solid var(--panel-border);
                border-radius: 999px;
                padding: 3px 8px;
                color: var(--text-dim);
                font-size: 11px;
            }
            .import-shell {
                display: grid;
                gap: 14px;
                padding: 16px;
            }
            .stepper {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 6px;
            }
            .step {
                display: grid;
                gap: 4px;
                min-width: 0;
                color: var(--text-dim);
                font-size: 11px;
            }
            .step::before {
                content: "";
                display: block;
                height: 4px;
                border-radius: 999px;
                background: var(--track);
            }
            .step.active,
            .step.done {
                color: var(--text);
                font-weight: 650;
            }
            .step.active::before,
            .step.done::before {
                background: var(--accent);
            }
            .drop {
                position: relative;
                display: grid;
                place-items: center;
                min-height: 178px;
                padding: 24px;
                text-align: center;
                border: 1.5px dashed var(--panel-border);
                border-radius: var(--radius);
                background: var(--panel);
                cursor: pointer;
            }
            .drop:hover,
            .drop.over,
            .drop:focus-within {
                border-color: var(--accent);
                background: var(--accent-soft);
            }
            .drop input {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                opacity: 0;
            }
            .drop strong {
                display: block;
                margin-bottom: 4px;
                font-size: 15px;
            }
            .mapping {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }
            .field-note {
                overflow: hidden;
                color: var(--text-dim);
                font-size: 11px;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .preview-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            .preview-table th,
            .preview-table td {
                padding: 9px 8px;
                text-align: left;
                border-bottom: 1px solid var(--panel-border);
                vertical-align: top;
            }
            .preview-table th {
                color: var(--text-dim);
                font-size: 10.5px;
                font-weight: 650;
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }
            .preview-table .num {
                text-align: right;
                white-space: nowrap;
            }
            .preview-wrap {
                overflow-x: auto;
                border: 1px solid var(--panel-border);
                border-radius: var(--radius-sm);
            }
            .preview-wrap .preview-table {
                min-width: 620px;
            }
            .result-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
            }
            .result-stat {
                padding: 12px;
                border: 1px solid var(--panel-border);
                border-radius: var(--radius-sm);
                background: var(--panel);
            }
            .result-stat strong {
                display: block;
                font-size: 20px;
                letter-spacing: -0.025em;
            }
            .result-stat span {
                color: var(--text-dim);
                font-size: 11px;
            }
            @media (max-width: 620px) {
                .mapping,
                .result-grid {
                    grid-template-columns: 1fr;
                }
                .step span {
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            /*@inlinets src/csv.ts@*/

            const FIELDS = [
                { key: "logged_at", label: "Date", required: true },
                { key: "time", label: "Time" },
                { key: "description", label: "Food name" },
                { key: "meal_type", label: "Meal type" },
                { key: "calories", label: "Calories" },
                { key: "protein_g", label: "Protein (g)" },
                { key: "carbs_g", label: "Carbs (g)" },
                { key: "fat_g", label: "Fat (g)" },
                { key: "fiber_g", label: "Fiber (g)" },
                { key: "sugar_g", label: "Total sugar (g)" },
                { key: "alcohol_g", label: "Alcohol (g)", alcoholOnly: true },
                { key: "notes", label: "Notes" },
                { key: "deleted", label: "Deleted flag" },
            ];
            const ALIASES = {
                logged_at: ["date", "day", "logged_at", "timestamp", "datum"],
                time: ["time", "uhrzeit"],
                description: [
                    "food",
                    "food_name",
                    "description",
                    "name",
                    "item",
                    "lebensmittel",
                ],
                meal_type: ["meal", "meal_type", "type", "group", "mahlzeit"],
                calories: [
                    "calories",
                    "energy_kcal",
                    "energy",
                    "kcal",
                    "kalorien",
                ],
                protein_g: ["protein_g", "protein", "eiweiss"],
                carbs_g: [
                    "carbs_g",
                    "carbohydrates_g",
                    "carbs",
                    "carbohydrates",
                    "kohlenhydrate",
                ],
                fat_g: ["fat_g", "fat", "total_fat", "fett"],
                fiber_g: [
                    "fiber_g",
                    "fiber",
                    "fibre_g",
                    "fibre",
                    "dietary_fiber",
                    "ballaststoffe",
                ],
                sugar_g: [
                    "sugar_g",
                    "sugar",
                    "sugars",
                    "total_sugar",
                    "total_sugars",
                    "zucker",
                ],
                alcohol_g: [
                    "alcohol_g",
                    "alcohol",
                    "alcohol_ethyl",
                    "ethanol",
                    "ethanol_g",
                    "alkohol",
                ],
                notes: ["note", "notes", "comment", "kommentar"],
                deleted: ["deleted"],
            };
            const DATE_FORMATS = [
                ["iso", "Year-month-day (2026-08-05)"],
                ["mdy", "Month/day/year (08/05/2026)"],
                ["dmy", "Day/month/year (05/08/2026)"],
            ];

            let API = null;
            let CFG = {
                tz: "UTC",
                tz_configured: true,
                max_rows_per_call: 50,
                import_tool_name: "bulk_import_meals",
                known_source_apps: [
                    "MyFitnessPal",
                    "Cronometer",
                    "Lose It!",
                    "MacroFactor",
                ],
                drink_unit: null,
            };
            const S = {
                step: "launch",
                table: null,
                mapping: {},
                dateFormat: "iso",
                dateAmbiguous: false,
                energyUnit: "kcal",
                sourceApp: "",
                rows: [],
                skipped: 0,
                errors: [],
                warnings: [],
                busy: false,
                progress: null,
                result: null,
                fileName: "",
            };

            function alcoholTracked() {
                return CFG.drink_unit === "us" || CFG.drink_unit === "uk";
            }
            function visibleFields() {
                return FIELDS.filter(
                    (field) => !field.alcoholOnly || alcoholTracked(),
                );
            }
            function currentStepIndex() {
                return (
                    { file: 0, map: 1, preview: 2, importing: 3, done: 3 }[
                        S.step
                    ] ?? 0
                );
            }
            function stepper() {
                const labels = ["File", "Map", "Preview", "Import"];
                const active = currentStepIndex();
                return `<div class="stepper" aria-label="Import progress">${labels
                    .map(
                        (label, index) =>
                            `<div class="step ${index < active ? "done" : index === active ? "active" : ""}"><span>${label}</span></div>`,
                    )
                    .join("")}</div>`;
            }
            function sources() {
                return (CFG.known_source_apps || [])
                    .slice(0, 6)
                    .map(
                        (source) =>
                            `<span class="source-chip">${esc(source)}</span>`,
                    )
                    .join("");
            }
            function launchView() {
                return `<div class="card launch">
                    <div class="launch-copy">
                        <div class="eyebrow">Meal history</div>
                        <div class="launch-title">Import an export file</div>
                        <div class="muted">Review the detected columns and problem rows before anything is saved.</div>
                    </div>
                    <div class="source-list">${sources()}</div>
                    <div class="actions"><button class="btn btn-primary" id="open-importer">Open importer</button></div>
                </div>`;
            }
            function fileView() {
                const tzWarning = CFG.tz_configured
                    ? ""
                    : `<div class="notice warning"><strong>Timezone needed.</strong> Dates without an offset will be interpreted as UTC. Set your timezone in chat before importing if that could shift meals to another day.</div>`;
                return `${stepper()}<section class="card section-stack">
                    <div><div class="eyebrow">Choose file</div><h1 class="title">Import meal history</h1><p class="subtitle">CSV exports are read locally in this view. Nothing is saved until the preview is confirmed.</p></div>
                    ${tzWarning}
                    ${S.errors.length ? `<div class="notice danger">${esc(S.errors[0])}</div>` : ""}
                    <label class="drop" id="drop"><span><strong>Choose a CSV file</strong><span class="muted">or drag it here</span></span><input id="file" type="file" accept=".csv,text/csv,text/plain" /></label>
                    <div class="muted small">Supported automatically: MyFitnessPal, Cronometer, Lose It!, MacroFactor, and similar tabular exports.</div>
                    <div class="actions"><button class="btn btn-ghost" id="close-importer">Return to chat</button></div>
                </section>`;
            }
            function optionList(selected) {
                return `<option value="-1">Not in file</option>${S.table.headers
                    .map(
                        (header, index) =>
                            `<option value="${index}" ${selected === index ? "selected" : ""}>${esc(header || `Column ${index + 1}`)}</option>`,
                    )
                    .join("")}`;
            }
            function mappingView() {
                const fields = visibleFields()
                    .map((field) => {
                        const index = S.mapping[field.key] ?? -1;
                        const sample =
                            index >= 0 ? S.table.rows[0]?.[index] || "" : "";
                        return `<label class="field"><span class="label">${esc(field.label)}${field.required ? " *" : ""}</span><select class="select map-select" data-field="${field.key}">${optionList(index)}</select><span class="field-note">${sample ? `Example: ${esc(sample)}` : "No value detected"}</span></label>`;
                    })
                    .join("");
                const dateWarning = S.dateAmbiguous
                    ? `<div class="notice warning"><strong>Confirm the date order.</strong> The values can be read more than one way; the selection below controls where every meal lands.</div>`
                    : "";
                const alcoholNotice =
                    !alcoholTracked() &&
                    findColumn(S.table.headers, ALIASES.alcohol_g) >= 0
                        ? `<div class="notice"><strong>Alcohol column excluded.</strong> Alcohol tracking is off, so this column will not be imported. Turn tracking on in chat before importing to retain it.</div>`
                        : "";
                return `${stepper()}<section class="card section-stack">
                    <div><div class="eyebrow">Detected ${fmt(S.table.rows.length)} rows</div><h1 class="title">Review column mapping</h1><p class="subtitle">Munch matched the common fields. Correct only what is wrong or missing.</p></div>
                    ${S.table.warnings.map((warning) => `<div class="notice warning">${esc(warning)}</div>`).join("")}
                    ${dateWarning}${alcoholNotice}
                    <div class="mapping">${fields}</div>
                    <div class="mapping">
                        <label class="field"><span class="label">Date format</span><select class="select" id="date-format">${DATE_FORMATS.map(([value, label]) => `<option value="${value}" ${S.dateFormat === value ? "selected" : ""}>${label}</option>`).join("")}</select></label>
                        <label class="field"><span class="label">Energy unit</span><select class="select" id="energy-unit"><option value="kcal" ${S.energyUnit === "kcal" ? "selected" : ""}>Calories (kcal)</option><option value="kj" ${S.energyUnit === "kj" ? "selected" : ""}>Kilojoules (kJ)</option></select></label>
                        <label class="field"><span class="label">Source app (optional)</span><input class="input" id="source-app" value="${esc(S.sourceApp)}" placeholder="Example: MyFitnessPal" /></label>
                    </div>
                    ${S.errors.length ? `<div class="notice danger">${esc(S.errors[0])}</div>` : ""}
                    <div class="actions"><button class="btn btn-primary" id="to-preview">Preview import</button><button class="btn" id="back-file">Choose another file</button></div>
                </section>`;
            }
            function previewView() {
                const rows = S.rows.slice(0, 12);
                const totalKcal = S.rows.reduce(
                    (sum, row) => sum + (row.calories || 0),
                    0,
                );
                return `${stepper()}<section class="card section-stack">
                    <div><div class="eyebrow">Ready to review</div><h1 class="title">${fmt(S.rows.length)} meals ready</h1><p class="subtitle">${fmt(totalKcal)} kcal across valid rows. ${S.skipped ? `${fmt(S.skipped)} rows will be skipped.` : "No rows will be skipped."}</p></div>
                    ${S.warnings.map((warning) => `<div class="notice warning">${esc(warning)}</div>`).join("")}
                    ${S.errors.length ? `<div class="notice danger">${esc(S.errors[0])}</div>` : ""}
                    <div class="preview-wrap"><table class="preview-table"><thead><tr><th>Date</th><th>Meal</th><th>Food</th><th class="num">kcal</th><th class="num">P</th><th class="num">C</th><th class="num">F</th></tr></thead><tbody>${rows
                        .map(
                            (row) =>
                                `<tr><td>${esc(row.logged_at)}</td><td>${esc(row.meal_type || "—")}</td><td>${esc(row.description || "Imported meal")}</td><td class="num">${fmt(row.calories)}</td><td class="num">${fmt(row.protein_g, 1)}</td><td class="num">${fmt(row.carbs_g, 1)}</td><td class="num">${fmt(row.fat_g, 1)}</td></tr>`,
                        )
                        .join("")}</tbody></table></div>
                    ${S.rows.length > rows.length ? `<div class="muted small">Showing the first ${rows.length} of ${fmt(S.rows.length)} rows.</div>` : ""}
                    <div class="actions"><button class="btn btn-primary" id="do-import" ${!API?.canCallTools || S.rows.length === 0 ? "disabled" : ""}>Import ${fmt(S.rows.length)} meals</button><button class="btn" id="back-map">Back to mapping</button></div>
                    ${!API?.canCallTools ? `<div class="notice warning">This host cannot save from the importer. Continue in chat and ask Munch to import the file data instead.</div>` : ""}
                </section>`;
            }
            function importingView() {
                const ratio = S.progress?.total
                    ? S.progress.done / S.progress.total
                    : 0;
                return `${stepper()}<section class="card section-stack" aria-live="polite">
                    <div><div class="eyebrow">Importing</div><h1 class="title">Saving meal history</h1><p class="subtitle">${esc(S.progress?.label || "Validating the first batch…")}</p></div>
                    ${progress(ratio * 100, "Import progress")}
                    <div class="muted small">Batch ${fmt(S.progress?.done || 0)} of ${fmt(S.progress?.total || 0)}</div>
                </section>`;
            }
            function doneView() {
                const result = S.result || {
                    created: 0,
                    deduplicated: 0,
                    failed: 0,
                };
                const success =
                    result.failed === 0 && result.chunkErrors.length === 0;
                return `${stepper()}<section class="card section-stack" aria-live="polite">
                    <div class="status-row"><span class="status-icon ${success ? "success" : "warning"}" aria-hidden="true">${success ? "✓" : "!"}</span><div><div class="eyebrow">Import complete</div><h1 class="title">${success ? "Meal history imported" : "Import finished with issues"}</h1><p class="subtitle">${esc(S.fileName || "CSV file")}</p></div></div>
                    <div class="result-grid"><div class="result-stat"><strong>${fmt(result.created)}</strong><span>Imported</span></div><div class="result-stat"><strong>${fmt(result.deduplicated)}</strong><span>Already logged</span></div><div class="result-stat"><strong>${fmt(result.failed)}</strong><span>Failed</span></div><div class="result-stat"><strong>${fmt(S.skipped)}</strong><span>Skipped</span></div></div>
                    ${result.chunkErrors.map((error) => `<div class="notice danger">${esc(error)}</div>`).join("")}
                    ${result.rowErrors
                        .slice(0, 5)
                        .map(
                            (error) =>
                                `<div class="notice warning">Line ${fmt(error.line)}: ${esc(error.message)}</div>`,
                        )
                        .join("")}
                    <div class="actions"><button class="btn btn-primary" id="finish">Return to chat</button><button class="btn" id="restart">Import another file</button></div>
                </section>`;
            }
            function render() {
                const root = document.getElementById("root");
                const displayMode =
                    API?.hostContext?.displayMode ||
                    document.documentElement.dataset.displayMode ||
                    "inline";
                if (S.step === "launch" && displayMode !== "fullscreen") {
                    root.innerHTML = launchView();
                } else {
                    if (S.step === "launch") S.step = "file";
                    const view =
                        S.step === "file"
                            ? fileView()
                            : S.step === "map"
                              ? mappingView()
                              : S.step === "preview"
                                ? previewView()
                                : S.step === "importing"
                                  ? importingView()
                                  : doneView();
                    root.innerHTML = `<div class="import-shell">${view}</div>`;
                }
                wire();
            }
            function autoMap() {
                S.mapping = {};
                for (const field of FIELDS)
                    S.mapping[field.key] = findColumn(
                        S.table.headers,
                        ALIASES[field.key] || [],
                    );
                const dateColumn = S.mapping.logged_at;
                if (dateColumn >= 0) {
                    const sniffed = sniffDateFormat(
                        S.table.rows
                            .slice(0, 50)
                            .map((row) => row[dateColumn] || ""),
                    );
                    S.dateFormat = sniffed.format;
                    S.dateAmbiguous = sniffed.ambiguous;
                }
            }
            async function loadFile(file) {
                S.errors = [];
                S.warnings = [];
                try {
                    const bytes = new Uint8Array(await file.arrayBuffer());
                    S.table = parseCsv(bytes);
                    if (!S.table.headers.length || !S.table.rows.length)
                        throw new Error(
                            "This file does not contain any meal rows.",
                        );
                    S.fileName = file.name;
                    autoMap();
                    S.step = "map";
                } catch (error) {
                    S.errors = [
                        error?.message || "The file could not be read.",
                    ];
                    S.step = "file";
                }
                render();
            }
            function normalizeMealType(raw) {
                const value = String(raw || "")
                    .trim()
                    .toLowerCase();
                if (/breakfast|morning|frühstück/.test(value))
                    return "breakfast";
                if (/lunch|midday|mittag/.test(value)) return "lunch";
                if (/dinner|supper|evening|abend/.test(value)) return "dinner";
                if (/snack/.test(value)) return "snack";
                return undefined;
            }
            function normalizeTime(raw) {
                const value = String(raw || "").trim();
                if (!value) return "";
                const match =
                    /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]m)?$/i.exec(value);
                if (!match) return "";
                let hour = Number(match[1]);
                const minute = Number(match[2]);
                const second = Number(match[3] || 0);
                const meridiem = (match[4] || "").toLowerCase();
                if (meridiem === "pm" && hour < 12) hour += 12;
                if (meridiem === "am" && hour === 12) hour = 0;
                if (hour > 23 || minute > 59 || second > 59) return "";
                return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}:${String(second).padStart(2, "0")}`;
            }
            function mapped(row, key) {
                const index = S.mapping[key];
                return index >= 0 ? row[index] : undefined;
            }
            function numeric(row, key) {
                const value = parseNumber(
                    mapped(row, key),
                    S.table.decimalSeparator,
                );
                return value == null ? undefined : value;
            }
            function buildRows() {
                S.rows = [];
                S.skipped = 0;
                S.errors = [];
                S.warnings = [];
                if ((S.mapping.logged_at ?? -1) < 0) {
                    S.errors.push("Map a date column before continuing.");
                    return false;
                }
                for (let index = 0; index < S.table.rows.length; index++) {
                    const source = S.table.rows[index];
                    if (isDeletedRow(source, S.mapping.deleted ?? -1)) {
                        S.skipped++;
                        continue;
                    }
                    const date = toIsoDate(
                        mapped(source, "logged_at"),
                        S.dateFormat,
                    );
                    if (!date) {
                        S.skipped++;
                        continue;
                    }
                    const separateTime = normalizeTime(mapped(source, "time"));
                    const embeddedTime = /[T ](\d{1,2}:\d{2}(?::\d{2})?)/.exec(
                        String(mapped(source, "logged_at") || ""),
                    );
                    const time =
                        separateTime || normalizeTime(embeddedTime?.[1]);
                    const row = {
                        logged_at: time ? `${date}T${time}` : date,
                        description: String(
                            mapped(source, "description") ||
                                `${S.sourceApp || "Imported"} meal`,
                        ).trim(),
                        meal_type: normalizeMealType(
                            mapped(source, "meal_type"),
                        ),
                        calories: numeric(source, "calories"),
                        protein_g: numeric(source, "protein_g"),
                        carbs_g: numeric(source, "carbs_g"),
                        fat_g: numeric(source, "fat_g"),
                        fiber_g: numeric(source, "fiber_g"),
                        sugar_g: numeric(source, "sugar_g"),
                        alcohol_g: alcoholTracked()
                            ? numeric(source, "alcohol_g")
                            : undefined,
                        notes:
                            String(mapped(source, "notes") || "").trim() ||
                            undefined,
                        source_line: S.table.sourceLines[index],
                    };
                    if (S.energyUnit === "kj" && row.calories != null)
                        row.calories =
                            Math.round((row.calories / 4.184) * 10) / 10;
                    for (const key of Object.keys(row))
                        if (row[key] === undefined || row[key] === "")
                            delete row[key];
                    S.rows.push(row);
                }
                if (!S.rows.length)
                    S.errors.push(
                        "No valid rows remain after applying the mapping and date format.",
                    );
                if (S.skipped)
                    S.warnings.push(
                        `${S.skipped} row${S.skipped === 1 ? "" : "s"} will be skipped because the date is unreadable or the source marks it deleted.`,
                    );
                return S.rows.length > 0;
            }
            function chunks(array, size) {
                const out = [];
                for (let index = 0; index < array.length; index += size)
                    out.push(array.slice(index, index + size));
                return out;
            }
            function collect(payload, dryRun) {
                if (!payload) return;
                if (dryRun) {
                    for (const row of payload.results || [])
                        if (row.error)
                            S.result.rowErrors.push({
                                line: row.source_line,
                                message: row.error.message,
                            });
                    return;
                }
                const summary = payload.summary || {};
                S.result.created += summary.created || 0;
                S.result.deduplicated += summary.deduplicated || 0;
                S.result.failed += summary.failed || 0;
                for (const row of payload.results || [])
                    if (row.error)
                        S.result.rowErrors.push({
                            line: row.source_line,
                            message: row.error.message,
                        });
            }
            async function runImport() {
                if (!API?.canCallTools || !S.rows.length || S.busy) return;
                S.busy = true;
                S.step = "importing";
                const batches = chunks(
                    S.rows,
                    Math.max(1, CFG.max_rows_per_call || 50),
                );
                S.progress = {
                    done: 0,
                    total: batches.length,
                    label: "Validating the first batch…",
                };
                S.result = {
                    created: 0,
                    deduplicated: 0,
                    failed: 0,
                    rowErrors: [],
                    chunkErrors: [],
                };
                render();
                for (let index = 0; index < batches.length; index++) {
                    const batch = batches[index];
                    const totalKcal = batch.reduce(
                        (sum, row) => sum + (row.calories || 0),
                        0,
                    );
                    const args = {
                        meals: batch,
                        expected_row_count: batch.length,
                        rows_skipped: index === 0 ? S.skipped : 0,
                        source_app: S.sourceApp || undefined,
                        dry_run: index === 0,
                    };
                    if (batch.every((row) => row.calories != null))
                        args.expected_total_kcal = totalKcal;
                    try {
                        if (index === 0) {
                            const check = await API.callTool(
                                CFG.import_tool_name,
                                args,
                                { timeoutMs: 90000 },
                            );
                            collect(check?.structuredContent, true);
                            if (check?.structuredContent?.status === "failed")
                                throw new Error(
                                    "The validation pass found blocking errors.",
                                );
                            args.dry_run = false;
                        }
                        S.progress.label = `Importing rows ${fmt(batch[0].source_line)}–${fmt(batch[batch.length - 1].source_line)}…`;
                        render();
                        const result = await API.callTool(
                            CFG.import_tool_name,
                            args,
                            { timeoutMs: 90000 },
                        );
                        collect(result?.structuredContent, false);
                    } catch (error) {
                        S.result.chunkErrors.push(
                            `Rows ${batch[0].source_line}–${batch[batch.length - 1].source_line}: ${error?.message || "Import failed"}`,
                        );
                        S.result.failed += batch.length;
                    }
                    S.progress.done = index + 1;
                    render();
                }
                S.busy = false;
                S.step = "done";
                render();
                API.updateModelContext(
                    `Meal import finished: ${S.result.created} imported, ${S.result.deduplicated} already logged, ${S.result.failed} failed, and ${S.skipped} skipped.`,
                ).catch(() => {});
            }
            function reset() {
                Object.assign(S, {
                    step: "file",
                    table: null,
                    mapping: {},
                    dateFormat: "iso",
                    dateAmbiguous: false,
                    energyUnit: "kcal",
                    sourceApp: "",
                    rows: [],
                    skipped: 0,
                    errors: [],
                    warnings: [],
                    busy: false,
                    progress: null,
                    result: null,
                    fileName: "",
                });
                render();
            }
            function wire() {
                document
                    .getElementById("open-importer")
                    ?.addEventListener("click", async () => {
                        const result =
                            await API?.requestDisplayMode("fullscreen");
                        S.step = "file";
                        if (result?.mode !== "fullscreen")
                            document.documentElement.dataset.displayMode =
                                "fullscreen";
                        render();
                    });
                document
                    .getElementById("close-importer")
                    ?.addEventListener("click", async () => {
                        await API?.requestDisplayMode("inline");
                        S.step = "launch";
                        document.documentElement.dataset.displayMode = "inline";
                        render();
                    });
                const file = document.getElementById("file");
                if (file)
                    file.addEventListener(
                        "change",
                        (event) =>
                            event.target.files?.[0] &&
                            loadFile(event.target.files[0]),
                    );
                const drop = document.getElementById("drop");
                if (drop) {
                    drop.addEventListener("dragover", (event) => {
                        event.preventDefault();
                        drop.classList.add("over");
                    });
                    drop.addEventListener("dragleave", () =>
                        drop.classList.remove("over"),
                    );
                    drop.addEventListener("drop", (event) => {
                        event.preventDefault();
                        drop.classList.remove("over");
                        const selected = event.dataTransfer?.files?.[0];
                        if (selected) loadFile(selected);
                    });
                }
                document.querySelectorAll(".map-select").forEach((select) =>
                    select.addEventListener("change", (event) => {
                        S.mapping[event.target.dataset.field] = Number(
                            event.target.value,
                        );
                    }),
                );
                document
                    .getElementById("date-format")
                    ?.addEventListener("change", (event) => {
                        S.dateFormat = event.target.value;
                        S.dateAmbiguous = false;
                        render();
                    });
                document
                    .getElementById("energy-unit")
                    ?.addEventListener("change", (event) => {
                        S.energyUnit = event.target.value;
                    });
                document
                    .getElementById("source-app")
                    ?.addEventListener("input", (event) => {
                        S.sourceApp = event.target.value.trim();
                    });
                document
                    .getElementById("to-preview")
                    ?.addEventListener("click", () => {
                        if (buildRows()) S.step = "preview";
                        render();
                    });
                document
                    .getElementById("back-file")
                    ?.addEventListener("click", reset);
                document
                    .getElementById("back-map")
                    ?.addEventListener("click", () => {
                        S.step = "map";
                        render();
                    });
                document
                    .getElementById("do-import")
                    ?.addEventListener("click", runImport);
                document
                    .getElementById("restart")
                    ?.addEventListener("click", reset);
                document
                    .getElementById("finish")
                    ?.addEventListener("click", async () => {
                        await API?.requestDisplayMode("inline");
                        S.step = "launch";
                        document.documentElement.dataset.displayMode = "inline";
                        render();
                    });
            }

            initWidget({
                name: "import-meals-widget",
                displayModes: ["inline", "fullscreen"],
                loading: '<div class="card loading">Preparing importer…</div>',
                coerce(payload) {
                    if (!payload || typeof payload !== "object") return null;
                    if (payload.import_tool_name || payload.tz) return payload;
                    return payload.structuredContent || null;
                },
                render(data) {
                    if (data && typeof data === "object")
                        CFG = { ...CFG, ...data };
                    render();
                },
                sample: CFG,
                onReady(api) {
                    API = api;
                    render();
                },
                onHostContext(context) {
                    API.hostContext = { ...API.hostContext, ...context };
                    render();
                },
            });
        </script>
    </body>
</html>
