<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Review Meal</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .review-head {
                padding: 15px;
                border-bottom: 1px solid var(--panel-border);
            }
            .item {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 12px;
                padding: 13px 15px;
                border-bottom: 1px solid var(--panel-border);
            }
            .item:last-child {
                border-bottom: 0;
            }
            .item-name {
                font-weight: 680;
            }
            .item-kcal {
                font-weight: 720;
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
            }
            .item-meta {
                margin-top: 3px;
                color: var(--text-dim);
                font-size: 12px;
            }
            .item-flags {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin-top: 7px;
            }
            .summary {
                padding: 15px;
                background: var(--panel-muted);
            }
            .total {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 12px;
            }
            .total strong {
                font-size: 20px;
                font-variant-numeric: tabular-nums;
            }
            .assumptions {
                margin-top: 12px;
            }
            details {
                border: 1px solid var(--panel-border);
                border-radius: var(--radius-sm);
                background: var(--panel);
            }
            summary {
                padding: 10px 12px;
                cursor: pointer;
                font-weight: 650;
                font-size: 12.5px;
            }
            .detail-body {
                padding: 0 12px 11px;
                color: var(--text-dim);
                font-size: 12px;
            }
            .adjust-panel {
                display: none;
                margin-top: 12px;
                padding: 12px;
                border: 1px solid var(--panel-border);
                border-radius: var(--radius-sm);
                background: var(--panel);
            }
            .adjust-panel.open {
                display: grid;
                gap: 9px;
            }
            .quick-adjust {
                display: flex;
                gap: 7px;
                flex-wrap: wrap;
            }
            .success-state {
                padding: 18px;
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            const SAMPLE = {
                id: "draft-1",
                version: 1,
                status: "awaiting_confirmation",
                source_mode: "photo",
                meal_type: "dinner",
                description: "Homemade chicken, rice, and vegetables",
                ready_for_confirmation: true,
                items: [
                    {
                        position: 0,
                        name: "Roasted chicken thigh",
                        portion_label: "1 medium thigh",
                        nutrients: {
                            calories: 285,
                            protein_g: 28,
                            carbs_g: 0,
                            fat_g: 19,
                        },
                        source_type: "model_estimate",
                        confidence: 0.82,
                        assumptions: ["Fork used as a scale reference"],
                    },
                    {
                        position: 1,
                        name: "Rice",
                        portion_label: "about 1 cup",
                        nutrients: {
                            calories: 205,
                            protein_g: 4,
                            carbs_g: 45,
                            fat_g: 0.4,
                        },
                        source_type: "model_estimate",
                        confidence: 0.58,
                        assumptions: [],
                    },
                ],
                totals: {
                    calories: 490,
                    protein_g: 32,
                    carbs_g: 45,
                    fat_g: 19.4,
                },
                assumptions: ["Fork used as the primary scale reference"],
                next_question: null,
            };
            let REVIEW = null;
            let API = null;
            let BUSY = false;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.review) return payload.review;
                if (payload.structuredContent?.review)
                    return payload.structuredContent.review;
                if (payload.id && Array.isArray(payload.items)) return payload;
                return null;
            }
            function confidence(item) {
                if (item.confidence == null) return null;
                if (item.confidence < 0.6)
                    return { text: "Needs a closer look", warn: true };
                if (item.confidence < 0.8)
                    return { text: "Estimated", warn: false };
                return { text: "High confidence", warn: false };
            }
            function sourceLabel(item) {
                const source = item.provider || item.source_type || "estimate";
                if (/usda/i.test(source)) return "USDA match";
                if (/open.?food/i.test(source)) return "Package database";
                if (/menu|restaurant/i.test(source)) return "Menu match";
                return source.replaceAll("_", " ");
            }
            function impactLine(review) {
                const totals = review.totals || {};
                const pieces = [];
                if (totals.calories != null)
                    pieces.push(`${fmt(totals.calories)} kcal`);
                if (totals.protein_g != null)
                    pieces.push(`${fmt(totals.protein_g, 1)} g protein`);
                return pieces.length
                    ? `This meal adds ${pieces.join(" and ")}.`
                    : "Review the estimate before logging.";
            }
            function render(review) {
                REVIEW = review;
                const items = Array.isArray(review.items) ? review.items : [];
                const totals = review.totals || {};
                const low = items.filter(
                    (item) => item.confidence != null && item.confidence < 0.6,
                );
                const itemHtml = items
                    .map((item) => {
                        const nutrients = item.nutrients || {};
                        const score = confidence(item);
                        return `<div class="item">
            <div><div class="item-name">${esc(item.name || "Food item")}</div>
            <div class="item-meta">${esc(item.portion_label || "Portion estimated")} · ${fmt(nutrients.protein_g, 1)} g protein · ${fmt(nutrients.carbs_g, 1)} g carbs · ${fmt(nutrients.fat_g, 1)} g fat</div>
            <div class="item-flags">${score ? `<span class="chip${score.warn ? " warn" : ""}">${esc(score.text)}</span>` : ""}<span class="chip">${esc(sourceLabel(item))}</span></div></div>
            <div class="item-kcal">${fmt(nutrients.calories)} kcal</div>
        </div>`;
                    })
                    .join("");
                const assumptions = [
                    ...new Set([
                        ...(review.assumptions || []),
                        ...items.flatMap((item) => item.assumptions || []),
                    ]),
                ];
                const question = review.next_question?.prompt;
                document.getElementById("root").innerHTML =
                    `<article class="card" aria-label="Meal review">
        <div class="review-head"><div class="eyebrow">Review ${esc(review.meal_type || "meal")}</div><h1>${esc(review.description || "Review meal estimate")}</h1><div class="meta">${review.source_mode === "photo" ? "Estimated from photo" : esc(review.source_mode || "Nutrition estimate")}</div></div>
        <div>${itemHtml || '<div class="empty"><strong>No items found</strong>Continue in chat to identify the meal.</div>'}</div>
        <div class="summary"><div class="total"><span>Estimated meal</span><strong>${fmt(totals.calories)} kcal</strong></div><div class="meta num">${fmt(totals.protein_g, 1)} g protein · ${fmt(totals.carbs_g, 1)} g carbs · ${fmt(totals.fat_g, 1)} g fat</div>
        <div class="notice${low.length ? " warn" : ""}" style="margin-top:12px"><strong>${low.length ? `${low.length} item${low.length === 1 ? "" : "s"} worth reviewing` : "Estimate ready"}</strong><div class="caption">${esc(question || impactLine(review))}</div></div>
        ${assumptions.length ? `<details class="assumptions"><summary>How Munch estimated this</summary><div class="detail-body">${assumptions.map((value) => `<div>• ${esc(value)}</div>`).join("")}</div></details>` : ""}
        <div class="actions"><button class="btn btn-primary" id="confirm" ${review.ready_for_confirmation ? "" : "disabled"}>Log meal</button><button class="btn" id="adjust">Adjust</button></div>
        <div class="adjust-panel" id="adjust-panel"><strong>What should change?</strong><div class="quick-adjust"><button class="btn btn-sm" data-prompt="The portion is smaller than estimated.">Smaller portion</button><button class="btn btn-sm" data-prompt="The portion is larger than estimated.">Larger portion</button><button class="btn btn-sm" data-prompt="One or more foods were identified incorrectly.">Wrong food</button><button class="btn btn-sm" data-prompt="I need to change ingredients or preparation details.">Ingredients</button></div><div class="caption">Choose a starting point, then finish the correction in chat.</div></div>
        <div class="status" id="status" role="status" aria-live="polite"></div></div>
    </article>`;
                document
                    .getElementById("confirm")
                    ?.addEventListener("click", confirm);
                document
                    .getElementById("adjust")
                    ?.addEventListener("click", () =>
                        document
                            .getElementById("adjust-panel")
                            ?.classList.toggle("open"),
                    );
                document
                    .querySelectorAll("[data-prompt]")
                    .forEach((button) =>
                        button.addEventListener("click", () =>
                            adjust(button.dataset.prompt),
                        ),
                    );
            }
            function setBusy(value, message) {
                BUSY = value;
                document
                    .querySelectorAll("button")
                    .forEach(
                        (button) =>
                            (button.disabled =
                                value ||
                                (button.id === "confirm" &&
                                    !REVIEW?.ready_for_confirmation)),
                    );
                const status = document.getElementById("status");
                if (status) status.textContent = message || "";
            }
            async function adjust(detail) {
                if (BUSY) return;
                setBusy(true, "Opening correction in chat…");
                const prompt = `${detail} Recalculate meal draft ${REVIEW.id} version ${REVIEW.version}, ask only the highest-impact follow-up question if needed, then show the updated meal review before logging.`;
                try {
                    if (API?.canUpdateModelContext) {
                        await API.updateModelContext(prompt, {
                            meal_draft_id: REVIEW.id,
                            expected_version: REVIEW.version,
                            requested_adjustment: detail,
                        });
                    }
                    if (API?.canSendMessages) {
                        await API.sendMessage(
                            API.canUpdateModelContext
                                ? "Help me adjust this meal estimate."
                                : prompt,
                        );
                        setBusy(
                            false,
                            "Continue in chat to make the correction.",
                        );
                    } else {
                        setBusy(false, "Tell ChatGPT what should change.");
                    }
                } catch (error) {
                    setBusy(false, "Tell ChatGPT what should change.");
                }
            }
            async function confirm() {
                if (
                    BUSY ||
                    !API?.canCallTools ||
                    !REVIEW?.ready_for_confirmation
                )
                    return;
                setBusy(true, "Saving meal…");
                try {
                    await API.callTool("confirm_meal_draft", {
                        draft_id: REVIEW.id,
                        expected_version: REVIEW.version,
                        confirmed: true,
                    });
                    await API.updateModelContext(
                        `Meal draft ${REVIEW.id} was confirmed and logged.`,
                    ).catch(() => {});
                    const totals = REVIEW.totals || {};
                    document.getElementById("root").innerHTML =
                        `<article class="card success-state"><div class="row"><div class="icon-badge success">✓</div><div><div class="eyebrow">Meal logged</div><h1>${esc(REVIEW.description || "Meal")}</h1><div class="meta num">${fmt(totals.calories)} kcal · ${fmt(totals.protein_g, 1)} g protein · ${fmt(totals.carbs_g, 1)} g carbs · ${fmt(totals.fat_g, 1)} g fat</div></div></div></article>`;
                } catch (error) {
                    setBusy(false, error?.message || "Unable to log the meal.");
                }
            }
            initWidget({
                name: "meal-review-widget",
                loading: '<div class="card empty">Preparing meal review…</div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
