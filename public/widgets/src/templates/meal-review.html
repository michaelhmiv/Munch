<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Review Meal</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            .review-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                padding: 12px 13px 9px;
                border-bottom: 1px solid var(--panel-border);
            }
            .review-head-main {
                min-width: 0;
            }
            .review-head h1 {
                font-size: 16px;
            }
            .review-kcal {
                flex: 0 0 auto;
                font-size: 18px;
                font-weight: 760;
                font-variant-numeric: tabular-nums;
            }
            .item {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 10px;
                padding: 9px 13px;
                border-bottom: 1px solid var(--panel-border);
            }
            .item:last-child {
                border-bottom: 0;
            }
            .item-name {
                font-weight: 680;
            }
            .item-kcal {
                font-weight: 720;
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
            }
            .item-meta {
                margin-top: 2px;
                color: var(--text-dim);
                font-size: 11.5px;
            }
            .summary {
                padding: 10px 13px 12px;
                background: var(--panel-muted);
            }
            .summary-line {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }
            .macro-line {
                color: var(--text-dim);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            .review-flags {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                margin-top: 7px;
            }
            .review-detail {
                margin-top: 8px;
                border: 1px solid var(--panel-border);
                border-radius: var(--radius-sm);
                background: var(--panel);
            }
            .review-detail > summary {
                min-height: 44px;
                display: flex;
                align-items: center;
                padding: 0 10px;
                cursor: pointer;
                color: var(--text-dim);
                font-weight: 650;
                font-size: 12px;
            }
            .detail-body {
                display: grid;
                gap: 8px;
                padding: 0 10px 10px;
                color: var(--text-dim);
                font-size: 11.5px;
                line-height: 1.4;
            }
            .source-row {
                display: grid;
                gap: 2px;
                padding-top: 7px;
                border-top: 1px solid var(--panel-border);
            }
            .source-row:first-child {
                border-top: 0;
                padding-top: 0;
            }
            .source-row strong {
                color: var(--text);
                font-size: 12px;
            }
            .question-line {
                margin-top: 8px;
                padding: 8px 10px;
                border: 1px solid var(--panel-border);
                border-radius: var(--radius-sm);
                background: var(--panel);
                font-size: 12px;
            }
            .question-line.warn {
                border-color: color-mix(
                    in srgb,
                    var(--warn) 38%,
                    var(--panel-border)
                );
            }
            .summary .actions {
                margin-top: 9px;
            }
            .summary .status:empty {
                min-height: 0;
                margin-top: 0;
            }
            .success-state {
                padding: 12px;
            }
            @media (max-width: 420px) {
                .review-head,
                .item,
                .summary {
                    padding-inline: 10px;
                }
                .item-meta {
                    overflow-wrap: anywhere;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            const SAMPLE = {
                id: "draft-1",
                version: 1,
                status: "awaiting_confirmation",
                source_mode: "photo",
                meal_type: "dinner",
                description: "Homemade chicken, rice, and vegetables",
                ready_for_confirmation: true,
                items: [
                    {
                        position: 0,
                        name: "Roasted chicken thigh",
                        portion_label: "1 medium thigh",
                        nutrients: {
                            calories: 285,
                            protein_g: 28,
                            carbs_g: 0,
                            fat_g: 19,
                        },
                        source_type: "model_estimate",
                        confidence: 0.82,
                        assumptions: ["Fork used as a scale reference"],
                    },
                    {
                        position: 1,
                        name: "Rice",
                        portion_label: "about 1 cup",
                        nutrients: {
                            calories: 205,
                            protein_g: 4,
                            carbs_g: 45,
                            fat_g: 0.4,
                        },
                        source_type: "model_estimate",
                        confidence: 0.58,
                        assumptions: [],
                    },
                ],
                totals: {
                    calories: 490,
                    protein_g: 32,
                    carbs_g: 45,
                    fat_g: 19.4,
                },
                assumptions: ["Fork used as the primary scale reference"],
                next_question: null,
            };
            let REVIEW = null;
            let API = null;
            let BUSY = false;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.review) return payload.review;
                if (payload.structuredContent?.review)
                    return payload.structuredContent.review;
                if (payload.id && Array.isArray(payload.items)) return payload;
                return null;
            }
            function sourceLabel(item) {
                const source = item.provider || item.source_type || "estimate";
                if (/usda/i.test(source)) return "USDA match";
                if (/open.?food/i.test(source)) return "Package database";
                if (/menu|restaurant/i.test(source)) return "Menu match";
                if (/model_estimate/i.test(source)) return "Model estimate";
                if (/saved_food/i.test(source)) return "Saved food";
                if (/past_meal/i.test(source)) return "Past meal";
                return source.replaceAll("_", " ");
            }
            function displayTitle(review, items) {
                if (items.length === 1 && items[0]?.name) return items[0].name;
                if (
                    review.description &&
                    review.description.length <= 72 &&
                    review.description !== "Meal review"
                )
                    return review.description;
                return items.length
                    ? `${items.length} foods`
                    : review.description || "Meal estimate";
            }
            function render(review) {
                REVIEW = review;
                const items = Array.isArray(review.items) ? review.items : [];
                const totals = review.totals || {};
                const low = items.filter(
                    (item) => item.confidence != null && item.confidence < 0.6,
                );
                const estimated = items.filter(
                    (item) =>
                        item.source_type === "model_estimate" ||
                        (item.confidence != null && item.confidence < 0.8),
                );
                const itemHtml = items
                    .map((item) => {
                        const nutrients = item.nutrients || {};
                        const macro = [
                            nutrients.protein_g != null
                                ? `P ${fmt(nutrients.protein_g, 1)}g`
                                : null,
                            nutrients.carbs_g != null
                                ? `C ${fmt(nutrients.carbs_g, 1)}g`
                                : null,
                            nutrients.fat_g != null
                                ? `F ${fmt(nutrients.fat_g, 1)}g`
                                : null,
                        ]
                            .filter(Boolean)
                            .join(" · ");
                        return `<div class="item">
            <div><div class="item-name">${esc(item.name || "Food item")}</div>
            <div class="item-meta">${esc(item.portion_label || "Portion estimated")}${macro ? ` · ${esc(macro)}` : ""}</div></div>
            <div class="item-kcal">${fmt(nutrients.calories)} kcal</div>
        </div>`;
                    })
                    .join("");
                const assumptions = [
                    ...new Set([
                        ...(review.assumptions || []),
                        ...items.flatMap((item) => item.assumptions || []),
                    ]),
                ];
                const sourceRows = items
                    .map((item) => {
                        const confidence =
                            item.confidence == null
                                ? ""
                                : ` · ${Math.round(item.confidence * 100)}% confidence`;
                        const itemAssumptions = Array.isArray(item.assumptions)
                            ? item.assumptions
                            : [];
                        return `<div class="source-row"><strong>${esc(item.name || "Food")}</strong><span>${esc(sourceLabel(item))}${esc(confidence)}</span>${itemAssumptions.length ? `<span>${itemAssumptions.map((value) => esc(value)).join(" · ")}</span>` : ""}</div>`;
                    })
                    .join("");
                const question = review.next_question?.prompt;
                const detail =
                    review.description || sourceRows || assumptions.length
                        ? `<details class="review-detail"><summary>Estimate details${assumptions.length ? ` · ${assumptions.length} assumption${assumptions.length === 1 ? "" : "s"}` : ""}</summary><div class="detail-body">${review.description ? `<div><strong>Original description</strong><br />${esc(review.description)}</div>` : ""}${sourceRows}${assumptions.length ? `<div><strong>Meal assumptions</strong><br />${assumptions.map((value) => esc(value)).join(" · ")}</div>` : ""}</div></details>`
                        : "";
                const reviewTitle = displayTitle(review, items);
                const flags = [
                    estimated.length
                        ? `${estimated.length} estimated`
                        : "Sources matched",
                    low.length
                        ? `${low.length} needs review`
                        : "Estimate ready",
                ];
                document.getElementById("root").innerHTML =
                    `<article class="card" aria-label="Meal review">
        <div class="review-head"><div class="review-head-main"><div class="eyebrow">Review ${esc(review.meal_type || "meal")}</div><h1>${esc(reviewTitle)}</h1></div>${totals.calories != null ? `<div class="review-kcal">${fmt(totals.calories)} kcal</div>` : ""}</div>
        <div>${itemHtml || '<div class="empty"><strong>No items found</strong>Continue in chat to identify the meal.</div>'}</div>
        <div class="summary"><div class="summary-line"><div class="macro-line">P ${fmt(totals.protein_g, 1)}g · C ${fmt(totals.carbs_g, 1)}g · F ${fmt(totals.fat_g, 1)}g</div></div>
        <div class="review-flags">${flags.map((flag, index) => `<span class="chip${index === 1 && low.length ? " warn" : ""}">${esc(flag)}</span>`).join("")}</div>
        ${question ? `<div class="question-line${low.length ? " warn" : ""}"><strong>Needs input</strong><br />${esc(question)}</div>` : ""}
        ${detail}
        <div class="actions"><button class="btn btn-primary" id="confirm" ${review.ready_for_confirmation ? "" : "disabled"}>Log meal</button><button class="btn" id="adjust">Adjust</button></div>
        <div class="status" id="status" role="status" aria-live="polite"></div></div>
    </article>`;
                document
                    .getElementById("confirm")
                    ?.addEventListener("click", confirm);
                document
                    .getElementById("adjust")
                    ?.addEventListener("click", adjust);
            }
            function setBusy(value, message) {
                BUSY = value;
                document
                    .querySelectorAll("button")
                    .forEach(
                        (button) =>
                            (button.disabled =
                                value ||
                                (button.id === "confirm" &&
                                    !REVIEW?.ready_for_confirmation)),
                    );
                const status = document.getElementById("status");
                if (status) status.textContent = message || "";
            }
            async function adjust() {
                if (BUSY) return;
                setBusy(true, "Opening correction in chat…");
                const detail =
                    "I want to adjust this meal review. Ask what needs to change, then update only the affected items.";
                const prompt = `${detail} Recalculate meal draft ${REVIEW.id} version ${REVIEW.version}, ask only the highest-impact follow-up question if needed, then show the updated meal review before logging.`;
                try {
                    if (API?.canUpdateModelContext) {
                        await API.updateModelContext(prompt, {
                            meal_draft_id: REVIEW.id,
                            expected_version: REVIEW.version,
                            requested_adjustment: "user_requested_adjustment",
                        });
                    }
                    if (API?.canSendMessages) {
                        await API.sendMessage(
                            API.canUpdateModelContext
                                ? "Help me adjust this meal review."
                                : prompt,
                        );
                        setBusy(
                            false,
                            "Continue in chat to make the correction.",
                        );
                    } else {
                        setBusy(false, "Tell ChatGPT what should change.");
                    }
                } catch (error) {
                    setBusy(false, "Tell ChatGPT what should change.");
                }
            }
            async function confirm() {
                if (
                    BUSY ||
                    !API?.canCallTools ||
                    !REVIEW?.ready_for_confirmation
                )
                    return;
                setBusy(true, "Saving meal…");
                try {
                    await API.callTool("confirm_meal_draft", {
                        draft_id: REVIEW.id,
                        expected_version: REVIEW.version,
                        confirmed: true,
                    });
                    await API.updateModelContext(
                        `Meal draft ${REVIEW.id} was confirmed and logged.`,
                    ).catch(() => {});
                    const totals = REVIEW.totals || {};
                    const items = Array.isArray(REVIEW.items) ? REVIEW.items : [];
                    const title = displayTitle(REVIEW, items);
                    document.getElementById("root").innerHTML =
                        `<article class="card success-state"><div class="row"><div class="icon-badge success">✓</div><div><div class="eyebrow">Meal logged</div><h1>${esc(title)}</h1><div class="meta num">${fmt(totals.calories)} kcal · P ${fmt(totals.protein_g, 1)}g · C ${fmt(totals.carbs_g, 1)}g · F ${fmt(totals.fat_g, 1)}g</div></div></div></article>`;
                } catch (error) {
                    setBusy(false, error?.message || "Unable to log the meal.");
                }
            }
            initWidget({
                name: "meal-review-widget",
                loading: '<div class="card empty">Preparing meal review…</div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
